<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz — Speaking Games</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
h1,h2,h3,.big,.gname,.prompt{font-family:'Poppins',sans-serif}
body{background:#faf9ff;color:#1e293b;min-height:100vh}
/* ---------- topbar ---------- */
.top{background:linear-gradient(120deg,#7c3aed,#db2777 55%,#f59e0b);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:40;box-shadow:0 6px 22px rgba(124,58,237,.28)}
.top .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.menu-btn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.7);color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;text-decoration:none}
.menu-btn:hover{background:rgba(255,255,255,.38)}
.score{display:flex;align-items:center;gap:8px}
.score .pts{background:#fff;color:#7c3aed;font-family:'Poppins';font-weight:900;font-size:18px;padding:5px 14px;border-radius:20px;min-width:56px;text-align:center}
.score .rst{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
/* ---------- filtros ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:#ede9fe;border-radius:12px;padding:3px}
.seg button{border:none;background:none;color:#5b21b6;font-weight:800;padding:7px 15px;border-radius:9px;cursor:pointer;font-size:13px}
.seg button.on{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff}
.themes{display:flex;gap:6px;flex-wrap:wrap}
.th{border:2px solid #ece7fb;background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.th.on{border-color:#7c3aed;background:#f3efff;color:#5b21b6}
/* ---------- grade de jogos ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gcard{border:none;border-radius:20px;padding:22px 18px;cursor:pointer;color:#fff;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.gcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.gcard .em{font-size:44px;line-height:1}
.gcard .gname{font-size:20px;font-weight:800;margin-top:10px}
.gcard .gt{font-size:13px;opacity:.92;font-weight:600;margin-top:2px}
/* ---------- tela de atividade ---------- */
.stageWrap{display:none;max-width:1000px;margin:0 auto;padding:16px}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins';font-weight:800;font-size:16px;color:#fff;padding:8px 16px;border-radius:14px}
.stage{border-radius:26px;padding:56px 30px;text-align:center;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;box-shadow:0 10px 34px rgba(124,58,237,.14);background:#fff;border:1px solid #ece7fb}
.prompt{font-size:clamp(30px,5.4vw,54px);font-weight:800;line-height:1.25;color:#1e293b}
.emojibig{font-size:clamp(70px,15vw,140px);line-height:1}
.wordbig{font-size:clamp(34px,6vw,60px);font-weight:900;font-family:'Poppins';letter-spacing:.5px}
.hintline{font-size:16px;color:#64748b;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.scrchip{background:#f3efff;color:#5b21b6;border:2px solid #ddd6fe;border-radius:14px;padding:12px 20px;font-size:clamp(20px,3.4vw,30px);font-weight:800;font-family:'Poppins'}
.duo{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.duo button{flex:1;min-width:200px;border:none;border-radius:22px;padding:44px 20px;font-family:'Poppins';font-weight:900;font-size:clamp(26px,4.4vw,40px);color:#fff;cursor:pointer;transition:transform .1s}
.duo button:active{transform:scale(.97)}
.duoA{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.duoB{background:linear-gradient(135deg,#db2777,#f472b6)}
.duo button.dim{opacity:.45;filter:grayscale(.3)}
.reveal{font-size:clamp(24px,4vw,38px);font-weight:800;color:#16a34a;font-family:'Poppins'}
.tf{display:flex;gap:16px}
.tf .t{font-size:26px;font-weight:900;font-family:'Poppins';padding:14px 30px;border-radius:16px;border:3px solid}
.tf .tt{color:#16a34a;border-color:#86efac;background:#f0fdf4}
.tf .tf2{color:#dc2626;border-color:#fecaca;background:#fef2f2}
/* dado */
.die{width:132px;height:132px;border-radius:24px;background:#fff;border:3px solid #fecdd3;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:'Poppins';color:#e11d48;padding:12px;text-align:center;box-shadow:0 8px 20px rgba(225,29,72,.18);transition:transform .5s}
.die.rolling{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
/* roda */
.wheelbox{position:relative;width:230px;height:230px}
.wheel{width:230px;height:230px;border-radius:50%;border:8px solid #fff;box-shadow:0 8px 24px rgba(124,58,237,.25);transition:transform 2.6s cubic-bezier(.17,.67,.2,1)}
.wpin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}
/* botões de ação */
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.act{border:none;border-radius:16px;padding:16px 26px;font-family:'Poppins';font-weight:800;font-size:17px;cursor:pointer}
.next{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff}
.done{background:linear-gradient(135deg,#16a34a,#4ade80);color:#fff}
.ghost{background:#fff;border:2px solid #ddd6fe;color:#6d28d9}
.small{background:#f1edfd;color:#5b21b6;border:1px solid #ddd6fe;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.flash{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;font-family:'Poppins';font-weight:800;padding:10px 22px;border-radius:20px;z-index:99;box-shadow:0 8px 20px rgba(22,163,74,.35);animation:up 1s forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>🎮 Speaking Games</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="score"><span style="color:#fff;font-weight:700;font-size:13px">Points</span><span class="pts" id="pts">0</span><button class="rst" onclick="resetPoints()">reset</button></div>
    <a class="menu-btn" href="index.html">← Menu</a>
  </div>
</div></div>

<!-- HOME: filtros + grade -->
<div class="wrap" id="home">
  <div class="filters">
    <div class="seg" id="lvlSeg">
      <button data-l="all" class="on" onclick="setLevel('all')">All</button>
      <button data-l="A1" onclick="setLevel('A1')">A1</button>
      <button data-l="A2" onclick="setLevel('A2')">A2</button>
    </div>
    <div class="themes" id="themeRow"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ATIVIDADE -->
<div class="stageWrap" id="stageWrap">
  <div class="stagebar">
    <button class="small" onclick="goHome()">← Games</button>
    <span class="badge" id="gBadge"></span>
    <span style="width:70px"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="actions">
    <button class="act next" onclick="nextItem()">▶ Next</button>
    <button class="act done" onclick="addPoint()">✓ Got it &nbsp;+1</button>
    <button class="act ghost" onclick="randomFrom()">🎲 Surprise</button>
  </div>
</div>

<script src="engine/speaking-games.js?v=4"></script>
<script src="engine/teacher-mode.js?v=4"></script>
<script>
var SG=window.SPEAKING_GAMES;
var level='all', theme='all', curGame=null, curItem=null, lastKey=null, isRandom=false;
var points=0;
try{ points=parseInt(localStorage.getItem('sg_points')||'0',10)||0; }catch(e){}

function el(id){return document.getElementById(id);}
function paintPts(){ el('pts').textContent=points; }
function addPoint(){ points++; try{localStorage.setItem('sg_points',points);}catch(e){} paintPts();
  var f=document.createElement('div'); f.className='flash'; f.textContent='+1 ⭐'; document.body.appendChild(f);
  setTimeout(function(){ f.remove(); }, 1000);
  el('pts').classList.remove('pop'); void el('pts').offsetWidth; el('pts').classList.add('pop');
}
function resetPoints(){ points=0; try{localStorage.setItem('sg_points',0);}catch(e){} paintPts(); }

/* ---------- HOME ---------- */
function renderThemes(){
  var h='<button class="th '+(theme==='all'?'on':'')+'" onclick="setTheme(\'all\')">🌈 All</button>';
  h+=SG.themes.map(function(t){ return '<button class="th '+(theme===t.id?'on':'')+'" onclick="setTheme(\''+t.id+'\')">'+t.emoji+' '+t.name+'</button>'; }).join('');
  el('themeRow').innerHTML=h;
}
function renderGrid(){
  el('grid').innerHTML=SG.games.map(function(g){
    return '<button class="gcard" style="background:linear-gradient(140deg,'+g.c1+','+g.c2+')" onclick="openGame(\''+g.id+'\')">'+
      '<div class="em">'+g.emoji+'</div>'+
      '<div><div class="gname">'+g.name+'</div><div class="gt">'+g.tag+'</div></div></button>';
  }).join('');
}
function setLevel(l){ level=l; Array.prototype.forEach.call(el('lvlSeg').children,function(b){ b.classList.toggle('on', b.getAttribute('data-l')===l); }); }
function setTheme(t){ theme=t; renderThemes(); }

/* ---------- abrir jogo ---------- */
function goHome(){ el('stageWrap').style.display='none'; el('home').style.display='block'; }
function openGame(id){ isRandom=(id==='random'); curGame=id; lastKey=null; el('home').style.display='none'; el('stageWrap').style.display='block'; drawAndRender(); }
function randomFrom(){ isRandom=true; drawAndRender(); }

function gameMeta(id){ for(var i=0;i<SG.games.length;i++) if(SG.games[i].id===id) return SG.games[i]; return null; }

function drawAndRender(){
  var d = isRandom ? SG.random({level:level,theme:theme,last:lastKey})
                   : SG.draw(curGame,{level:level,theme:theme,last:lastKey});
  if(!d||!d.item){ el('stage').innerHTML='<div class="hintline">No activities for this level/theme. Try another filter.</div>'; return; }
  curItem=d.item; lastKey=JSON.stringify(d.item);
  var g=gameMeta(d.gameId);
  el('gBadge').style.background='linear-gradient(135deg,'+g.c1+','+g.c2+')';
  el('gBadge').innerHTML=g.emoji+' '+g.name+(isRandom?' &nbsp;<span style="opacity:.8;font-size:12px">· surprise</span>':'');
  el('stage').innerHTML=renderItem(g,d.item);
}
function nextItem(){ drawAndRender(); }

/* ---------- render por tipo ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;'); }
function renderItem(g,it){
  var t=g.t, h='';
  if(t==='prompt'){
    h='<div class="prompt pop">'+esc(it.q)+'</div>';
  }else if(t==='scramble'){
    var words=SG.scramble(it.scr);
    h='<div class="hintline">Say it in the correct order:</div>'+
      '<div class="chips">'+words.map(function(w){return '<span class="scrchip">'+esc(w)+'</span>';}).join('')+'</div>'+
      '<button class="small" onclick="reveal(this,\''+esc(it.a).replace(/"/g,'')+'\')">Show answer</button>';
  }else if(t==='guess'){
    h='<div class="emojibig pop">'+(it.e||'❓')+'</div><div class="wordbig">'+esc(it.w).toUpperCase()+'</div>'+
      '<div class="hintline">Describe it in English — don’t say the word!</div>'+
      '<div class="teacher-only" style="margin-top:6px;color:#94a3b8;font-size:14px">💡 '+(it.clues||[]).map(esc).join(' · ')+'</div>';
  }else if(t==='duo'){
    h='<div class="hintline">Choose one and say WHY:</div>'+
      '<div class="duo"><button class="duoA" onclick="dpick(this,1)">'+esc(it.a)+'</button>'+
      '<button class="duoB" onclick="dpick(this,2)">'+esc(it.b)+'</button></div>';
  }else if(t==='dice'){
    h='<div class="hintline">'+esc(it.name)+(theme!=='all'?' · talk about '+themeName(theme):'')+'</div>'+
      '<div class="die" id="die">🎲 tap Roll</div>'+
      '<button class="small" onclick="rollDie()">🎲 Roll</button>';
    setTimeout(function(){ window._faces=it.faces; }, 0);
  }else if(t==='wheel'){
    h=wheelHTML(it);
  }else if(t==='truefalse'){
    h='<div class="prompt pop">'+esc(it.q)+'</div>'+
      '<div class="hintline">True or false? If it’s false, say the correct sentence.</div>'+
      '<button class="small" onclick="revealTF(this,'+(it.a?1:0)+')">Show answer</button>';
  }else if(t==='picture'){
    h='<div class="emojibig pop">'+(it.e||'🖼️')+'</div><div class="hintline">Describe what you see. What is happening?</div>';
  }else{
    h='<div class="prompt">'+esc(it.q||it.w||'Speak!')+'</div>';
  }
  return h;
}
function themeName(id){ for(var i=0;i<SG.themes.length;i++) if(SG.themes[i].id===id) return SG.themes[i].name; return ''; }
function reveal(btn,ans){ btn.outerHTML='<div class="reveal pop">✓ '+ans+'</div>'; }
function revealTF(btn,isTrue){ btn.outerHTML='<div class="tf"><span class="t '+(isTrue?'tt':'tf2')+'">'+(isTrue?'TRUE ✓':'FALSE ✗')+'</span></div>'; }
function dpick(btn,which){
  var d=btn.parentNode; d.children[0].classList.toggle('dim',which!==1); d.children[1].classList.toggle('dim',which!==2);
}

/* dado */
function rollDie(){
  var faces=window._faces||['Speak!']; var die=el('die'); if(!die) return;
  die.classList.remove('rolling'); void die.offsetWidth; die.classList.add('rolling');
  var n=0, iv=setInterval(function(){ die.textContent=faces[Math.floor(Math.random()*faces.length)]; if(++n>6){ clearInterval(iv); } }, 70);
}

/* roda */
function wheelHTML(it){
  var seg=it.seg, n=seg.length, cols=['#7c3aed','#db2777','#f59e0b','#16a34a','#0ea5a5','#e11d48','#6366f1','#ea580c'];
  var stops=[], step=360/n;
  for(var i=0;i<n;i++){ stops.push(cols[i%cols.length]+' '+(i*step)+'deg '+((i+1)*step)+'deg'); }
  window._wheel=it;
  return '<div class="hintline">'+esc(it.name)+' — spin and talk for 20 seconds!</div>'+
    '<div class="wheelbox"><div class="wpin">🔻</div>'+
    '<div class="wheel" id="wheel" style="background:conic-gradient('+stops.join(',')+')"></div></div>'+
    '<div id="wheelOut" style="min-height:40px"></div>'+
    '<button class="small" onclick="spinWheel()">🎡 Spin</button>';
}
function spinWheel(){
  var it=window._wheel; if(!it) return;
  var w=el('wheel'); var idx=Math.floor(Math.random()*it.seg.length);
  var turns=4+Math.floor(Math.random()*3); var deg=turns*360+Math.floor(Math.random()*360);
  window._wdeg=(window._wdeg||0)+deg; w.style.transform='rotate('+window._wdeg+'deg)';
  el('wheelOut').innerHTML='';
  setTimeout(function(){ el('wheelOut').innerHTML='<div class="reveal pop">🗣️ '+esc(it.seg[idx])+'</div>'; }, 2650);
}

/* ---------- init ---------- */
paintPts(); renderThemes(); renderGrid();
</script>
</body>
</html>
