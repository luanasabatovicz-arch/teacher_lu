<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadro de Estrelas</title>
<meta name="theme-color" content="#F8F1E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estrelas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Alegreya+SC:wght@700&family=Mali:wght@500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}code{font-size:.9em;background:rgba(139,107,74,.12);padding:1px 5px;border-radius:5px}
.acct{display:flex;flex-wrap:wrap;gap:8px}
.or{display:flex;align-items:center;gap:10px;margin:18px auto 10px;max-width:320px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.loginform{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:0 auto}
.linkbtn{border:0;background:none;color:#8B6B4A;text-decoration:underline;cursor:pointer;font:600 .85rem var(--f-body);padding:4px}.card.empty.login .ico{width:64px;display:block;margin:0 auto 8px}

/* Layout: a family star board — sticky header with kid switcher, one column of cards, fixed bottom tabs; full-screen big-picture view for the kids */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --surface-2:#E2E8F3; --ink:#1B2440; --muted:#5A6583; --line:#D1D9E6;
  --accent:#3152CF; --accent-ink:#FFFFFF;
  --star:#F2B705; --star-soft:#FFF2C2; --star-ink:#6E4F00;
  --good:#16865A; --good-soft:#DBF2E6; --warn:#B87D00; --warn-soft:#FFF0C7; --bad:#CC3F37; --bad-soft:#FBE2E0;
  --lamp-case:#1B2440; --lamp-off:#3A4466; --toast-bg:#1B2440; --toast-fg:#F3F6FC;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11162A; --surface:#1A2138; --surface-2:#252D48; --ink:#E8ECF7; --muted:#9BA5C3; --line:#2E3755;
  --accent:#7F98FF; --accent-ink:#0E1430;
  --star:#F5C433; --star-soft:#3A3115; --star-ink:#F5C433;
  --good:#3DC48B; --good-soft:#163A2C; --warn:#F0B429; --warn-soft:#3A2F12; --bad:#F06C63; --bad-soft:#3F1F22;
  --lamp-case:#0B0F1E; --lamp-off:#2C3554; --toast-bg:#E8ECF7; --toast-fg:#11162A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11162A; --surface:#1A2138; --surface-2:#252D48; --ink:#E8ECF7; --muted:#9BA5C3; --line:#2E3755;
  --accent:#7F98FF; --accent-ink:#0E1430;
  --star:#F5C433; --star-soft:#3A3115; --star-ink:#F5C433;
  --good:#3DC48B; --good-soft:#163A2C; --warn:#F0B429; --warn-soft:#3A2F12; --bad:#F06C63; --bad-soft:#3F1F22;
  --lamp-case:#0B0F1E; --lamp-off:#2C3554; --toast-bg:#E8ECF7; --toast-fg:#11162A;
  color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.star{width:1em;height:1em;fill:var(--star);flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.45rem;line-height:1.1;margin:0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h1 .star{width:1.05em;height:1.05em}
.date{color:var(--muted);font-size:.85rem;margin-top:2px}
.date::first-letter{text-transform:uppercase}
.kids-sw{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.kids-sw::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;white-space:nowrap;flex:none}
.chip.plain{padding:5px 14px}
.chip[aria-pressed="true"]{border-color:var(--kid,var(--accent));background:color-mix(in srgb,var(--kid,var(--accent)) 15%,var(--surface))}
.chip .bal{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);display:inline-flex;align-items:center;gap:3px;font-weight:500}

/* avatar */
.ava{--size:32px;width:var(--size);height:var(--size);border-radius:50%;display:grid;place-items:center;background:var(--kid,var(--surface-2));font-size:calc(var(--size)*.55);overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 2px var(--kid,var(--line))}
.ava img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;transition:opacity .8s ease}
.ava img.off{opacity:0}

/* generic */
main{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.sec-h .meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.pts{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px;color:var(--star-ink);white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.btn.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:0 10px;font-size:.82rem}
.btn[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin-bottom:4px}
.banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem}

/* hero */
.hero{background:color-mix(in srgb,var(--kid) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--kid) 38%,var(--line));border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .ava{--size:76px}
.hero .name{font-family:var(--f-display);font-size:1.7rem;font-weight:600;line-height:1.05}
.hero .sub{color:var(--muted);font-size:.88rem;margin-top:3px}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:2px}
.bignum{font-family:var(--f-display);font-weight:700;font-size:2.7rem;line-height:1;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bignum .star{width:.78em;height:.78em}
.midnum{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.light{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.lamps{display:inline-flex;gap:5px;padding:5px 7px;background:var(--lamp-case);border-radius:999px}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--lamp-off)}
.lamp.on.verde{background:#2FCB86;box-shadow:0 0 8px #2FCB86}
.lamp.on.amarelo{background:#FFC21A;box-shadow:0 0 8px #FFC21A}
.lamp.on.vermelho{background:#FF5248;box-shadow:0 0 8px #FF5248}
.goal{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;flex-wrap:wrap}
.bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--star);border-radius:inherit;min-width:4px}
.bonus{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--star-soft);border-radius:12px;padding:10px 12px;font-weight:600}

/* tasks */
.period{margin:14px 0 6px}
.period:first-of-type{margin-top:0}
.tasklist{display:flex;flex-direction:column;gap:6px}
.task{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.task .box svg{width:16px;height:16px;stroke:currentColor;stroke-width:3;fill:none}
.task .emo{font-size:1.3rem;width:28px;text-align:center;flex:none}
.task .lbl{flex:1;min-width:0}
.task.done{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.task.done .box{background:var(--good);border-color:var(--good);color:#fff}
.task.done .lbl{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}

/* behaviors */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.beh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--good) 30%,var(--line));background:var(--surface);text-align:left;cursor:pointer;min-height:54px}
.beh:active{background:var(--good-soft)}
.beh .emo{font-size:1.3rem;flex:none}
.beh .lbl{flex:1;min-width:0;font-size:.9rem;line-height:1.25}
.beh .pts{color:var(--good)}
.badlist{display:flex;flex-direction:column;gap:6px}
.badrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.badrow:first-child{border-top:0;padding-top:0}
.badrow .emo{font-size:1.3rem;text-align:center}
.badrow .lbl{min-width:0;font-size:.92rem;line-height:1.25}
.badrow .lbl small{display:block;color:var(--warn);font-weight:600;font-size:.78rem}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
details[open].card summary::after{content:"–"}
.extra-form{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px;min-width:0;width:100%}
input[type="checkbox"]{width:18px;height:18px;min-height:0;accent-color:var(--accent)}

/* entries */
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .emo{font-size:1.2rem;text-align:center}
.entry .lbl{min-width:0}
.entry .who{font-size:.78rem;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.dayhead:first-child{margin-top:0}
.dayhead .tot{font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;gap:12px}

/* rewards */
.rewards{display:flex;flex-direction:column;gap:10px}
.reward{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.reward.is-goal{border-color:var(--star);background:color-mix(in srgb,var(--star) 9%,var(--surface))}
.reward .emo{font-size:1.8rem;text-align:center}
.reward .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.reward .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.reward .name{font-weight:600}
.reward .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.goalbtn{border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:2px 0;text-align:left}
.goalbtn.on{color:var(--star-ink)}

/* chart */
.weeksum{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.9rem}
.weeksum span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--kid);flex:none}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.col{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.up,.down{display:flex;justify-content:center;gap:3px}
.up{align-items:flex-end;border-bottom:1.5px solid var(--line)}
.down{align-items:flex-start}
.b{width:min(16px,42%);background:var(--kid);border-radius:4px 4px 0 0}
.down .b{border-radius:0 0 4px 4px;opacity:.5}
.dl{font-size:.72rem;color:var(--muted);text-align:center;white-space:nowrap}
.dl.today{color:var(--ink);font-weight:700}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}

/* settings */
.edit-list{display:flex;flex-direction:column;gap:8px}
.erow{display:grid;grid-template-columns:52px minmax(0,1fr) 72px 40px;gap:8px;align-items:center}
.erow.rule{grid-template-columns:minmax(0,1fr) 40px}
.tbox{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.topts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.88rem}
.topts select{width:auto;min-height:34px}
.topts label{display:inline-flex;gap:6px;align-items:center}
.emo-in{text-align:center;font-size:1.2rem;padding:0}
.xbtn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}
.xbtn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.xbtn.sm{width:32px;height:32px;font-size:.95rem}
.kidedit{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--kid) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--kid) 30%,var(--line))}
.kidedit .ava{--size:56px}
.kidfields{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;min-width:0}
.kidfields .full{grid-column:1/-1}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--line);flex:none}
.ph.main{border-color:var(--kid)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;border:0;background:rgba(17,22,42,.72);color:#fff;font-size:.7rem;font-weight:700;cursor:pointer}
.ph .rm{top:2px;right:2px;width:20px;height:20px;border-radius:50%}
.ph .mk{left:2px;bottom:2px;right:2px;border-radius:6px;padding:1px 0}
.addph{width:56px;height:56px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:1.5rem;cursor:pointer;background:none}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;font-weight:600}
.savebar .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.74rem;border-radius:10px;cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500}
#toast button{border:0;background:color-mix(in srgb,var(--toast-fg) 18%,transparent);color:var(--toast-fg);font-weight:700;border-radius:8px;padding:6px 10px;cursor:pointer}

/* kids mode */
#kidsmode{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.km-top{max-width:1100px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.km-top h2{font-family:var(--f-display);font-weight:600;font-size:1.6rem;margin:0;display:flex;align-items:center;gap:8px}
.km-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;max-width:1100px;margin:0 auto}
.km-card{background:color-mix(in srgb,var(--kid) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--kid) 45%,var(--line));border-radius:26px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;min-width:0}
.km-card .ava{--size:150px;box-shadow:0 0 0 5px var(--kid),0 10px 28px color-mix(in srgb,var(--kid) 35%,transparent)}
.km-name{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1}
.km-stars{font-family:var(--f-display);font-weight:700;font-size:4.2rem;line-height:1;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.km-stars .star{width:.8em;height:.8em}
.km-card .lamps{padding:8px 11px;gap:9px}
.km-card .lamp{width:26px;height:26px}
.km-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.km-tile{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:var(--surface);border:2.5px dashed var(--line);position:relative}
.km-tile.done{border:2.5px solid var(--good);background:var(--good-soft)}
.km-tile.done::after{content:"✓";position:absolute;right:-7px;top:-7px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;font-size:.85rem;display:grid;place-items:center;font-weight:800;font-family:var(--f-body)}
.km-goal{width:100%;display:flex;flex-direction:column;gap:8px;font-weight:600}
.km-goal .bar{height:16px}
.km-rules{max-width:1100px;margin:16px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.km-rules h3{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0 0 10px}
.km-rules ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:1.1rem;font-weight:500}

/* ===== camada colorida ===== */
:root{--c1:#FF4F79;--c2:#FF8A1F;--c3:#FFC61A;--c4:#14C3B0;--c5:#3B82FF;--c6:#9A5BFF;--c7:#2FCB6E;
  --bg:#FFF8EC;--surface:#FFFFFF;--line:#F0DFC8;--ink:#2A1F4A;--muted:#6E6290;--accent:#3B82FF;
  --rainbow:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c7),var(--c4),var(--c5),var(--c6))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#FF6A8E;--c2:#FF9B3D;--c3:#FFD23F;--c4:#2ED8C3;--c5:#5C9BFF;--c6:#AE7BFF;--c7:#45DB85;
  --bg:#1A1433;--surface:#251D45;--line:#3B3166;--ink:#F4F0FF;--muted:#B5AAD8;--accent:#5C9BFF}}
:root[data-theme="dark"]{--c1:#FF6A8E;--c2:#FF9B3D;--c3:#FFD23F;--c4:#2ED8C3;--c5:#5C9BFF;--c6:#AE7BFF;--c7:#45DB85;
  --bg:#1A1433;--surface:#251D45;--line:#3B3166;--ink:#F4F0FF;--muted:#B5AAD8;--accent:#5C9BFF}

html,body{background-color:var(--bg)}
body{background-image:
  radial-gradient(circle at 6% 8%, color-mix(in srgb,var(--c1) 26%,transparent) 0 90px, transparent 91px),
  radial-gradient(circle at 96% 18%, color-mix(in srgb,var(--c4) 26%,transparent) 0 120px, transparent 121px),
  radial-gradient(circle at 10% 62%, color-mix(in srgb,var(--c3) 30%,transparent) 0 110px, transparent 111px),
  radial-gradient(circle at 92% 78%, color-mix(in srgb,var(--c6) 24%,transparent) 0 140px, transparent 141px),
  radial-gradient(circle, color-mix(in srgb,var(--c5) 22%,transparent) 2px, transparent 2.5px);
  background-size:auto,auto,auto,auto,26px 26px;background-attachment:fixed}
header.top,body::before{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
h1{font-size:1.6rem;font-weight:700}
.rainbow span{display:inline-block}
.date{font-weight:600}
#kids-on{background:var(--rainbow);border:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 4px 14px color-mix(in srgb,var(--c6) 35%,transparent)}

.chip{border-width:2px;border-color:color-mix(in srgb,var(--kid,var(--c5)) 45%,var(--line));background:color-mix(in srgb,var(--kid,var(--c5)) 10%,var(--surface))}
.chip[aria-pressed="true"]{background:var(--kid,var(--c5));border-color:var(--kid,var(--c5));color:#fff}
.chip[aria-pressed="true"] .bal{color:#fff}
.chip.plain[aria-pressed="true"]{background:var(--rainbow);border-color:transparent}

.card{border-radius:20px;border-width:2px}
.card.tone{background:color-mix(in srgb,var(--tone) 11%,var(--surface));border-color:color-mix(in srgb,var(--tone) 45%,var(--line))}
.card.tone .sec-h h2{display:inline-flex;align-items:center;gap:10px;color:color-mix(in srgb,var(--tone) 55%,var(--ink))}
.card.tone .sec-h h2::before{content:"";width:16px;height:16px;border-radius:5px;background:var(--tone);transform:rotate(12deg);flex:none;box-shadow:3px 3px 0 color-mix(in srgb,var(--tone) 35%,transparent)}
details.card.tone summary{color:color-mix(in srgb,var(--tone) 55%,var(--ink))}

.hero{background:
  radial-gradient(circle at 92% 12%, color-mix(in srgb,var(--c3) 45%,transparent) 0 46px, transparent 47px),
  radial-gradient(circle at 78% 92%, color-mix(in srgb,var(--c4) 30%,transparent) 0 30px, transparent 31px),
  linear-gradient(135deg, color-mix(in srgb,var(--kid) 34%,var(--surface)), color-mix(in srgb,var(--kid) 10%,var(--surface)) 70%);
  border:2px solid var(--kid);border-radius:24px;box-shadow:0 8px 24px color-mix(in srgb,var(--kid) 22%,transparent)}
.hero .ava{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--kid)}
.hero .name{color:color-mix(in srgb,var(--kid) 60%,var(--ink));font-weight:700}
.bignum{color:var(--ink)}
.bignum .star{filter:drop-shadow(0 2px 0 color-mix(in srgb,var(--c2) 60%,transparent))}
.bar{height:12px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.bar>i{background:var(--rainbow);background-size:300px 100%}
.bonus{background:var(--rainbow);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bonus .btn.primary{background:#fff;color:var(--ink);border-color:#fff;text-shadow:none}

.period{color:color-mix(in srgb,var(--c) 60%,var(--ink));display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));padding:3px 10px;border-radius:999px}
.task{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.task .box{border-color:color-mix(in srgb,var(--c) 70%,var(--line));background:var(--surface)}
.task.done{background:color-mix(in srgb,var(--c7) 22%,var(--surface));border-color:var(--c7)}
.task.done .box{background:var(--c7);border-color:var(--c7)}
.task .pts{background:color-mix(in srgb,var(--c3) 30%,var(--surface));padding:2px 8px;border-radius:999px;color:var(--ink)}

.beh{background:color-mix(in srgb,var(--c) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 55%,var(--line))}
.beh:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.beh:active{transform:scale(.97);background:color-mix(in srgb,var(--c) 34%,var(--surface))}
.beh .pts{background:var(--c);color:#fff;padding:2px 9px;border-radius:999px;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.badrow{border-top-color:color-mix(in srgb,var(--c2) 30%,var(--line))}
.btn.warn{background:var(--c3);border-color:var(--c3);color:#3D2A00}
.btn.bad{background:var(--c1);border-color:var(--c1);color:#fff}
.btn.primary{background:var(--c5);border-color:var(--c5);color:#fff}

.reward{background:color-mix(in srgb,var(--c) 13%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:18px}
.reward .emo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.reward{grid-template-columns:52px 1fr auto}
.reward.is-goal{border-color:var(--c3);box-shadow:0 0 0 3px color-mix(in srgb,var(--c3) 45%,transparent)}

.entry .emo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c3) 25%,var(--surface));font-size:1.05rem}
.entry{border-top-color:color-mix(in srgb,var(--tone,var(--line)) 25%,var(--line))}
.dayhead .label{background:color-mix(in srgb,var(--c5) 18%,var(--surface));color:color-mix(in srgb,var(--c5) 60%,var(--ink));padding:3px 10px;border-radius:999px}
.b{width:min(18px,44%)}

.tbox{background:color-mix(in srgb,var(--tone,var(--c5)) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tone,var(--c5)) 30%,var(--line))}
.kidedit{background:color-mix(in srgb,var(--kid) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--kid) 45%,var(--line))}
input,select{border-width:2px}
.savebar{background:var(--rainbow);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.savebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.savebar .btn.primary{background:#fff;color:var(--ink);border-color:#fff;text-shadow:none}

nav.tabs{background:var(--surface);border-top:0;box-shadow:0 -4px 18px color-mix(in srgb,var(--c6) 14%,transparent)}
nav.tabs::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--rainbow)}
nav button[data-tab="hoje"]{--t:var(--c5)} nav button[data-tab="avatar"]{--t:var(--c2)} nav button[data-tab="recompensas"]{--t:var(--c1)}
nav button[data-tab="historico"]{--t:var(--c4)} nav button[data-tab="natal"]{--t:var(--c7)} nav button[data-tab="ajustes"]{--t:var(--c6)}
nav button{color:color-mix(in srgb,var(--t) 70%,var(--muted))}
nav button[aria-current="page"]{background:var(--t);color:#fff}

#kidsmode{background-color:var(--bg);background-image:
  radial-gradient(circle at 5% 10%, color-mix(in srgb,var(--c1) 35%,transparent) 0 120px, transparent 121px),
  radial-gradient(circle at 95% 8%, color-mix(in srgb,var(--c3) 40%,transparent) 0 150px, transparent 151px),
  radial-gradient(circle at 50% 100%, color-mix(in srgb,var(--c4) 30%,transparent) 0 220px, transparent 221px),
  radial-gradient(circle at 2% 90%, color-mix(in srgb,var(--c6) 30%,transparent) 0 130px, transparent 131px),
  radial-gradient(circle, color-mix(in srgb,var(--c2) 30%,transparent) 2.5px, transparent 3px);
  background-size:auto,auto,auto,auto,30px 30px}
.km-top h2{font-weight:700}
.km-card{background:linear-gradient(160deg, color-mix(in srgb,var(--kid) 32%,var(--surface)), color-mix(in srgb,var(--kid) 8%,var(--surface)));border:3px solid var(--kid);box-shadow:0 12px 30px color-mix(in srgb,var(--kid) 28%,transparent)}
.km-card .ava{box-shadow:0 0 0 6px var(--surface),0 0 0 12px var(--kid),0 14px 30px color-mix(in srgb,var(--kid) 40%,transparent)}
.km-name{color:color-mix(in srgb,var(--kid) 60%,var(--ink))}
.km-stars .star{filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--c2) 70%,transparent))}
.km-tile{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:3px dashed color-mix(in srgb,var(--c) 60%,var(--line))}
.km-tile.done{background:color-mix(in srgb,var(--c) 40%,var(--surface));border:3px solid var(--c)}
.km-tile.done::after{background:var(--c7)}
.km-goal .bar{height:18px}
.km-rules{background:color-mix(in srgb,var(--c3) 16%,var(--surface));border:3px solid var(--c3)}
.km-rules li::marker{color:var(--c1);font-family:var(--f-display);font-weight:700}

/* ===== diversão ===== */
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c6) 40%,var(--line));background:color-mix(in srgb,var(--c6) 12%,var(--surface));font-size:1.15rem;cursor:pointer;display:grid;place-items:center}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
.floaty{position:fixed;z-index:46;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:700;font-size:1.6rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.12);animation:floatup 1.25s ease-out forwards}
.floaty.good{color:var(--c7)} .floaty.big{color:var(--c6);font-size:2.4rem} .floaty.warn{color:#D99A00} .floaty.bad{color:var(--c1)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badges.center{justify-content:center;margin-top:0}
.lvl,.fire{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
.lvl{background:var(--rainbow);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.fire{background:color-mix(in srgb,var(--c2) 22%,var(--surface));color:color-mix(in srgb,var(--c2) 55%,var(--ink));border:1.5px solid color-mix(in srgb,var(--c2) 50%,transparent)}
.lvbar>i{background:linear-gradient(90deg,var(--c6),var(--c5),var(--c4))}
.challenge{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:20px;border:2.5px dashed var(--c6);
  background:linear-gradient(120deg,color-mix(in srgb,var(--c6) 24%,var(--surface)),color-mix(in srgb,var(--c1) 18%,var(--surface)) 55%,color-mix(in srgb,var(--c3) 26%,var(--surface)))}
.ch-l{min-width:0;flex:1 1 220px}
.ch-k{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:color-mix(in srgb,var(--c6) 65%,var(--ink))}
.ch-t{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.2;margin-top:2px;text-wrap:balance}
.ch-btn{background:var(--c6);border-color:var(--c6);color:#fff;min-height:44px}
.ch-done,.ch-pts{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:color-mix(in srgb,var(--c7) 60%,var(--ink));background:color-mix(in srgb,var(--c7) 22%,var(--surface));padding:8px 14px;border-radius:999px}
.ch-pts{color:color-mix(in srgb,var(--c6) 60%,var(--ink));background:color-mix(in srgb,var(--surface) 70%,transparent)}
.challenge.big{max-width:1100px;margin:0 auto 16px}
.challenge.big .ch-t{font-size:1.7rem}
.km-ava{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.km-ava:active .ava{transform:scale(.95)}
.km-card .lvl{font-size:1rem;padding:5px 14px}
.km-card .fire{font-size:1rem;padding:5px 14px}
@media (prefers-reduced-motion: reduce){.floaty{animation:none;opacity:0}}

/* ===== avatar ===== */
.avsvg{display:block;width:100%;height:auto}
.avhero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center;padding:16px;border-radius:24px;border:2px solid var(--kid);
  background:linear-gradient(135deg,color-mix(in srgb,var(--kid) 26%,var(--surface)),color-mix(in srgb,var(--c3) 14%,var(--surface)))}
.avbig{border-radius:20px;overflow:hidden;box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--kid),0 10px 26px color-mix(in srgb,var(--kid) 30%,transparent)}
.avinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.avinfo .name{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.1;color:color-mix(in srgb,var(--kid) 60%,var(--ink))}
.avcount{font-weight:600}
.avcount b{font-family:var(--f-display);font-size:1.3rem;color:var(--c6)}
.avstats{display:flex;flex-wrap:wrap;gap:6px}
.avstats span{background:color-mix(in srgb,var(--surface) 75%,transparent);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
@media (max-width:520px){.avhero{grid-template-columns:1fr}.avbig{max-width:240px;margin:0 auto;width:100%}}
.avcats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.avcats::-webkit-scrollbar{display:none}
.avcat{flex:none;border:2px solid color-mix(in srgb,var(--c2) 45%,var(--line));background:color-mix(in srgb,var(--c2) 10%,var(--surface));border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.avcat[aria-pressed="true"]{background:var(--c2);border-color:var(--c2);color:#fff}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.avsub{margin:16px 0 8px}
.avsub:first-child{margin-top:0}
.avtile{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;min-width:0}
.avtile .avsvg{border-radius:11px}
.avtile:hover{border-color:color-mix(in srgb,var(--kid) 60%,var(--line))}
.avtile.on{border-color:var(--kid);box-shadow:0 0 0 3px color-mix(in srgb,var(--kid) 35%,transparent)}

.avtag{position:absolute;top:8px;left:8px;right:8px;margin:0 auto;width:max-content;max-width:calc(100% - 16px);padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.newb{border:0;cursor:pointer;display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.85rem;background:var(--c3);color:#3D2A00;animation:pulse 1.2s ease-in-out infinite}
.km-ava{position:relative;width:min(230px,100%)}
.km-av{border-radius:24px;box-shadow:0 0 0 5px var(--surface),0 0 0 10px var(--kid),0 14px 30px color-mix(in srgb,var(--kid) 40%,transparent)}

.bd-row.top .sun{width:21%}.bd-row.top .rainbow{width:36%;margin-top:-6px}.bd-row.top .dragonfly{width:26%}

[hidden]{display:none!important}

/* ===== aquarela: estilo do app inteiro (visual único e claro, como papel) ===== */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
  --bg:#F8F1E4; --surface:#FFFCF6; --surface-2:#F1E7D6; --ink:#4B3A2A; --muted:#8A765F; --line:#E6D9C3;
  --accent:#3F6DB0; --accent-ink:#FFFFFF;
  --c1:#D9737F; --c2:#E39A45; --c3:#D9A532; --c4:#5E9C9D; --c5:#3F6DB0; --c6:#9670BF; --c7:#6A9845;
  --star:#E6B23C; --star-soft:#F6EBCB; --star-ink:#8B6B4A;
  --good:#5E8A3A; --good-soft:#E7F1D8; --warn:#B07F18; --warn-soft:#F7ECCB; --bad:#C2585F; --bad-soft:#F7E0DE;
  --lamp-case:#5B4632; --lamp-off:#7A6550; --toast-bg:#5B4632; --toast-fg:#FFF8EE;
  --rainbow:linear-gradient(90deg,#F2A0A6,#F5BE8A,#F4DD8A,#B9D99A,#A9C7E8,#C3B1E1);
  --paper-shadow:0 1px 2px rgba(120,90,50,.08),0 8px 24px rgba(120,90,50,.09);
  --f-display:"Mali","Fredoka",system-ui,sans-serif; --f-title:"Alegreya SC",Georgia,serif;
  color-scheme:light}
html,body{background-color:var(--bg)}
body{background-image:
  radial-gradient(ellipse 280px 210px at 6% 6%, rgba(169,199,232,.32), transparent 70%),
  radial-gradient(ellipse 260px 230px at 97% 20%, rgba(242,160,166,.22), transparent 70%),
  radial-gradient(ellipse 300px 230px at 4% 58%, rgba(244,221,138,.28), transparent 70%),
  radial-gradient(ellipse 280px 250px at 96% 86%, rgba(185,169,227,.24), transparent 70%);
  background-size:auto;background-attachment:fixed}
header.top,body::before{background:rgba(248,241,228,.86)}
.ico{display:inline-block;width:32px;flex:none;line-height:0}
.ico svg{display:block;width:100% !important;height:auto}
h1{font-family:var(--f-title);font-weight:700;color:#8B6B4A;font-size:1.6rem;letter-spacing:.02em;gap:10px}
h1 .ico{width:40px}
.date{font-family:var(--f-display);font-weight:500;color:var(--muted)}
#kids-on{background:#8B6B4A;color:#FFF8EE;text-shadow:none;border:0;box-shadow:0 3px 0 #6E5236;font-family:var(--f-display)}
.iconbtn{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--paper-shadow)}
.btn{font-family:var(--f-display);font-weight:700}
.chip{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--kid,var(--c5)) 30%,var(--line));font-family:var(--f-display)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--kid,var(--c5)) 85%,#fff);border-color:transparent;color:#fff}
.chip.plain[aria-pressed="true"]{background:#8B6B4A}
.card{background:var(--surface);border:0;border-radius:18px;box-shadow:var(--paper-shadow)}
.card.tone{border:0;background:
  radial-gradient(ellipse 70% 60% at 0% 0%, color-mix(in srgb,var(--tone) 15%,transparent), transparent 70%),
  radial-gradient(ellipse 60% 55% at 100% 100%, color-mix(in srgb,var(--tone) 10%,transparent), transparent 70%), var(--surface)}
.card.tone .sec-h h2,details.card.tone summary{color:color-mix(in srgb,var(--tone) 72%,var(--ink));font-family:var(--f-display);font-weight:700}
.card.tone .sec-h h2::before{display:none}
.sec-h h2{gap:8px;font-size:1.2rem}
.sumt{display:inline-flex;align-items:center;gap:8px}
.label{font-family:var(--f-body)}
.hero,.avhero{border:0;box-shadow:var(--paper-shadow);background:
  radial-gradient(ellipse 65% 70% at 8% 10%, color-mix(in srgb,var(--kid) 28%,transparent), transparent 70%),
  radial-gradient(ellipse 55% 60% at 96% 92%, rgba(244,221,138,.38), transparent 70%),
  radial-gradient(ellipse 40% 40% at 90% 8%, rgba(169,199,232,.28), transparent 70%), var(--surface)}
.hero .ava{box-shadow:0 0 0 4px #fff,0 0 0 7px color-mix(in srgb,var(--kid) 55%,#fff)}
.hero .name,.avinfo .name,.km-name{color:color-mix(in srgb,var(--kid) 72%,var(--ink))}
.bignum .star,.km-stars .star{filter:none}
.bar{background:rgba(139,107,74,.12)}
.bar>i{background:var(--rainbow)}
.lvbar>i{background:linear-gradient(90deg,#C3B1E1,#A9C7E8,#A7CFCF)}
.bonus,.savebar{background:var(--rainbow);color:var(--ink);text-shadow:none}
.bonus .btn.primary,.savebar .btn.primary{background:#8B6B4A;color:#fff;border-color:#8B6B4A}
.savebar .btn.ghost{color:var(--ink);border-color:rgba(75,58,42,.35)}
.lvl{background:var(--rainbow);color:var(--ink);text-shadow:none}
.fire{background:#F7E3CC;color:#9A5A22;border:0}
.period{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink));font-family:var(--f-display)}
.task{background:color-mix(in srgb,var(--c) 6%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.task.done{background:color-mix(in srgb,var(--c7) 15%,var(--surface));border-color:color-mix(in srgb,var(--c7) 55%,var(--line))}
.task .lbl,.beh .lbl,.badrow .lbl,.reward .name{font-family:var(--f-display);font-weight:600}
.task .pts{background:var(--star-soft);color:var(--star-ink)}
.beh{background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--line))}
.beh .pts{background:color-mix(in srgb,var(--c) 85%,#fff);text-shadow:none}
.btn.warn{background:#F2D88A;border-color:#F2D88A;color:#5B4210}
.btn.bad{background:var(--c1);border-color:var(--c1)}
.reward{background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.reward .emo{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.reward.is-goal{border-color:var(--star);box-shadow:0 0 0 3px rgba(230,178,60,.3)}
.entry .emo{background:var(--star-soft)}
.dayhead .label{background:color-mix(in srgb,var(--c5) 14%,var(--surface))}
.challenge{border:2px dashed color-mix(in srgb,var(--c6) 45%,var(--line));box-shadow:var(--paper-shadow);background:
  radial-gradient(ellipse 60% 80% at 0% 0%, rgba(185,169,227,.32), transparent 70%),
  radial-gradient(ellipse 60% 80% at 100% 100%, rgba(244,221,138,.36), transparent 70%), var(--surface)}
.challenge > .ico{width:56px}
.ch-k{font-family:var(--f-body)}
.ch-t{font-family:var(--f-display);font-weight:700}
.ch-btn{background:var(--c6);border-color:var(--c6)}
.newb{background:#F2D88A;color:#5B4210}
nav.tabs{background:var(--surface);box-shadow:0 -4px 18px rgba(120,90,50,.09)}
nav.tabs::before{height:3px;opacity:.9}
nav button{color:color-mix(in srgb,var(--t) 55%,var(--muted));font-family:var(--f-display);font-weight:600}
nav button[aria-current="page"]{background:color-mix(in srgb,var(--t) 15%,transparent);color:color-mix(in srgb,var(--t) 82%,var(--ink))}
#toast{font-family:var(--f-display)}
.avsvg{filter:saturate(.85)}
.avbig{box-shadow:0 0 0 4px #fff,0 0 0 7px color-mix(in srgb,var(--kid) 50%,#fff),var(--paper-shadow)}
.avcat{background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-display)}
.avcat[aria-pressed="true"]{background:color-mix(in srgb,var(--c2) 85%,#fff);border-color:transparent}
.avtile{border:1.5px solid var(--line)}
.avtile.on{border-color:color-mix(in srgb,var(--kid) 70%,#fff)}
.avtag.new{background:var(--rainbow);color:var(--ink)}
.avstats span{background:rgba(255,252,246,.8)}
.kidedit{border:0;background:radial-gradient(ellipse at 0 0, color-mix(in srgb,var(--kid) 18%,transparent), transparent 70%), var(--surface);box-shadow:var(--paper-shadow)}
.tbox{border:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
#kidsmode{background-color:var(--bg);background-image:
  radial-gradient(ellipse 340px 260px at 5% 8%, rgba(169,199,232,.36), transparent 70%),
  radial-gradient(ellipse 360px 280px at 96% 10%, rgba(244,221,138,.36), transparent 70%),
  radial-gradient(ellipse 400px 300px at 50% 100%, rgba(185,169,227,.3), transparent 70%),
  radial-gradient(ellipse 300px 260px at 0% 90%, rgba(242,160,166,.26), transparent 70%);background-size:auto}
.km-top h2{font-family:var(--f-title);color:#8B6B4A;font-size:1.8rem}
.km-top h2 .ico{width:46px}
.km-card{border:0;box-shadow:var(--paper-shadow);background:
  radial-gradient(ellipse 80% 55% at 50% 0%, color-mix(in srgb,var(--kid) 26%,transparent), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(244,221,138,.3), transparent 70%), var(--surface)}
.km-av{box-shadow:0 0 0 5px #fff,0 0 0 10px color-mix(in srgb,var(--kid) 50%,#fff),var(--paper-shadow)}
.km-ava .km-photo{box-shadow:0 0 0 4px #fff,0 0 0 7px color-mix(in srgb,var(--kid) 55%,#fff)}
.km-name,.km-stars{font-family:var(--f-display)}
.km-tile{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:2.5px dashed color-mix(in srgb,var(--c) 45%,var(--line))}
.km-tile.done{background:color-mix(in srgb,var(--c) 26%,var(--surface));border:2.5px solid color-mix(in srgb,var(--c) 70%,#fff)}
.km-rules{border:0;box-shadow:var(--paper-shadow);background:radial-gradient(ellipse at 0 0, rgba(244,221,138,.32), transparent 70%), var(--surface)}
.km-rules h3{font-family:var(--f-title);color:#8B6B4A}
.km-rules ol{font-family:var(--f-display)}
.km-deco{max-width:1100px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.km-deco span{width:18%;max-width:140px;line-height:0}
.km-deco span svg{width:100%;height:auto;display:block}

.toprow{flex-wrap:wrap;row-gap:8px}
h1{white-space:nowrap;font-size:clamp(1.3rem,5.6vw,1.6rem)}
h1 .ico{width:clamp(30px,8vw,40px)}
.km-top{flex-wrap:wrap;row-gap:10px}
.km-top h2{white-space:nowrap;font-size:clamp(1.35rem,6vw,1.8rem)}
@media (max-width:480px){#kids-on .long{display:none}#kids-on{text-transform:capitalize}.hbtns{gap:6px;margin-left:auto}}

/* ===== crianças: pedidos, baú, medalhas, página própria, senha ===== */
.pends{display:flex;flex-direction:column;gap:8px}
.pend{display:grid;grid-template-columns:auto 28px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(255,252,246,.85);border:1.5px solid var(--line)}
.pend .ava{--size:30px}
.pend .emo{font-size:1.3rem;text-align:center}
.pend .lbl{font-family:var(--f-display);font-size:.92rem;line-height:1.25;min-width:0}
.pend .lbl small{display:block;color:var(--muted);font-family:var(--f-body);font-size:.75rem}
.pend .btn{min-width:38px;padding:0 10px}
.waitnote{display:block;font-size:.75rem;color:#B07F18;font-weight:700;font-family:var(--f-body)}
.chest{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;box-shadow:var(--paper-shadow);background:
  radial-gradient(ellipse 60% 80% at 0% 50%, rgba(244,221,138,.42), transparent 70%), var(--surface)}
.chest.locked{opacity:.85}
.chest-btn{border:0;background:none;padding:0;width:96px;flex:none;cursor:pointer;line-height:0}
.chest-btn svg{width:100%;height:auto}
.chest.big .chest-btn{width:130px}
.chest.ready .chest-btn{animation:chestglow 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(242,193,78,.7))}
.chest.locked .chest-btn{filter:grayscale(.7);opacity:.6;cursor:default}
.chest-btn.shake{animation:shake .6s ease-in-out}
@keyframes chestglow{50%{transform:scale(1.06) rotate(-2deg)}}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.chest-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.chest-t p{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.3}
.chest.big .chest-t p{font-size:1.2rem}
.chestline{background:linear-gradient(90deg,#F6E3A6,#F5CBA0)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 4px}
.medal-c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:#EFE6D6;filter:grayscale(1);opacity:.5;box-shadow:inset 0 0 0 3px #E2D5BF}
.medal.got .medal-c{filter:none;opacity:1;background:radial-gradient(circle at 35% 30%,#FFF6D8,#F2C14E 70%);box-shadow:0 0 0 3px #fff,0 0 0 5px #E6B23C,0 6px 14px rgba(230,178,60,.35)}
.medal-n{font-family:var(--f-display);font-weight:700;font-size:.8rem;line-height:1.15}
.medal-p{font-size:.7rem;color:var(--muted);line-height:1.15}
.km-enter{border:0;cursor:pointer;width:100%;padding:14px 16px;border-radius:999px;font:700 1.15rem var(--f-display);color:#fff;background:color-mix(in srgb,var(--kid) 88%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--kid) 70%,#000)}
.km-enter:active{transform:translateY(3px);box-shadow:none}
.km-chest{font-family:var(--f-display);font-weight:700;background:#F6E3A6;color:#6E4F00;padding:5px 14px;border-radius:999px;animation:pulse 1.2s ease-in-out infinite}
.kp{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kp-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:20px;border-radius:24px;box-shadow:var(--paper-shadow);background:
  radial-gradient(ellipse 70% 80% at 0% 0%, color-mix(in srgb,var(--kid) 28%,transparent), transparent 70%),
  radial-gradient(ellipse 50% 60% at 100% 100%, rgba(244,221,138,.36), transparent 70%), var(--surface)}
.kp-hero .km-ava{width:min(200px,40vw)}
.kp-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.kp-info .km-stars{justify-content:flex-start;font-size:3.4rem}
@media (max-width:520px){.kp-hero{grid-template-columns:1fr;justify-items:center;text-align:center}.kp-info .km-stars{justify-content:center}.kp-info .badges{justify-content:center}.kp-info{width:100%}}
.kp-sec{padding:16px;border-radius:20px;background:var(--surface);box-shadow:var(--paper-shadow)}
.kp-sec h3{margin:0 0 12px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:#8B6B4A;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kp-sec h3 small{font-size:.9rem;color:var(--muted);font-weight:600}
.kp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kp-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:20px;cursor:pointer;text-align:center;
  background:color-mix(in srgb,var(--c) 12%,var(--surface));border:2.5px dashed color-mix(in srgb,var(--c) 50%,var(--line))}
.kp-tile:active{transform:scale(.96)}
.kp-emo{font-size:2.6rem;line-height:1}
.kp-tile.small .kp-emo{font-size:2rem}
.kp-lbl{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.2}
.kp-st{font-family:var(--f-display);font-weight:700;font-size:.92rem;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 85%,#fff);color:#fff}
.kp-tile.done{border-style:solid;border-color:color-mix(in srgb,var(--c7) 60%,#fff);background:color-mix(in srgb,var(--c7) 18%,var(--surface));cursor:default}
.kp-tile.done .kp-st{background:var(--c7)}
.kp-tile.wait{border-style:solid;cursor:default;opacity:.9}
.kp-tile.wait .kp-st{background:#F2D88A;color:#5B4210}
.kp-hint{text-align:center;font-family:var(--f-display);color:var(--muted);margin:0 0 8px}
.pin{min-height:100%;display:grid;place-items:center}
.pin-box{width:min(320px,100%);padding:24px;border-radius:24px;background:var(--surface);box-shadow:var(--paper-shadow);text-align:center}
.pin-box.wrong{animation:shake .5s}
.pin-box h3{margin:0 0 14px;font-family:var(--f-title);color:#8B6B4A;font-size:1.5rem}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:18px}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid #8B6B4A}
.pin-dots span.on{background:#8B6B4A}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-k{height:56px;border-radius:16px;border:1.5px solid var(--line);background:#FFFCF6;font:700 1.4rem var(--f-display);color:var(--ink);cursor:pointer}
.pin-k:active{background:#F1E7D6}
@media (prefers-reduced-motion: reduce){.chest.ready .chest-btn,.km-chest,.chest-btn.shake,.pin-box.wrong{animation:none}}

/* ===== oração do dia, recadinho de Jesus, Natal ===== */

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const dayStr = (d = new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monthStr = (d = new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1);
function prevMonth(){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return monthStr(d) }
function fmtDay(ds){ const [y,m,d] = ds.split('-').map(Number); const dt = new Date(y,m-1,d);
  const wd = new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(dt).replace('.','');
  return wd + ' ' + d + ' ' + MONTHS[m-1] }
function fmtMonth(ms){ const [y,m] = ms.split('-').map(Number); return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)) }

function age(birth){ if(!birth) return null; const [y,m,d] = birth.split('-').map(Number); const t = new Date();
  let a = t.getFullYear()-y; if(t.getMonth()+1<m || (t.getMonth()+1===m && t.getDate()<d)) a--; return a }
function bdayDays(birth){ if(!birth) return null; const [,m,d] = birth.split('-').map(Number); const t = new Date(); t.setHours(0,0,0,0);
  let n = new Date(t.getFullYear(), m-1, d); if(n < t) n = new Date(t.getFullYear()+1, m-1, d); return Math.round((n-t)/86400000) }

/* ---------- derived data ---------- */
const kids = () => config?.kids || [];
const kidById = id => kids().find(k => k.id === id);
const closedThrough = () => ledger?.closedThrough || '';
const liveEntries = () => { const c = closedThrough(); return logDocs.filter(e => !c || (e.month||'') > c) };

const todayEntries = kid => { const d = dayStr(); return liveEntries().filter(e => e.kid===kid && e.day===d) };
const tasksFor = kid => (config?.tasks || []).filter(t => (t.kids||[]).includes(kid));
const taskId = (kid,t) => 't_'+dayStr()+'_'+kid+'_'+t.id;
const isDone = (kid,t) => logDocs.some(e => e.id === taskId(kid,t));
function lightOf(kid){ const es = todayEntries(kid);
  const s = es.filter(e => e.type==='warn').length + 2*es.filter(e => e.type==='bad').length;
  return s===0 ? 'verde' : s<=2 ? 'amarelo' : 'vermelho' }

function avatar(k, cls=''){
  const ph = kidPhotos(k.id);
  const imgs = ph.map((p,i) => `<img src="${esc(p.url)}" alt="" class="${i? 'off':''}" loading="lazy">`).join('');
  return `<span class="ava ${cls}" style="--kid:${esc(k.color)}" ${ph.length>1?'data-rotate':''}>${ph.length? imgs : esc(k.emoji||'🙂')}</span>`;
}

/* ---------- avatar: desbloqueios e gravação ---------- */
let avatars = {}, avatarsLoaded = false, avatarsExists = false, avCat = 'top', avWriteBlocked = false;
const knownElig = {}, shownFresh = {}, freshCleared = {}, avPending = {};
const ikey = i => i.cat + ':' + i.id;
const LOOK_CATS = ['skin','hair','hairColor','eyes','face','top','hat','glasses','hand','pet','bg'];
function countType(kid, type){ return (ledger?.counts?.[kid]?.[type] || 0) + liveEntries().filter(e => e.kid===kid && e.type===type).length }
function kidStats(kid){ return {stars: lifetime(kid), perfect: countType(kid,'bonus'), challenge: countType(kid,'challenge'), streak: streak(kid), good: countType(kid,'good'), chest: countType(kid,'chest'), books: countRefs(kid, bookRefs()), devo: devoDays.size} }
const meets = (need, st) => Object.entries(need).every(([k,v]) => (st[k]||0) >= v);
function lookOf(kid){ const a = avatars[kid] || {}, k = kidById(kid); const l = {...DEFAULT_LOOK, ...(KID_LOOKS[kid] || {})}; LOOK_CATS.forEach(c => { if(a[c]) l[c] = a[c] }); l.g = k && k.g === 'f' ? 'f' : 'm'; return l }
function unlockedSet(kid, st){ st = st || kidStats(kid); const set = new Set(avatars[kid]?.unlocked || []);
  catFor(kidById(kid)).forEach(i => { if(!i.need || meets(i.need, st)) set.add(ikey(i)) }); return set }
function needText(need, st){ const [k,v] = Object.entries(need)[0];
  if(k==='stars') return `faltam ${Math.max(0, v - st.stars)} ⭐`;
  if(k==='perfect') return `${v} Dias Perfeitos (${Math.min(st.perfect,v)}/${v})`;
  if(k==='streak') return `${v} dias seguidos 🔥`;
  if(k==='challenge') return `${v} desafios (${Math.min(st.challenge,v)}/${v})`;
  return `${Math.min(st[k]||0, v)}/${v} ${NEED_WORDS[k] || ''}` }
function needLong(need){ const [k,v] = Object.entries(need)[0];
  return {stars:`ganhar ${v} estrelas no total`, perfect:`ganhar ${v} bônus Dia Perfeito`, streak:`completar a rotina ${v} dias seguidos`, challenge:`cumprir ${v} Desafios da família`}[k] || `${v} ${NEED_WORDS[k]||''}` }
async function avWrite(kid, patch, silent){
  if(!db || avWriteBlocked) return false;
  try{ const ref = db.doc('app/avatars');
    if(avatarsExists) await ref.update({[kid]: patch}); else { await ref.set({...avatars, [kid]: {...(avatars[kid]||{}), ...patch}}); avatarsExists = true }
    return true }catch(err){ if(err && err.code==='invalid_argument') avWriteBlocked = true; if(!silent) writeErr(err); return false } }
function syncUnlocks(){
  if(!db || !avatarsLoaded || !logLoaded || !ledgerLoaded || !config) return;
  kids().forEach(k => {
    const st = kidStats(k.id);
    const elig = catFor(k).filter(i => i.need && meets(i.need, st)).map(ikey).concat(BADGES.filter(b => meets(b.need, st)).map(b => 'badge:'+b.id));
    if(!knownElig[k.id]) knownElig[k.id] = new Set(elig);
    else { const brandNew = elig.filter(x => !knownElig[k.id].has(x));
      if(brandNew.length){ brandNew.forEach(x => knownElig[k.id].add(x));
        const key0 = brandNew[0], isB = key0.startsWith('badge:');
        const first = isB ? BADGES.find(b => 'badge:'+b.id===key0) : CATALOG.find(i => ikey(i)===key0);
        confetti(innerWidth/2, innerHeight/3, 180); sfx('big');
        toast(isB ? `🏅 ${k.name} ganhou a medalha ${first ? first.emo+' '+first.name : ''}${brandNew.length>1 ? ' e mais '+(brandNew.length-1)+' prêmio(s)' : ''}!` : `🎁 ${k.name} ganhou para o avatar: ${first ? first.name : 'item novo'}${brandNew.length>1 ? ' e mais '+(brandNew.length-1) : ''}!`) } }
    const stored = avatars[k.id]?.unlocked || [];
    const add = elig.filter(x => !stored.includes(x));
    if(add.length && !avPending[k.id]){ avPending[k.id] = true;
      avWrite(k.id, {unlocked: [...stored, ...add], fresh: [...(avatars[k.id]?.fresh || []), ...add]}, true).finally(() => { avPending[k.id] = false }) }
  });
}
function avTile(i, k, look, un, st, fresh){
  const on = look[i.cat] === i.id, open = !i.need || un.has(ikey(i));
  const tag = on ? '<span class="avtag eq">Usando</span>' : !open ? `<span class="avtag lock">🔒 ${esc(needText(i.need, st))}</span>` : fresh.has(ikey(i)) ? '<span class="avtag new">NOVO!</span>' : '';
  return `<button class="avtile ${on?'on':''} ${open?'':'locked'}" style="--kid:${esc(k.color)}" data-act="av-eq" data-cat="${i.cat}" data-id="${i.id}" aria-pressed="${on}" aria-label="${esc(i.name)}${open?'':' (bloqueado)'}">${avatarSVG({...look, [i.cat]: i.id}, k.color)}<span class="avname">${esc(i.name)}</span>${tag}</button>`;
}
function viewAvatar(){
  const k = kidById(selKid); if(!k) return '';
  const st = kidStats(k.id), look = lookOf(k.id), un = unlockedSet(k.id, st);
  const fresh = new Set([...(avatars[k.id]?.fresh || []), ...(shownFresh[k.id] || [])]); shownFresh[k.id] = fresh;
  if((avatars[k.id]?.fresh || []).length && !freshCleared[k.id]){ freshCleared[k.id] = true; setTimeout(() => avWrite(k.id, {fresh: []}, true), 800) }
  const special = catFor(k).filter(i => i.need), got = special.filter(i => un.has(ikey(i))).length;
  const next = special.filter(i => i.need.stars && !un.has(ikey(i))).sort((a,b) => a.need.stars - b.need.stars)[0];
  const grid = list => `<div class="avgrid">${list.map(i => avTile(i, k, look, un, st, fresh)).join('')}</div>`;
  let body;
  if(avCat === 'look') body = [['hair','Cabelo'],['hairColor','Cor do cabelo'],['eyes','Cor dos olhos'],['face','Rosto'],['skin','Tom de pele']].map(([c,t]) => `<div class="label avsub">${t}</div>${grid(catFor(k).filter(i => i.cat===c))}`).join('');
  else body = grid(catFor(k).filter(i => i.cat===avCat));
  return `<section class="avhero" style="--kid:${esc(k.color)}">
      <div class="avbig">${avatarSVG(look, k.color)}</div>
      <div class="avinfo">
        <div class="name">Avatar ${k.g==='f' ? 'da' : 'do'} ${esc(k.name)}</div>
        <div class="avcount"><b>${got}</b> de ${special.length} itens especiais conquistados</div>
        ${next ? `<div class="goal"><div class="goal-row"><span>Próximo: ${esc(next.name)}</span><span class="pts">faltam ${next.need.stars - st.stars} ⭐</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100, st.stars/next.need.stars*100))}%"></i></div></div>` : '<div class="avcount">Todos os itens de estrelas conquistados! 👑</div>'}
        <div class="avstats"><span>⭐ ${st.stars} ganhas</span><span>🏆 ${st.perfect} Dias Perfeitos</span><span>🔥 ${st.streak} seguidos</span><span>🎯 ${st.challenge} desafios</span></div>
      </div></section>
    <div class="avcats" role="tablist">${AV_CATS.map(c => `<button class="avcat" data-act="av-cat" data-id="${c.id}" aria-pressed="${avCat===c.id}">${c.label}</button>`).join('')}</div>
    <section class="card tone" style="--tone:var(--c2)"><div class="sec-h"><h2>${ico('butterfly')}${esc(AV_CATS.find(c => c.id===avCat)?.label || '')}</h2></div>${body}<p class="hint">As peças são conquistadas com as estrelas ganhas. Trocar o visual não gasta estrelas.</p></section>
    <section class="card tone" style="--tone:var(--c3)"><div class="sec-h"><h2>${ico('star')}Medalhas</h2><span class="meta">${BADGES.filter(b => (avatars[k.id]?.unlocked||[]).includes('badge:'+b.id) || meets(b.need, st)).length} de ${BADGES.length}</span></div>${badgesHTML(k, st)}</section>`;

let bedMode = false;
let devoDays = new Set();
const canSpeak = (() => { try{ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined' }catch(e){ return false } })();
function dayNum(){ const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000) }
const todaysDevotional = () => DEVOTIONALS[dayNum() % DEVOTIONALS.length];
function devoStreak(){ let n = 0; const d = new Date(); if(!devoDays.has(dayStr(d))) d.setDate(d.getDate()-1);
  while(n < 400 && devoDays.has(dayStr(d))){ n++; d.setDate(d.getDate()-1) } return n }
function speak(text, lang){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'pt-BR'; u.rate = .88; u.pitch = 1.05; speechSynthesis.speak(u) }catch(e){ toast('Este aparelho não conseguiu ler em voz alta.') } }

async function requestPending(k, kind, item){
  if(!db){ toast('Peça para um adulto entrar na conta.'); return null }
  const now = new Date();
  const body = {kid:k.id, type:kind, ref:item.id, label:item.label, emoji:item.emoji, pts:Math.abs(item.pts||0), day:dayStr(now), month:monthStr(now), at:now.toISOString()};
  const ref = kind==='task' ? db.collection('pending').doc('p_'+dayStr(now)+'_'+k.id+'_'+item.id) : db.collection('pending').doc();
  try{ await ref.set(body); return ref.id }catch(err){ writeErr(err); return null }
}
async function approvePending(p){
  let r = null;
  if(p.type==='task'){ const id = 't_'+p.day+'_'+p.kid+'_'+p.ref;
    r = logDocs.some(e => e.id===id) ? id : await addEntry({kid:p.kid, type:'task', ref:p.ref, label:p.label, emoji:p.emoji, pts:p.pts, day:p.day, month:p.month}, id) }

  else r = await addEntry({kid:p.kid, type:'good', ref:p.ref, label:p.label, emoji:p.emoji, pts:p.pts});
  if(r){ try{ await db.collection('pending').doc(p.id).delete() }catch(e){} }

}

const todaysPrayer = () => PRAYERS[(dayNum() + 11) % PRAYERS.length];

function jesusMsg(k){
  const idx = Math.max(0, kids().findIndex(x => x.id === k.id));
  const a = age(k.birth), own = MSG_BY_KID[k.id], pool = own || ((a != null && a <= 6) ? MSG_SMALL : MSG_BIG);
  const [txt, ref] = pool[(dayNum() + (own ? 0 : idx * 13)) % pool.length];
  const es = todayEntries(k.id), extra = [];
  if(bdayDays(k.birth) === 0) extra.push(`Hoje é o seu aniversário! Eu me alegro muito por você existir. 🎂`);
  const tasks = tasksFor(k.id), done = tasks.filter(t => isDone(k.id, t)).length;
  const hard = es.some(e => e.type === 'bad') || es.filter(e => e.type === 'warn').length >= 2;
  const good = es.filter(e => e.type === 'good').sort((x,y) => (y.at||'').localeCompare(x.at||''))[0];
  if(good) extra.push(`Eu vi quando você ${good.label.charAt(0).toLowerCase() + good.label.slice(1)}. Isso deixou o meu coração feliz!`);
  else if(tasks.length && done === tasks.length) extra.push('Vi que você completou a sua rotina hoje. Que capricho!');

  return {text: fillMsg(txt, k), extra, ref};
}

/* ---------- diversão: níveis, sequência, desafio, confete, sons ---------- */
const LEVELS = [
  {n:'Estrelinha', e:'⭐', min:0}, {n:'Cometa', e:'☄️', min:100}, {n:'Foguete', e:'🚀', min:250},
  {n:'Astronauta', e:'🧑‍🚀', min:500}, {n:'Supernova', e:'🌟', min:1000}, {n:'Galáxia', e:'🌌', min:2000},
  {n:'Lenda das Estrelas', e:'👑', min:4000}];
const CHEERS = ['Arrasou','Mandou muito bem','Brilhou','Uhuu','Show de bola','Que orgulho','Isso aí','Demais'];
const cheer = () => CHEERS[Math.floor(Math.random()*CHEERS.length)];
function lifetime(kid){ let t = 0; const m = ledger?.months || {};
  for(const mo in m){ t += m[mo]?.[kid]?.ganhou || 0 }
  liveEntries().forEach(e => { if(e.kid===kid && e.type!=='reward' && (e.pts||0) > 0) t += e.pts }); return t }
function levelOf(kid){ const lt = lifetime(kid); let i = 0; LEVELS.forEach((l,j) => { if(lt >= l.min) i = j });
  const cur = LEVELS[i], nxt = LEVELS[i+1];
  return {i, cur, nxt, lt, pct: nxt ? (lt-cur.min)/(nxt.min-cur.min)*100 : 100} }
function streak(kid){ const ts = tasksFor(kid); if(!ts.length) return 0; const live = liveEntries();
  const doneOn = d => ts.every(t => live.some(e => e.kid===kid && e.type==='task' && e.ref===t.id && e.day===d));
  let n = 0; const d = new Date(); if(!doneOn(dayStr(d))) d.setDate(d.getDate()-1);
  while(n < 62 && doneOn(dayStr(d))){ n++; d.setDate(d.getDate()-1) } return n }
function todayChallenge(){ const list = (config?.challenges || []).filter(Boolean); if(!list.length) return null;
  const d = new Date(); const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); return list[n % list.length] }
const challengeDone = () => kids().length > 0 && kids().every(k => logDocs.some(e => e.id === 'd_'+dayStr()+'_'+k.id));
function challengeCard(big){ const c = todayChallenge(); if(!c) return ''; const pts = config.settings?.challenge || 10; const done = challengeDone();
  return `<section class="challenge ${big?'big':''}">${ico('butterfly')}<div class="ch-l"><span class="ch-k">Desafio da família de hoje</span><div class="ch-t">${esc(c)}</div></div>${done ? `<div class="ch-done">Cumprido! 🎉</div>` : big ? `<div class="ch-pts">+${pts} ${STAR} para todos</div>` : `<button class="btn ch-btn" data-act="challenge">Cumprimos! +${pts} para todos</button>`}</section>` }

let soundOn = ls.get('qe.sound', true), actx = null;
function sfx(kind){ if(!soundOn) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const seqs = {good:[[784,0],[1047,.08]], big:[[523,0],[659,.09],[784,.18],[1047,.27],[1319,.36]], warn:[[494,0],[494,.16]], bad:[[392,0],[247,.13]], tap:[[880,0]], undo:[[660,0],[523,.08]]};
    const type = {good:'triangle', big:'triangle', warn:'square', bad:'sawtooth', tap:'sine', undo:'sine'}[kind] || 'sine';
    const vol = (kind==='warn' || kind==='bad') ? 0.05 : 0.14;
    (seqs[kind] || []).forEach(([f,t]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
      const st = actx.currentTime + t; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st+0.012); g.gain.exponentialRampToValueAtTime(0.0001, st+0.24);
      o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st+0.26) });
  }catch(e){} }
const reduceMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches }catch(e){ return false } };
const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
const cx = cv.getContext('2d'); let parts = [], running = false;
function palette(){ const cs = getComputedStyle(document.documentElement); return [1,2,3,4,5,6,7].map(i => cs.getPropertyValue('--c'+i).trim() || '#FFC61A') }
function confetti(x, y, n){ if(reduceMotion()) return; const cols = palette();
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*8;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 5, s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[i % cols.length], life:0, star: Math.random() < .25}) }
  if(!running){ running = true; requestAnimationFrame(tick) } }
function starPath(r){ cx.beginPath(); for(let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/5 - Math.PI/2; cx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) } cx.closePath() }
function tick(){ const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr) }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
  for(const p of parts){ p.vy += .3; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, 1 - p.life/120); cx.fillStyle = p.c;
    if(p.star){ starPath(p.s); cx.fill() } else cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); cx.restore() }
  parts = parts.filter(p => p.life < 120 && p.y < H + 40);
  if(parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0,0,W,H) } }
function floatText(pt, text, kind){ const d = document.createElement('div'); d.className = 'floaty ' + (kind||''); d.textContent = text;
  d.style.left = pt.x + 'px'; d.style.top = pt.y + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 1300) }
function centerOf(el){ const r = el.getBoundingClientRect(); return {x: r.left + r.width/2, y: r.top + r.height/2} }
function celebrate(pt, pts, kind){
  if(kind==='good'){ floatText(pt, '+'+pts+' ⭐', 'good'); confetti(pt.x, pt.y, 50); sfx('good') }
  else if(kind==='big'){ floatText(pt, pts ? '+'+pts+' ⭐' : '🎉', 'big'); confetti(pt.x, pt.y, 140); sfx('big') }
  else if(kind==='reward'){ floatText(pt, '🎁', 'big'); confetti(pt.x, pt.y, 160); sfx('big') }
  else if(kind==='warn'){ floatText(pt, 'Aviso!', 'warn'); sfx('warn') }
  else if(kind==='bad'){ floatText(pt, '−'+Math.abs(pts), 'bad'); sfx('bad') } }
const prevLevel = {};
function checkLevels(){ if(!logLoaded || !ledgerLoaded || !config) return;

/* ---------- writes ---------- */
function writeErr(err){
  const c = err && err.code;
  if(c==='invalid_argument') toast('Esta conta não tem permissão para salvar. Confira os e-mails nas regras do Firebase.');
  else if(c==='quota_exceeded') toast('O quadro está cheio. Apague registros antigos no Histórico.');
  else toast('Não deu para salvar agora. Tente de novo.');
}
async function addEntry(e, id){
  if(!db){ toast('Entre com sua conta Google para registrar.'); return null }
  const now = new Date();
  const body = {...e, at: now.toISOString(), day: e.day || dayStr(now), month: e.month || monthStr(now)};
  const ref = id ? db.collection('log').doc(id) : db.collection('log').doc();
  try{ await ref.set(body); return ref.id }catch(err){ writeErr(err); return null }
}
async function removeEntry(id){ if(!db) return; try{ await db.collection('log').doc(id).delete() }catch(err){ writeErr(err) } }

async function maybeRollup(){
  if(rolled || !db || !ledgerLoaded || !logLoaded) return;
  rolled = true;
  const cutoff = prevMonth();
  if(!logDocs.some(e => e.month && e.month < cutoff && e.type!=='xmas')) return;
  try{
    const lease = await db.doc('meta/rollup').acquire({holder: tabId, ttlMs: 60000});
    if(!lease.acquired) return;
    const ls0 = await db.doc('meta/ledger').get();
    const L = ls0.exists ? JSON.parse(JSON.stringify(ls0.data())) : {};
    L.balances = L.balances || {}; L.months = L.months || {}; L.closedThrough = L.closedThrough || '';
    const old = await db.collection('log').where('month','<',cutoff).get();
    let newClosed = L.closedThrough;
    for(const d of old.docs){
      const e = d.data(); if(!e.month || e.type==='xmas') continue;
      if(e.month > newClosed) newClosed = e.month;
      if(L.closedThrough && e.month <= L.closedThrough) continue;
      L.balances[e.kid] = (L.balances[e.kid]||0) + (e.pts||0);
      const m = (L.months[e.month] = L.months[e.month] || {});
      const k = (m[e.kid] = m[e.kid] || {ganhou:0, perdeu:0, trocou:0});
      if(e.type==='reward') k.trocou += -(e.pts||0); else if((e.pts||0) >= 0) k.ganhou += e.pts||0; else k.perdeu += -e.pts;
      L.counts = L.counts || {}; const ct = (L.counts[e.kid] = L.counts[e.kid] || {}); ct[e.type] = (ct[e.type]||0) + 1; if(e.ref) ct['ref:'+e.ref] = (ct['ref:'+e.ref]||0) + 1;
    }
    L.closedThrough = newClosed;
    await db.doc('meta/ledger').set(L);
    for(const d of old.docs){ if(d.data().type==='xmas') continue; try{ await db.collection('log').doc(d.id).delete() }catch(e){} }
  }catch(e){ /* leitura apenas ou indisponível: tenta na próxima abertura */ }
}

function entryRow(e, showKid){

/* ----- Histórico ----- */
function viewHistory(){
  const ks = histKid==='all' ? kids() : kids().filter(k => k.id===histKid);
  const live = liveEntries().filter(e => ks.some(k => k.id===e.kid));
  const days = []; for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(dayStr(d)) }
  const net = (kid, d) => live.filter(e => e.kid===kid && e.day===d).reduce((s,e) => s+(e.pts||0), 0);
  const data = days.map(d => ks.map(k => net(k.id,d)));
  const maxPos = Math.max(0, ...data.flat()), maxNeg = Math.max(0, ...data.flat().map(v => -v));
  const H = 130, scale = (maxPos+maxNeg) ? H/(maxPos+maxNeg) : 0;
  const posH = Math.round(maxPos*scale), negH = Math.round(maxNeg*scale);
  const today = dayStr();
  const cols = days.map((d,i) => `<div class="col"><div class="up" style="height:${posH||1}px">${ks.map((k,j) => { const v = data[i][j]; return `<span class="b" style="--kid:${esc(k.color)};height:${v>0?Math.max(2,Math.round(v*scale)):0}px" title="${esc(k.name)}: ${sign(v)}"></span>` }).join('')}</div>${negH?`<div class="down" style="height:${negH}px">${ks.map((k,j) => { const v = data[i][j]; return `<span class="b" style="--kid:${esc(k.color)};height:${v<0?Math.max(2,Math.round(-v*scale)):0}px" title="${esc(k.name)}: ${sign(v)}"></span>` }).join('')}</div>`:''}<div class="dl ${d===today?'today':''}">${d===today?'hoje':fmtDay(d).split(' ').slice(0,2).join(' ')}</div></div>`).join('');
  const week = ks.map(k => { const t = days.reduce((s,d) => s+net(k.id,d), 0); return `<span><i class="dot" style="--kid:${esc(k.color)}"></i>${esc(k.name)} <b class="${t>0?'pos':t<0?'neg':''}">${sign(t)}</b></span>` }).join('');
  const byDay = {}; live.forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e) });
  const dayKeys = Object.keys(byDay).sort().reverse();
  const groups = dayKeys.map(d => {
    const es = byDay[d].sort((a,b) => (b.at||'').localeCompare(a.at||''));
    const tot = ks.map(k => { const t = es.filter(e => e.kid===k.id).reduce((s,e) => s+(e.pts||0), 0); return es.some(e => e.kid===k.id) ? `<span><i class="dot" style="--kid:${esc(k.color)};display:inline-block"></i> ${sign(t)}</span>` : '' }).join('');
    return `<div class="dayhead"><span class="label">${d===today?'Hoje':fmtDay(d)}</span><span class="tot">${tot}</span></div><div class="entries">${es.map(e => entryRow(e, histKid==='all')).join('')}</div>` }).join('');
  const months = Object.keys(ledger?.months || {}).sort().reverse();
  const mrows = months.flatMap(m => ks.filter(k => ledger.months[m][k.id]).map(k => { const s = ledger.months[m][k.id]; return `<tr><td>${esc(fmtMonth(m))}</td><td>${esc(k.name)}</td><td class="pos">+${s.ganhou}</td><td class="neg">−${s.perdeu}</td><td>${s.trocou}</td></tr>` })).join('');
  return `<section class="card tone" style="--tone:var(--c4)"><div class="sec-h"><h2>${ico('rainbow')}Últimos 7 dias</h2><span class="meta">saldo do dia</span></div><div class="weeksum">${week}</div>${scale ? `<div class="chart">${cols}</div>` : '<p class="hint">Sem registros nos últimos 7 dias.</p>'}</section>
    <section class="card tone" style="--tone:var(--c5)"><div class="sec-h"><h2>${ico('caterpillar')}Registros</h2><span class="meta">mês atual e anterior</span></div>${groups || '<p class="hint">Nenhum registro ainda. Tudo o que for marcado em Hoje aparece aqui.</p>'}</section>
    ${mrows ? `<section class="card tone" style="--tone:var(--c6)"><div class="sec-h"><h2>${ico('moon')}Meses anteriores</h2><span class="meta">resumo</span></div><div class="table-wrap"><table><thead><tr><th>Mês</th><th>Criança</th><th>Ganhou</th><th>Perdeu</th><th>Trocou</th></tr></thead><tbody>${mrows}</tbody></table></div></section>` : ''}`;
}

  db.doc('app/avatars').onSnapshot(s => { avatarsExists = s.exists; avatars = s.exists ? JSON.parse(JSON.stringify(s.data())) : {}; avatarsLoaded = true; render() }, onErr);
  db.doc('meta/ledger').onSnapshot(s => { ledger = s.exists ? s.data() : {}; ledgerLoaded = true; render(); maybeRollup() }, onErr);
  db.collection('log').onSnapshot(s => { logDocs = s.docs.map(d => ({id:d.id, ...d.data()})); if(!s.metadata.fromCache) logLoaded = true; render(); maybeRollup() }, onErr);
  render();
}
async function init(){
  document.body.insertAdjacentHTML('beforeend', BED_FILTER);
  $('#apptitle').innerHTML = ico('sun') + '<span>Quadro de Estrelas</span>';
  render();
  const cfg = window.FIREBASE_CONFIG;
  if(typeof firebase === 'undefined' || !cfg || !cfg.apiKey || /COLE/.test(cfg.apiKey)){ setupMissing = true; render(); return }
  firebase.initializeApp(cfg);
  rawFs = firebase.firestore();
  try{ await rawFs.enablePersistence({synchronizeTabs: true}) }catch(e){}
  firebase.auth().onAuthStateChanged(u => { authUser = u;
    if(u && !u.emailVerified && (u.providerData || []).some(pd => pd.providerId === 'password')){ stopData(); needLogin = false; needVerify = true; render(); return }
    needVerify = false;
    if(u){ if(!db) startData() } else { stopData(); needLogin = true; render() } });
}
init();
})();
</script>
