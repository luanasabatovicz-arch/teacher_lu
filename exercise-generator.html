<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz - Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Exercise Generator — overrides do DS + Tailwind + modo aula ao vivo */
  * { font-family: var(--tl-font-sans); }
  h1, h2, h3, h4 { font-family: var(--tl-font-sans); }
  body { background: var(--tl-bg) !important; color: var(--tl-text) !important; }

  /* Topbar unificada */
  .topbar {
    background: linear-gradient(120deg, var(--tl-primary) 0%, #0F5561 55%, var(--tl-secondary) 100%) !important;
    color: var(--tl-text-inverse) !important;
    box-shadow: var(--tl-shadow-md);
  }
  .topbar h1, .topbar h2, .topbar h3, .topbar p, .topbar span { color: var(--tl-text-inverse) !important; }
  [onclick="goHome()"] {
    background: rgba(255,255,255,.14) !important;
    border: 1px solid rgba(255,255,255,.35) !important;
    color: var(--tl-text-inverse) !important;
    font-family: var(--tl-font-sans) !important;
    border-radius: var(--tl-radius-md);
    padding: var(--tl-space-2) var(--tl-space-4);
    font-weight: var(--tl-fw-semibold);
  }
  [onclick="goHome()"]:hover { background: rgba(255,255,255,.24) !important; }

  /* Tailwind text overrides */
  .text-white       { color: var(--tl-text) !important; }
  .text-slate-300,
  .text-slate-400   { color: var(--tl-text-secondary) !important; }
  .text-slate-200   { color: var(--tl-text) !important; }
  .text-slate-500,
  .text-slate-600   { color: var(--tl-text-tertiary) !important; }
  .text-indigo-100,
  .text-indigo-200,
  .text-indigo-400  { color: var(--tl-primary) !important; }
  .text-emerald-400,
  .text-emerald-300 { color: var(--tl-success) !important; }
  .text-red-300,
  .text-red-400     { color: var(--tl-danger) !important; }
  .text-amber-300   { color: var(--tl-warning) !important; }
  .text-pink-300    { color: var(--tl-accent) !important; }

  .gradient-coral   { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-emerald { background: linear-gradient(135deg, var(--tl-secondary), var(--tl-success)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-indigo  { background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-amber   { background: linear-gradient(135deg, var(--tl-warning), #F59E0B) !important; color: var(--tl-warning-text) !important; }
  .gradient-pink    { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }

  /* Cards */
  .card {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    box-shadow: var(--tl-shadow-sm) !important;
    border-radius: var(--tl-radius-lg) !important;
    transition: box-shadow var(--tl-dur-base) var(--tl-ease), border-color var(--tl-dur-base) var(--tl-ease);
  }
  .card:hover { box-shadow: var(--tl-shadow-lg) !important; border-color: var(--tl-border-strong) !important; }
  .ex-card {
    border-left: 4px solid var(--tl-primary);
    padding: 22px;
    margin-bottom: 18px;
    border-radius: var(--tl-radius-md);
    background: var(--tl-surface);
    border: 1px solid var(--tl-border);
    border-left-width: 4px;
  }

  /* Options (múltipla escolha) */
  .opt {
    background: var(--tl-surface-alt) !important;
    border: 1.5px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: var(--tl-radius-md);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
    display: block;
    width: 100%;
    text-align: left;
    font-size: 17px;
    font-weight: var(--tl-fw-semibold);
  }
  .opt:hover { border-color: var(--tl-secondary) !important; }
  .opt.sel   { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; color: var(--tl-text-inverse) !important; }
  .opt.right { background: var(--tl-success-soft) !important; border-color: var(--tl-success) !important; color: var(--tl-success-text) !important; }
  .opt.wrong { background: var(--tl-danger-soft) !important;  border-color: var(--tl-danger) !important;  color: var(--tl-danger-text) !important; }
  .opt .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: var(--tl-radius-sm);
    background: var(--tl-primary-soft);
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    margin-right: 10px;
    flex-shrink: 0;
  }
  .opt.right .letter { background: var(--tl-success); color: var(--tl-text-inverse); }
  .opt.wrong .letter { background: var(--tl-danger);  color: var(--tl-text-inverse); }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .45; }

  /* Inputs */
  .inp {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .inp:focus { outline: none; border-color: var(--tl-border-focus) !important; box-shadow: var(--tl-shadow-focus); }
  .inp::placeholder, input::placeholder, textarea::placeholder { color: var(--tl-text-tertiary) !important; }
  .inp.right { border-color: var(--tl-success) !important; }
  .inp.wrong { border-color: var(--tl-danger) !important; }
  select.inp option { background: var(--tl-surface) !important; color: var(--tl-text) !important; }

  .tag { color: var(--tl-text-tertiary); font-size: 11px; font-weight: var(--tl-fw-bold); text-transform: uppercase; letter-spacing: var(--tl-tracking-wide); }

  /* Botões theme */
  .theme-btn {
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: var(--tl-radius-sm);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    background: var(--tl-primary-tint);
    color: var(--tl-primary);
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .theme-btn:hover { border-color: var(--tl-primary); }
  .theme-btn.active { background: var(--tl-primary); color: var(--tl-text-inverse); }

  .correct-note { color: var(--tl-success-text); font-weight: var(--tl-fw-semibold); font-size: 13px; margin-top: 6px; }

  /* ===== LIVE CLASS MODE ===== */
  .q-big { font-size: 22px !important; line-height: 1.45; }
  .reveal-btn {
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    font-weight: var(--tl-fw-bold);
    padding: 12px 22px;
    border-radius: var(--tl-radius-md);
    font-size: 16px;
    cursor: pointer;
    border: none;
    transition: background var(--tl-dur-fast) var(--tl-ease);
  }
  .reveal-btn:hover { background: var(--tl-primary-hover); }
  .answer-big {
    font-size: 30px;
    font-weight: var(--tl-fw-bold);
    color: var(--tl-success-text);
    margin: 10px 0;
  }
  .judge {
    padding: 10px 18px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-bold);
    font-size: var(--tl-fs-body);
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .judge.jr { background: var(--tl-success-soft); color: var(--tl-success-text); }
  .judge.jw { background: var(--tl-danger-soft);  color: var(--tl-danger-text); }
  .judge.picked { border-color: currentColor; }
  .judge:disabled { opacity: .45; cursor: default; }

  .legend {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .legend p { font-size: 16px; margin: 4px 0; color: var(--tl-text); }
  .legend b { color: var(--tl-primary); margin-right: 8px; }

  .mletter {
    width: 42px; height: 42px;
    border-radius: var(--tl-radius-md);
    background: var(--tl-primary-tint);
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    font-size: 17px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .mletter:hover { border-color: var(--tl-primary); }
  .mletter.right { background: var(--tl-success); color: var(--tl-text-inverse); }
  .mletter.wrong { background: var(--tl-danger);  color: var(--tl-text-inverse); }
  .mletter:disabled { cursor: default; }
  .mletter.dim { opacity: .4; }

  /* Reading passage — sticky, always visible while doing exercises.
     Presentational only: the topic simply exposes a `passage` field. */
  .reading-passage {
    position: sticky;
    top: 96px;                        /* clears the fixed topbar */
    z-index: 20;
    background: var(--tl-surface);
    border: 1px solid var(--tl-border);
    border-left: 4px solid var(--tl-accent);
    border-radius: var(--tl-radius-md);
    padding: 18px 22px;
    margin-bottom: 18px;
    box-shadow: var(--tl-shadow-sm);
  }
  .reading-passage .rp-tag {
    font-size: 11px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wide);
    text-transform: uppercase;
    color: var(--tl-accent);
    margin-bottom: 4px;
  }
  .reading-passage h3 {
    font-size: var(--tl-fs-h4);
    font-weight: var(--tl-fw-bold);
    color: var(--tl-text);
    margin-bottom: 8px;
  }
  .reading-passage p.rp-body {
    font-size: 17px;
    line-height: 1.6;
    color: var(--tl-text);
    white-space: pre-wrap;
  }

  /* Compatibilidade */
  .chip { background: var(--tl-primary-soft) !important; color: var(--tl-primary) !important; border: 1px solid transparent !important; padding: 6px 12px; border-radius: var(--tl-radius-pill); font-size: 13px; font-weight: var(--tl-fw-semibold); }
  .bg-slate-700, .bg-slate-800, .bg-slate-900 { background: var(--tl-surface-alt) !important; }
  .bg-slate-600 { background: var(--tl-primary-soft) !important; }
  .border-slate-600, .border-slate-700 { border-color: var(--tl-border) !important; }

/* ===== PRACTICE — formatos novos ===== */

  /* Seletores compactos (Student · Topic). Um select nativo é o controle
     mais simples que mostra só a escolha atual e dá acesso aos 33 tópicos
     sem ocupar quatro linhas de chips. Legível em screen share. */
  /* Não dependemos do Tailwind (CDN) para o layout desta linha. */
  .pick-row    { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 18px; }
  .pick        { display: flex; flex-direction: column; gap: 4px; }
  .pick label  { font-size: 10px; font-weight: 800; letter-spacing: .09em;
                 text-transform: uppercase; color: var(--tl-text-tertiary); }
  .pick-sel    { font-size: 17px; font-weight: 700; padding: 10px 14px;
                 width: auto; min-width: 230px; max-width: 340px; cursor: pointer; }
  .pick-meta   { margin-left: auto; display: flex; align-items: center; gap: 12px; }


  /* Grupos de tipo: rótulo pequeno, chips compactos. O menu não compete
     com o exercício. */
  .type-group      { margin-bottom: 10px; }
  .type-group .lbl { font-size: 10px; font-weight: 800; letter-spacing: .09em;
                     text-transform: uppercase; color: var(--tl-text-tertiary);
                     margin-bottom: 6px; }
  .type-group .type-row { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Word bank */
  .wordbank      { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
  .wordbank .wb  { background: var(--tl-primary-tint); color: var(--tl-primary);
                   border-radius: var(--tl-radius-pill); padding: 7px 16px;
                   font-size: 16px; font-weight: 600; }

  /* Lacuna clicável dentro de Story / Dialogue */
  .gap { display: inline-block; min-width: 90px; text-align: center;
         border-bottom: 2px solid var(--tl-primary); color: var(--tl-primary);
         background: var(--tl-primary-tint); border-radius: 6px 6px 0 0;
         padding: 1px 10px; margin: 0 3px; cursor: pointer; font-weight: 700; }
  .gap:hover { background: var(--tl-primary-soft); }
  .gap.filled { background: var(--tl-success-soft); color: var(--tl-success-text);
                border-bottom-color: var(--tl-success); cursor: default; }

  .story-text { font-size: 21px; line-height: 2.1; color: var(--tl-text); }
  .dlg-line   { font-size: 21px; line-height: 2.1; margin-bottom: 6px; color: var(--tl-text); }
  .dlg-who    { font-weight: 800; color: var(--tl-primary); margin-right: 8px; }

  /* Make a Sentence — cards grandes, legíveis em screen share */
  .verb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
  @media(max-width:860px){ .verb-grid { grid-template-columns: repeat(3, 1fr); } }
  @media(max-width:560px){ .verb-grid { grid-template-columns: repeat(2, 1fr); } }
  .verb-card {
    background: var(--tl-surface-alt); border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-lg); padding: 22px 10px;
    font-size: 24px; font-weight: 700; color: var(--tl-text);
    text-align: center; cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .verb-card:hover { border-color: var(--tl-primary); transform: translateY(-2px); }
  .verb-card.used { border-color: var(--tl-success); }
  .verb-card .vmark { display:block; font-size: 13px; color: var(--tl-success-text); margin-top: 2px; }
  .verb-card.on .vmark { color: var(--tl-text-inverse); }
  .verb-card.on {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse); border-color: transparent;
  }
  .pol { display: inline-flex; align-items: center; justify-content: center;
         width: 46px; height: 46px; border-radius: var(--tl-radius-md);
         font-size: 22px; font-weight: 800; cursor: pointer;
         background: var(--tl-surface-alt); border: 2px solid var(--tl-border);
         color: var(--tl-text); }
  .pol.on { background: var(--tl-primary); color: var(--tl-text-inverse); border-color: transparent; }


</style>
  
</head>
<body>
<div class="min-h-screen">

  <!-- HEADER — Practice. O arquivo continua exercise-generator.html. -->
  <div class="topbar text-white p-6 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">Practice</h1>
          <p class="text-[#6B7280] text-sm font-semibold" id="hdrSub">Pick a topic</p>
        </div>
        <button onclick="goHome()" class="bg-white text-indigo-600 font-bold py-2 px-4 rounded-lg hover:bg-indigo-50 text-sm"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</button>
      </div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto p-4 md:p-6">

    <!-- Aluno e tópico em dois seletores. 33 tópicos não cabem como chips:
         um select mostra só o escolhido e continua dando acesso a todos. -->
    <div class="card rounded-xl p-4 mb-4 pick-row">
      <div class="pick"><label for="stuSelect">Student</label>
        <select id="stuSelect" class="inp pick-sel" onchange="pickStu(this.value)"></select></div>
      <div class="pick"><label for="topicSelect">Topic</label>
        <select id="topicSelect" class="inp pick-sel" onchange="pickTopic(this.value)"></select></div>
      <div class="pick-meta">
        <p id="saveWarn" style="display:none;font-size:13px;font-weight:600;color:var(--tl-danger-text);background:var(--tl-danger-soft);border:1px solid var(--tl-danger);border-radius:var(--tl-radius-md);padding:6px 12px"></p>
        <p class="text-slate-400 text-sm" id="usedCount">—</p>
      </div>
    </div>

    <!-- Tipos de prática, em três grupos -->
    <div id="typeSelector" class="mb-5"></div>

    <!-- Um exercício por vez -->
    <div id="exerciseArea"></div>

  </div>
</div>

<script src="platform-students.js?v=1"></script>
<script src="platform-content.js?v=1"></script>
<script src="platform-practice-log.js?v=1"></script>
<script src="engine/grammar-topics.js?v=4"></script>
<script src="engine/practice-bank.js?v=2"></script>
<script src="engine/practice-adapters.js?v=1"></script>
<script>
/* ===========================================================================
   PRACTICE — a página central de prática
   ---------------------------------------------------------------------------
   Student → Topic → Type → Exercise, um exercício por vez.

   O arquivo continua sendo exercise-generator.html (URLs preservadas); só o
   nome visível mudou para "Practice".

   FONTE DO CONTEÚDO
   -----------------
   Tudo vem de TeacherLu.PracticeBank: o banco próprio (engine/practice-bank.js)
   e os bancos externos registrados (engine/practice-adapters.js expõe os 337
   exercícios do Grammar sem copiá-los). Nenhum conteúdo é declarado aqui.

   REGISTRO DE USO
   ---------------
   Cada formato marca no PracticeLog no seu estado terminal — nunca ao
   renderizar, nunca só no reveal, nunca só no Next. Errar conta como uso.

   FILTRO DE CONCLUÍDOS: LIGADO
   ----------------------------
   Ao escolher um aluno, o pool oferece só o que ELE ainda não fez:

       pool bruto (topic + type)
         → PracticeLog.available(studentId, pool)
         → fora os conjuntos já fechados (Reading por groupId,
            Make a Sentence quando todos os verbos foram gastos)
         → Next/Random trabalha só com o que sobrou.

   Nunca é global: é sempre por studentId. Sem aluno selecionado, nada é
   filtrado. Quando o filtro esvazia o pool, a tela diz que acabou e NÃO
   reinicia sozinha.
   =========================================================================== */

const PB = TeacherLu.PracticeBank;
const PL = TeacherLu.PracticeLog;

let TOPICS = PB.topics();
let curTopic = TOPICS.length ? (TOPICS.find(t=>t.key==='past') ? 'past' : TOPICS[0].key) : null;
let curType  = 'all';
let poolRaw = [];     // pool bruto do filtro atual (topic+type), sem o aluno
let pool = [];        // fila DESTA sessão: o que faltava quando o pool abriu
let idx  = 0;
let ui   = {};        // estado transitório da tela, por id de exercício
let reviewing = false; // sessão de revisão manual (não altera o PracticeLog)

/* ---------- aluno ---------- */
const STUDENTS_DATA = TeacherLu.Students.load();
let curStu = localStorage.getItem('sabatovicz_current_student');
if(!STUDENTS_DATA.some(s=>s.id===curStu)) curStu = STUDENTS_DATA.length ? STUDENTS_DATA[0].id : null;

function pickStu(id){
  curStu=id;
  localStorage.setItem('sabatovicz_current_student',id);
  clearSaveWarning();
  renderStuBar();
  loadPool();          // o pool é do aluno: trocar de aluno recarrega
}
function renderStuBar(){
  const el=document.getElementById('stuSelect'); if(!el) return;
  if(!STUDENTS_DATA.length){ el.innerHTML='<option>No students yet</option>'; return; }
  el.innerHTML=STUDENTS_DATA.map(s=>
    `<option value="${s.id}" ${s.id===curStu?'selected':''}>${s.emoji||''} ${s.name}</option>`).join('');
}
/* ---------- contador: FONTE ÚNICA DE VERDADE ----------
   Todo número de conclusão da tela sai daqui — o do topo e o da tela de
   fim. Ninguém mais calcula "completed" por conta própria.

   A conta é sempre:
       completed = total do filtro atual − o que este aluno ainda não fez

   e o "ainda não fez" é relido do PracticeLog a cada chamada. Guardar o
   tamanho do pool no momento em que ele foi carregado era o bug: marcar um
   exercício não encolhe a fila da sessão (`pool`), então o topo continuava
   dizendo "0 / 18" enquanto o aluno já tinha feito os 18.

   `left` é o que RESTA de verdade; `pool.length` é só o tamanho da fila
   aberta nesta sessão. São coisas diferentes e não podem ser confundidas. */
function practiceStats(){
  const total = poolRaw.length;
  if(!curStu || !total) return { total, completed:0, left: total };
  const left = availableFor(poolRaw).length;
  return { total, completed: total - left, left };
}

function renderUsedCount(){
  const el=document.getElementById('usedCount'); if(!el) return;
  const s = practiceStats();
  if(!curStu || !s.total){ el.textContent='—'; return; }
  el.textContent = s.completed + ' / ' + s.total + ' completed';
}

/* ---------- aviso de gravação ----------
   markDone devolvendo false significa que o localStorage recusou a escrita.
   A professora precisa ver: o contador não sobe e o aviso aparece. */
let saveWarnTimer;
function showSaveWarning(){
  const el=document.getElementById('saveWarn'); if(!el) return;
  el.textContent='Could not save this exercise. Progress was not recorded.';
  el.style.display='';
  clearTimeout(saveWarnTimer);
  saveWarnTimer=setTimeout(clearSaveWarning,8000);
}
function clearSaveWarning(){
  const el=document.getElementById('saveWarn'); if(!el) return;
  el.style.display='none'; clearTimeout(saveWarnTimer);
}

/* ---------- registro de uso ----------
   Uma única porta de entrada. `_logged` evita regravar na mesma tela; o
   PracticeLog já é idempotente por (exercício, dia). */
function markUsed(item){
  if(!curStu || !item || !item.id) return;
  const st = ui[item.id] || (ui[item.id]={});
  if(st._logged) return;
  st._logged = true;
  if(PL.markDone(curStu, item.id) === false){
    st._logged = false;
    showSaveWarning();
    return;
  }
  clearSaveWarning();
  renderUsedCount();
  maybeMarkGroup(item);
}

/* Sub-unidade com id próprio (verbo de Make a Sentence). Marca só ela.
   Quando TODAS as sub-unidades estiverem gastas, o id da tela também é
   marcado — assim o filtro futuro pergunta uma coisa só para tirar o
   conjunto inteiro do pool, do mesmo jeito que o Reading. */
function markUnit(item, unitId){
  if(!curStu || !unitId) return;
  const s=st(item);
  s._loggedUnits = s._loggedUnits || {};
  if(s._loggedUnits[unitId]) return;
  s._loggedUnits[unitId]=true;
  if(PL.markDone(curStu, unitId) === false){
    s._loggedUnits[unitId]=false;
    if(s.judgedVerbs) delete s.judgedVerbs[unitId];
    showSaveWarning();
    return;
  }
  clearSaveWarning();
  renderUsedCount();

  const units=PB.unitsOf(item);
  if(units.length && units.every(id=>PL.isDone(curStu,id))){
    if(PL.markDone(curStu, item.id) === false){ showSaveWarning(); return; }
    renderUsedCount();
  }
}

/* Unidade de uso: um texto de Reading só é consumido por inteiro. */
function maybeMarkGroup(item){
  if(!curStu || !item || !item.groupId) return;
  if(PL.isDone(curStu, item.groupId)) return;
  const members = PB.groupMembers(item.topic);
  if(!members.length) return;
  if(!members.every(id=>PL.isDone(curStu,id))) return;
  if(PL.markDone(curStu, item.groupId) === false){ showSaveWarning(); return; }
  renderUsedCount();
}

/* ---------- seleção ---------- */
function renderTopics(){
  const el=document.getElementById('topicSelect'); if(!el) return;
  el.innerHTML = TOPICS.map(t=>
    `<option value="${t.key}" ${t.key===curTopic?'selected':''}>${t.label}${t.level?' · '+t.level:''}</option>`).join('');
}
function pickTopic(k){ curTopic=k; curType='all'; loadPool(); window.scrollTo({top:0,behavior:'smooth'}); }
function pickType(t){ curType=t; loadPool(); }

function renderTypes(){
  const counts=PB.typeCounts(curTopic);
  const el=document.getElementById('typeSelector');
  el.innerHTML = PB.GROUPS.map(g=>{
    const chips=PB.TYPES.filter(t=>t.group===g.id && counts[t.id]>0);
    if(!chips.length) return '';
    return `<div class="type-group"><div class="lbl">${g.label}</div><div class="type-row">`+
      chips.map(t=>`<button class="theme-btn ${t.id===curType?'active':''}" onclick="pickType('${t.id}')">${t.label} <span style="opacity:.6">${counts[t.id]}</span></button>`).join('')+
    `</div></div>`;
  }).join('');
}

/* O que este aluno ainda NÃO fez, dentro do pool bruto.
   Três perguntas, nesta ordem:
     1. o exercício em si já foi feito?
     2. ele pertence a um Reading cujo texto inteiro já foi concluído?
     3. é um conjunto (Make a Sentence) cujas unidades já foram todas gastas?
   Sem aluno selecionado, nada é escondido. */
function availableFor(raw){
  if(!curStu || !PL) return raw.slice();
  return PL.available(curStu, raw).filter(function(it){
    if(it.groupId && PL.isDone(curStu, it.groupId)) return false;
    const units = (PB.unitsOf ? PB.unitsOf(it) : []) || [];
    if(units.length && units.every(function(id){ return PL.isDone(curStu,id); })) return false;
    const members = (it.groupId && PB.groupMembers) ? (PB.groupMembers(it.topic)||[]) : [];
    if(members.length && members.every(function(id){ return PL.isDone(curStu,id); })) return false;
    return true;
  });
}

function loadPool(){
  poolRaw = PB.query({topic:curTopic, type:curType});
  reviewing = false;
  pool = availableFor(poolRaw);             // filtro por aluno — LIGADO
  idx = 0; ui = {};
  const t = TOPICS.find(x=>x.key===curTopic);
  document.getElementById('hdrSub').textContent = t ? (t.label + (t.level?' · '+t.level:'')) : '';
  renderTopics(); renderTypes(); renderUsedCount(); renderExercise();
}

/* Revisão manual: vale só para esta sessão, não apaga nada do PracticeLog
   e nunca é o comportamento padrão — a professora precisa pedir. */
function reviewCompleted(){
  const doneOnes = curStu ? poolRaw.filter(function(x){ return !availableFor([x]).length; }) : [];
  if(!doneOnes.length) return;
  reviewing = true;
  pool = doneOnes; idx = 0; ui = {};
  renderUsedCount(); renderExercise();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- navegação ---------- */
function nextEx(){ if(idx < pool.length){ idx++; renderExercise(); window.scrollTo({top:0,behavior:'smooth'}); } }
function prevEx(){ if(idx > 0){ idx--; renderExercise(); } }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function typeLabel(item){
  for(const t of PB.TYPES){ if(t.id!=='all' && t.match(item)) return t.label; }
  return 'Practice';
}
function st(item){ return ui[item.id] || (ui[item.id]={}); }

/* A visão embaralhada de um MC, estável enquanto o exercício estiver aberto.
   O embaralhamento acontece UMA vez, na primeira renderização; re-renderizar
   (escolher uma alternativa, voltar com ←) reusa a mesma ordem. O id do
   exercício não entra nessa conta e nunca muda. */
function mcOf(item){
  const s=st(item);
  if(!s.mc) s.mc = PB.mcView(item);
  return s.mc;
}

/* ---------- render ---------- */
function renderExercise(){
  const el=document.getElementById('exerciseArea');
  if(!pool.length || idx>=pool.length){ el.innerHTML=doneScreen(); return; }
  const item=pool[idx];
  const s=st(item);

  let html='';
  if(item.passage){
    html+=`<div class="reading-passage">
      <p class="rp-tag">Reading${item.passage.level?' · '+item.passage.level:''}</p>
      <h3>${esc(item.passage.title||'')}</h3>
      <p class="rp-body">${esc(item.passage.text||'')}</p></div>`;
  }

  html+='<div class="card rounded-xl p-6">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">'+
      `<span class="tag">${typeLabel(item)}</span>`+
      `<span class="text-slate-400 text-sm font-bold">${idx+1} / ${pool.length}</span>`+
    '</div>'+
    bodyOf(item)+
    footerOf(item)+
  '</div>';

  el.innerHTML=html;
}

/* Fim da fila. Nada reinicia sozinho; a revisão é um pedido explícito.

   DUAS SITUAÇÕES DIFERENTES — e era daqui que vinha a contradição:
   chegar ao fim da fila NÃO é o mesmo que ter concluído tudo. Passar de
   Next sem responder esvazia a fila com zero exercícios marcados. A tela
   antiga chamava os dois casos de "All exercises completed" e ainda
   imprimia "18 / 18" fixo, contra o "0 / 18" do topo.

   Agora os dois números saem de practiceStats(). */
function doneScreen(){
  const s = practiceStats();
  if(!s.total){
    return '<div class="card rounded-xl p-8" style="text-align:center"><p class="text-slate-400">Nothing here yet.</p></div>';
  }

  // Ainda há exercícios não feitos: a fila acabou, o tópico não.
  if(!reviewing && s.left > 0){
    return '<div class="card rounded-xl p-8" style="text-align:center">'+
      '<p class="text-white font-bold" style="font-size:20px;margin-bottom:6px">End of this round.</p>'+
      `<p class="text-slate-400 text-sm" style="margin-bottom:16px">${s.completed} / ${s.total} completed · ${s.left} still available</p>`+
      '<button onclick="loadPool()" class="theme-btn active font-bold py-2 px-5 rounded-lg">Continue with the remaining ' + s.left + '</button>'+
      '</div>';
  }

  const canReview = !!curStu && !reviewing && s.completed > 0;
  return '<div class="card rounded-xl p-8" style="text-align:center">'+
    '<p class="text-white font-bold" style="font-size:20px;margin-bottom:6px">All exercises completed.</p>'+
    `<p class="text-slate-400 text-sm" style="margin-bottom:16px">${s.completed} / ${s.total} completed</p>`+
    (canReview
      ? '<button onclick="reviewCompleted()" class="theme-btn font-bold py-2 px-5 rounded-lg">Review completed exercises</button>'
      : '')+
    '</div>';
}

/* ---------- corpo por formato ---------- */
function bodyOf(item){
  const s=st(item);
  switch(item.format){

    case 'multiple_choice': {
      // A ordem exibida vem de mcView() — embaralhada uma vez e guardada em
      // `s.mc`, para que reabrir a mesma tela (picked, prev/next dentro da
      // fila) não remexa as alternativas debaixo do aluno.
      const v = mcOf(item);
      const opts = v.options;

      // Duas origens, dois comportamentos:
      //  · banco próprio  -> a professora clica na alternativa que o aluno
      //    disse e o feedback é imediato;
      //  · Grammar        -> alternativas só de leitura, veredicto ✓/✗ no
      //    rodapé. A resposta lida em voz alta é recalculada para a nova
      //    posição por mcView().
      if(item.correctIndex===null||item.correctIndex===undefined){
        return `<p class="q-big text-white font-semibold mb-3">${item.q}</p>`+
          `<div>`+opts.map((o,i)=>`<div class="opt" style="cursor:default"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')+`</div>`+
          answerBlock(item, v.answerLabel);
      }
      return `<p class="q-big text-white font-semibold mb-4">${item.q}</p><div>`+
        opts.map((o,i)=>{
          let cls='opt';
          if(s.picked!==undefined){
            if(i===v.correctIndex) cls+=' right';
            else if(i===s.picked) cls+=' wrong';
            else cls+=' dim';
          }
          return `<button class="${cls}" ${s.picked!==undefined?'disabled':''} onclick="pickOption(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</button>`;
        }).join('')+'</div>';
    }

    case 'true_false': {
      const list=item.statements||[];
      return `<p class="tag mb-2">True or False</p><div class="space-y-3 mt-2">`+
        list.map((x,i)=>{
          const done=s['tf'+i]!==undefined;
          const t=done?(x.answer?' right':(s['tf'+i]===true?' wrong':'')):'';
          const f=done?(!x.answer?' right':(s['tf'+i]===false?' wrong':'')):'';
          return `<div><p class="text-white q-big mb-2">${i+1}. ${x.text}</p>
            <div style="display:flex;gap:8px">
              <button class="opt${t}" style="flex:1;text-align:center" ${done?'disabled':''} onclick="pickTF(${i},true)">✓ True</button>
              <button class="opt${f}" style="flex:1;text-align:center" ${done?'disabled':''} onclick="pickTF(${i},false)">✗ False</button>
            </div></div>`;
        }).join('')+'</div>';
    }

    case 'matching': {
      const pairs=item.pairs||[];
      // Fisher-Yates do banco — `sort(()=>Math.random()-0.5)` não é uma
      // permutação uniforme e concentra os itens perto da posição original.
      if(!s.opts) s.opts = PB.shuffle(pairs.map(p=>p.right));
      return `<p class="q-big text-white font-semibold mb-3">${item.q}</p>`+
        `<div class="legend">${s.opts.map((r,i)=>`<p><b>${String.fromCharCode(65+i)}</b>${r}</p>`).join('')}</div>`+
        `<div class="space-y-2">`+pairs.map((p,pi)=>{
          const done=s['m'+pi]!==undefined;
          const correct=s.opts.indexOf(p.right);
          return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <div style="min-width:120px"><span class="text-white font-bold" style="font-size:18px">${p.left}</span></div>
            <div style="display:flex;gap:6px">`+
              s.opts.map((r,ri)=>{
                let c='mletter';
                if(done){ if(ri===correct)c+=' right'; else if(ri===s['m'+pi])c+=' wrong'; else c+=' dim'; }
                return `<button class="${c}" ${done?'disabled':''} onclick="pickMatch(${pi},${ri},${correct})">${String.fromCharCode(65+ri)}</button>`;
              }).join('')+
            `</div></div>`;
        }).join('')+`</div>`;
    }

    case 'make_question':
      return `<p class="text-slate-400 text-sm mb-2">Answer</p>
        <p class="q-big text-white font-semibold mb-4">${item.answerLine}</p>
        <p class="text-slate-400 text-sm mb-1">${item.prompt}</p>`+
        answerBlock(item, item.expected);

    case 'story': {
      const parts=String(item.text).split('___');
      let h = `<h3 class="text-white font-bold" style="font-size:26px;margin-bottom:4px">${esc(item.title)}</h3>`+
              (item.context?`<p class="text-slate-400 text-sm mb-2">${esc(item.context)}</p>`:'');
      if(item.wordBank) h+=`<div class="wordbank">${item.wordBank.map(w=>`<span class="wb">${esc(w)}</span>`).join('')}</div>`;
      h+='<p class="story-text">';
      parts.forEach((txt,i)=>{
        h+=esc(txt);
        if(i<parts.length-1) h+=gapHTML(item,i);
      });
      h+='</p>';
      return h;
    }

    case 'dialogue': {
      let h = `<h3 class="text-white font-bold" style="font-size:26px;margin-bottom:4px">${esc(item.title)}</h3>`+
              (item.context?`<p class="text-slate-400 text-sm mb-2">${esc(item.context)}</p>`:'');
      if(item.wordBank) h+=`<div class="wordbank">${item.wordBank.map(w=>`<span class="wb">${esc(w)}</span>`).join('')}</div>`;
      let g=0;
      (item.lines||[]).forEach(ln=>{
        h+='<div class="dlg-line"><span class="dlg-who">'+esc(ln.who)+':</span>';
        String(ln.text).split('___').forEach((txt,i,arr)=>{
          h+=esc(txt);
          if(i<arr.length-1){ h+=gapHTML(item,g); g++; }
        });
        h+='</div>';
      });
      return h;
    }

    case 'make_sentence': {
      // Cada VERBO é a unidade de uso. Trabalhar BUY não gasta DRINK.
      // A polaridade (+ / – / ?) é variação de produção do mesmo verbo e
      // nunca cria registro.
      const s2=st(item);
      if(!s2.pol) s2.pol='+';
      const POL=['+','–','?'];
      // Verbos gastos em aulas anteriores saem da grade deste aluno. O que
      // foi julgado AGORA continua visível com ✓ até a próxima abertura.
      const verbs=(item.verbs||[]).filter(v=>{
        if(reviewing || !curStu) return true;
        const judgedNow = s2.judgedVerbs && s2.judgedVerbs[v.id]!==undefined;
        return judgedNow || !PL.isDone(curStu, v.id);
      });
      const sel=s2.verbId ? verbs.find(v=>v.id===s2.verbId) : null;
      return `<p class="q-big text-white font-semibold mb-1">${esc(item.instruction)}</p>
        <div style="display:flex;gap:8px;align-items:center;margin-top:14px">
          ${POL.map(p=>`<button class="pol ${s2.pol===p?'on':''}" onclick="setPol('${p}')">${p}</button>`).join('')}
          <button class="theme-btn font-bold py-2 px-4 rounded-lg" style="margin-left:6px" onclick="randomPol()">🎲 Random</button>
          ${sel?`<span style="margin-left:auto;font-size:22px;font-weight:800;color:var(--tl-primary)">${esc(sel.v)} &nbsp;${s2.pol}</span>`:''}
        </div>
        <div class="verb-grid">${verbs.map(v=>{
          const on   = s2.verbId===v.id;
          const done = !!(s2.judgedVerbs && s2.judgedVerbs[v.id]!==undefined);
          return `<div class="verb-card ${on?'on':''} ${done?'used':''}" onclick="pickVerb('${v.id}')">${esc(v.v)}${done?'<span class="vmark">✓</span>':''}</div>`;
        }).join('')}</div>`;
    }

    /* complete · unscramble · fix · transform · open — mesmo runner */
    case 'unscramble':
      return `<p class="q-big text-white font-semibold mb-2">Put in order: <b>${item.q}</b></p>`+answerBlock(item,item.a);
    case 'fix':
      return `<p class="q-big text-white font-semibold mb-2">Find the mistake: <span style="color:var(--tl-danger-text)">“${item.q}”</span></p>`+answerBlock(item,item.a);
    default:
      return `<p class="q-big text-white font-semibold mb-2">${item.q}</p>`+answerBlock(item, item.a);
  }
}

function gapHTML(item,i){
  const s=st(item);
  const filled = s['g'+i];
  return filled
    ? `<span class="gap filled">${esc((item.answers||[])[i]||'')}</span>`
    : `<span class="gap" onclick="fillGap(${i})">___</span>`;
}

function answerBlock(item, answer){
  const s=st(item);
  if(!answer) return '';
  if(!s.revealed){
    return `<div style="margin-top:18px"><button class="reveal-btn" onclick="revealAnswer()">👁 Show answer</button></div>`;
  }
  let h=`<div style="margin-top:18px"><p class="answer-big">${answer}</p>`;
  if(item.why||item.ruleRef||item.exSample){
    h+='<div class="mistake" style="margin-top:6px">'+
      (item.why?`<div class="text-sm">❌ ${item.why}</div>`:'')+
      (item.ruleRef?`<div class="text-sm">📐 ${item.ruleRef}</div>`:'')+
      (item.exSample?`<div class="text-sm">➕ ${item.exSample}</div>`:'')+
    '</div>';
  }
  return h+'</div>';
}

/* ---------- rodapé: veredicto + navegação ---------- */
/* Formatos que dão o próprio veredicto pelo clique do aluno/professora —
   não precisam dos botões ✓/✗ no rodapé. */
function selfJudging(item){
  if(item.format==='true_false'||item.format==='matching') return true;
  return item.format==='multiple_choice' && item.correctIndex!==null && item.correctIndex!==undefined;
}

function canJudge(item){
  const s=st(item);
  if(item.format==='story'||item.format==='dialogue'){
    const n=(item.answers||[]).length;
    for(let i=0;i<n;i++) if(!s['g'+i]) return false;
    return true;
  }
  if(item.format==='make_sentence') return !!s.verbId && !(s.judgedVerbs&&s.judgedVerbs[s.verbId]);
  return true;
}

function footerOf(item){
  const s=st(item);
  const showVerdict = !selfJudging(item);
  const enabled = canJudge(item);
  let h='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--tl-border)">';
  if(showVerdict){
    h+=`<button onclick="judge(true)" class="font-bold" style="cursor:${enabled?'pointer':'default'};font-size:17px;padding:9px 22px;border-radius:var(--tl-radius-md);background:var(--tl-success-soft);color:var(--tl-success-text);border:2px solid ${s.verdict===true?'var(--tl-success)':'transparent'};opacity:${enabled?(s.verdict===false?'.35':'1'):'.3'}">✓</button>`+
       `<button onclick="judge(false)" class="font-bold" style="cursor:${enabled?'pointer':'default'};font-size:17px;padding:9px 22px;border-radius:var(--tl-radius-md);background:var(--tl-danger-soft);color:var(--tl-danger-text);border:2px solid ${s.verdict===false?'var(--tl-danger)':'transparent'};opacity:${enabled?(s.verdict===true?'.35':'1'):'.3'}">✗</button>`;
  }
  h+='<span style="flex:1"></span>';
  if(idx>0) h+='<button onclick="prevEx()" class="theme-btn py-2 px-4 rounded-lg">←</button>';
  h+='<button id="btnNext" onclick="nextEx()" class="theme-btn active font-bold py-2 px-6 rounded-lg">Next →</button>';
  return h+'</div>';
}

/* ---------- interações ----------
   Cada uma leva ao estado terminal do seu formato — e só aí markUsed. */

function pickOption(i){                       // Multiple Choice
  const item=pool[idx], s=st(item);
  if(s.picked!==undefined) return;
  s.picked=i;
  markUsed(item);                             // alternativa escolhida = usado
  renderExercise();
}

function pickTF(i,val){                       // True/False (bloco)
  const item=pool[idx], s=st(item);
  if(s['tf'+i]!==undefined) return;
  s['tf'+i]=val;
  const n=(item.statements||[]).length;
  let all=true; for(let k=0;k<n;k++) if(s['tf'+k]===undefined) all=false;
  if(all) markUsed(item);                     // bloco só conta inteiro
  renderExercise();
}

function pickMatch(pi,ri){                    // Matching (bloco)
  const item=pool[idx], s=st(item);
  if(s['m'+pi]!==undefined) return;
  s['m'+pi]=ri;
  const n=(item.pairs||[]).length;
  let all=true; for(let k=0;k<n;k++) if(s['m'+k]===undefined) all=false;
  if(all) markUsed(item);
  renderExercise();
}

function revealAnswer(){                      // reveal NUNCA marca
  const item=pool[idx];
  st(item).revealed=true;
  renderExercise();
}

function fillGap(i){                          // Story / Dialogue
  const item=pool[idx];
  st(item)['g'+i]=true;                       // revelar lacuna também não marca
  renderExercise();
}

function setPol(p){ st(pool[idx]).pol=p; renderExercise(); }   // não marca nada
function randomPol(){ const P=['+','–','?']; setPol(P[Math.floor(Math.random()*3)]); }
function pickVerb(id){ st(pool[idx]).verbId=id; renderExercise(); }   // selecionar não marca

function judge(ok){                           // estado terminal
  const item=pool[idx], s=st(item);
  if(!canJudge(item)) return;

  // Make a Sentence: o veredicto marca O VERBO, não a tela.
  if(item.format==='make_sentence'){
    const verbId=s.verbId;
    if(!verbId) return;
    s.judgedVerbs = s.judgedVerbs || {};
    if(s.judgedVerbs[verbId]!==undefined) return;
    s.judgedVerbs[verbId]=ok;
    markUnit(item, verbId);
    s.verbId=null;                            // libera a tela para o próximo verbo
    renderExercise();
    return;
  }

  if(s.verdict!==undefined) return;
  s.verdict=ok;
  markUsed(item);
  renderExercise();
}

function goHome(){ window.location.href='index.html'; }

/* ---------- init ---------- */
renderStuBar();
renderUsedCount();
if(curTopic) loadPool();
</script>
</body>
