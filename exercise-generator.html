<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz - Exercise Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Exercise Generator — overrides do DS + Tailwind + modo aula ao vivo */
  * { font-family: var(--tl-font-sans); }
  h1, h2, h3, h4 { font-family: var(--tl-font-sans); }
  body { background: var(--tl-bg) !important; color: var(--tl-text) !important; }

  /* Topbar unificada */
  .topbar {
    background: linear-gradient(120deg, var(--tl-primary) 0%, #0F5561 55%, var(--tl-secondary) 100%) !important;
    color: var(--tl-text-inverse) !important;
    box-shadow: var(--tl-shadow-md);
  }
  .topbar h1, .topbar h2, .topbar h3, .topbar p, .topbar span { color: var(--tl-text-inverse) !important; }
  [onclick="goHome()"] {
    background: rgba(255,255,255,.14) !important;
    border: 1px solid rgba(255,255,255,.35) !important;
    color: var(--tl-text-inverse) !important;
    font-family: var(--tl-font-sans) !important;
    border-radius: var(--tl-radius-md);
    padding: var(--tl-space-2) var(--tl-space-4);
    font-weight: var(--tl-fw-semibold);
  }
  [onclick="goHome()"]:hover { background: rgba(255,255,255,.24) !important; }

  /* Tailwind text overrides */
  .text-white       { color: var(--tl-text) !important; }
  .text-slate-300,
  .text-slate-400   { color: var(--tl-text-secondary) !important; }
  .text-slate-200   { color: var(--tl-text) !important; }
  .text-slate-500,
  .text-slate-600   { color: var(--tl-text-tertiary) !important; }
  .text-indigo-100,
  .text-indigo-200,
  .text-indigo-400  { color: var(--tl-primary) !important; }
  .text-emerald-400,
  .text-emerald-300 { color: var(--tl-success) !important; }
  .text-red-300,
  .text-red-400     { color: var(--tl-danger) !important; }
  .text-amber-300   { color: var(--tl-warning) !important; }
  .text-pink-300    { color: var(--tl-accent) !important; }

  .gradient-coral   { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-emerald { background: linear-gradient(135deg, var(--tl-secondary), var(--tl-success)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-indigo  { background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-amber   { background: linear-gradient(135deg, var(--tl-warning), #F59E0B) !important; color: var(--tl-warning-text) !important; }
  .gradient-pink    { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }

  /* Cards */
  .card {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    box-shadow: var(--tl-shadow-sm) !important;
    border-radius: var(--tl-radius-lg) !important;
    transition: box-shadow var(--tl-dur-base) var(--tl-ease), border-color var(--tl-dur-base) var(--tl-ease);
  }
  .card:hover { box-shadow: var(--tl-shadow-lg) !important; border-color: var(--tl-border-strong) !important; }
  .ex-card {
    border-left: 4px solid var(--tl-primary);
    padding: 22px;
    margin-bottom: 18px;
    border-radius: var(--tl-radius-md);
    background: var(--tl-surface);
    border: 1px solid var(--tl-border);
    border-left-width: 4px;
  }

  /* Options (múltipla escolha) */
  .opt {
    background: var(--tl-surface-alt) !important;
    border: 1.5px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: var(--tl-radius-md);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
    display: block;
    width: 100%;
    text-align: left;
    font-size: 17px;
    font-weight: var(--tl-fw-semibold);
  }
  .opt:hover { border-color: var(--tl-secondary) !important; }
  .opt.sel   { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; color: var(--tl-text-inverse) !important; }
  .opt.right { background: var(--tl-success-soft) !important; border-color: var(--tl-success) !important; color: var(--tl-success-text) !important; }
  .opt.wrong { background: var(--tl-danger-soft) !important;  border-color: var(--tl-danger) !important;  color: var(--tl-danger-text) !important; }
  .opt .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: var(--tl-radius-sm);
    background: var(--tl-primary-soft);
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    margin-right: 10px;
    flex-shrink: 0;
  }
  .opt.right .letter { background: var(--tl-success); color: var(--tl-text-inverse); }
  .opt.wrong .letter { background: var(--tl-danger);  color: var(--tl-text-inverse); }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .45; }

  /* Inputs */
  .inp {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .inp:focus { outline: none; border-color: var(--tl-border-focus) !important; box-shadow: var(--tl-shadow-focus); }
  .inp::placeholder, input::placeholder, textarea::placeholder { color: var(--tl-text-tertiary) !important; }
  .inp.right { border-color: var(--tl-success) !important; }
  .inp.wrong { border-color: var(--tl-danger) !important; }
  select.inp option { background: var(--tl-surface) !important; color: var(--tl-text) !important; }

  .tag { color: var(--tl-text-tertiary); font-size: 11px; font-weight: var(--tl-fw-bold); text-transform: uppercase; letter-spacing: var(--tl-tracking-wide); }

  /* Botões theme */
  .theme-btn {
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: var(--tl-radius-sm);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    background: var(--tl-primary-tint);
    color: var(--tl-primary);
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .theme-btn:hover { border-color: var(--tl-primary); }
  .theme-btn.active { background: var(--tl-primary); color: var(--tl-text-inverse); }

  .correct-note { color: var(--tl-success-text); font-weight: var(--tl-fw-semibold); font-size: 13px; margin-top: 6px; }

  /* ===== LIVE CLASS MODE ===== */
  .q-big { font-size: 22px !important; line-height: 1.45; }
  .reveal-btn {
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    font-weight: var(--tl-fw-bold);
    padding: 12px 22px;
    border-radius: var(--tl-radius-md);
    font-size: 16px;
    cursor: pointer;
    border: none;
    transition: background var(--tl-dur-fast) var(--tl-ease);
  }
  .reveal-btn:hover { background: var(--tl-primary-hover); }
  .answer-big {
    font-size: 30px;
    font-weight: var(--tl-fw-bold);
    color: var(--tl-success-text);
    margin: 10px 0;
  }
  .judge {
    padding: 10px 18px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-bold);
    font-size: var(--tl-fs-body);
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .judge.jr { background: var(--tl-success-soft); color: var(--tl-success-text); }
  .judge.jw { background: var(--tl-danger-soft);  color: var(--tl-danger-text); }
  .judge.picked { border-color: currentColor; }
  .judge:disabled { opacity: .45; cursor: default; }

  .legend {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .legend p { font-size: 16px; margin: 4px 0; color: var(--tl-text); }
  .legend b { color: var(--tl-primary); margin-right: 8px; }

  .mletter {
    width: 42px; height: 42px;
    border-radius: var(--tl-radius-md);
    background: var(--tl-primary-tint);
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    font-size: 17px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .mletter:hover { border-color: var(--tl-primary); }
  .mletter.right { background: var(--tl-success); color: var(--tl-text-inverse); }
  .mletter.wrong { background: var(--tl-danger);  color: var(--tl-text-inverse); }
  .mletter:disabled { cursor: default; }
  .mletter.dim { opacity: .4; }

  /* Reading passage — sticky, always visible while doing exercises.
     Presentational only: the topic simply exposes a `passage` field. */
  .reading-passage {
    position: sticky;
    top: 96px;                        /* clears the fixed topbar */
    z-index: 20;
    background: var(--tl-surface);
    border: 1px solid var(--tl-border);
    border-left: 4px solid var(--tl-accent);
    border-radius: var(--tl-radius-md);
    padding: 18px 22px;
    margin-bottom: 18px;
    box-shadow: var(--tl-shadow-sm);
  }
  .reading-passage .rp-tag {
    font-size: 11px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wide);
    text-transform: uppercase;
    color: var(--tl-accent);
    margin-bottom: 4px;
  }
  .reading-passage h3 {
    font-size: var(--tl-fs-h4);
    font-weight: var(--tl-fw-bold);
    color: var(--tl-text);
    margin-bottom: 8px;
  }
  .reading-passage p.rp-body {
    font-size: 17px;
    line-height: 1.6;
    color: var(--tl-text);
    white-space: pre-wrap;
  }

  /* Compatibilidade */
  .chip { background: var(--tl-primary-soft) !important; color: var(--tl-primary) !important; border: 1px solid transparent !important; padding: 6px 12px; border-radius: var(--tl-radius-pill); font-size: 13px; font-weight: var(--tl-fw-semibold); }
  .bg-slate-700, .bg-slate-800, .bg-slate-900 { background: var(--tl-surface-alt) !important; }
  .bg-slate-600 { background: var(--tl-primary-soft) !important; }
  .border-slate-600, .border-slate-700 { border-color: var(--tl-border) !important; }
</style>
</head>
<body>
<div class="min-h-screen">
  <!-- HEADER -->
  <div class="topbar text-white p-6 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">Exercise Generator</h1>
          <p class="text-[#6B7280] text-sm">Lots of practice · A1</p>
        </div>
        <button onclick="goHome()" class="bg-white text-indigo-600 font-bold py-2 px-4 rounded-lg hover:bg-indigo-50 text-sm"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</button>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1" id="themeButtons"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- Student bar — quem está praticando agora. Sem isto o PracticeLog não
         sabe de quem é o registro. UI mínima de propósito (etapa 4). -->
    <div class="card rounded-xl p-4 mb-4 flex items-center justify-between flex-wrap gap-3">
      <div id="stuBar" class="flex items-center flex-wrap"></div>
      <p class="text-slate-400 text-sm" id="usedCount">—</p>
    </div>

    <div class="card rounded-xl p-5 mb-6 flex items-center justify-between flex-wrap gap-3">
      <div>
        <p class="text-slate-400 text-sm">Current topic</p>
        <p class="text-white text-xl font-bold" id="currentTopic">—</p>
      </div>
      <div class="text-right">
        <p class="text-slate-400 text-sm">Score</p>
        <p class="text-emerald-400 text-2xl font-bold" id="scoreDisplay">—</p>
      </div>
    </div>

    <div id="exercisesContainer"></div>

    <div class="card rounded-xl p-6 mt-6 flex gap-3 flex-wrap">
      <button onclick="loadTopic(currentKey)" class="gradient-emerald text-white font-bold py-3 px-6 rounded-lg">↺ Restart</button>
      <button onclick="exportPDF()" class="gradient-indigo text-white font-bold py-3 px-6 rounded-lg">Download PDF (with answer key)</button>
    </div>
    <div id="printArea" class="hidden"></div>
  </div>
</div>

<script src="platform-students.js?v=1"></script>
<script src="platform-content.js?v=1"></script>
<script src="platform-practice-log.js?v=1"></script>
<script src="engine/practice-bank.js?v=1"></script>
<script src="platform-print.js?v=1"></script>
<script>
// ================= EXERCISE BANK =================
/* ================= EXERCISE BANK =================
   Os dados saíram desta página para engine/practice-bank.js (mesmos tópicos,
   mesma ordem, mesmas respostas — só ganharam um `id` permanente por
   exercício). Este alias mantém todo o resto do arquivo inalterado. */
const bank = TeacherLu.PracticeBank.TOPICS;

// ================= ESTADO =================
// LIVE CLASS MODE: the student watches the shared screen and SAYS the answer
// (e.g. "letter B!"); the TEACHER clicks it. Feedback is instant, score is live.
let currentKey = null;
let exercises = [];
let correctCount = 0, answeredCount = 0, totalCount = 0;

/* ===========================================================================
   ALUNO + PRACTICE LOG  (etapa 4 — registrar SEM esconder)
   ---------------------------------------------------------------------------
   Nesta fase o log só GRAVA. Nenhum exercício é filtrado nem escondido:
   um exercício já feito continua aparecendo normalmente. O objetivo é
   validar a regra de conclusão em aula real antes de tirar conteúdo do
   pool de alguém.

   REGRA DE CONCLUSÃO (canônica)
   -----------------------------
   Um exercício é marcado no PRIMEIRO instante em que atinge estado
   terminal — veredicto registrado em todos os sub-itens obrigatórios.
     • Multiple choice ....... clique na alternativa
     • Fill in the blank ..... clique em ✓ got it / ✗ missed
     • True/False (bloco) .... último statement julgado
     • Matching (bloco) ...... último par julgado
   NUNCA ao renderizar. NUNCA no reveal sozinho. NUNCA no Next sozinho.
   Errar TAMBÉM marca: o exercício foi usado. A fila de erros é outra
   responsabilidade, de outro módulo.
   =========================================================================== */
const STUDENTS_DATA = TeacherLu.Students.load();
let curStu = localStorage.getItem('sabatovicz_current_student');
if(!STUDENTS_DATA.some(s=>s.id===curStu)) curStu = STUDENTS_DATA.length ? STUDENTS_DATA[0].id : null;

function pickStu(id){
  curStu = id;
  localStorage.setItem('sabatovicz_current_student', id);
  renderStuBar();
  renderUsedCount();
}

function renderStuBar(){
  const el = document.getElementById('stuBar');
  if(!el) return;
  if(!STUDENTS_DATA.length){
    el.innerHTML = '<span class="text-slate-400 text-sm">No students yet — add one in Students.</span>';
    return;
  }
  el.innerHTML = '<span class="text-slate-400 text-sm font-bold" style="margin-right:8px">Student:</span>' +
    STUDENTS_DATA.map(s=>`<button onclick="pickStu('${s.id}')" class="theme-btn ${s.id===curStu?'active':''}" style="margin:2px">${s.emoji||''} ${s.name}</button>`).join('');
}

function renderUsedCount(){
  const el = document.getElementById('usedCount');
  if(!el) return;
  if(!curStu){ el.textContent = '—'; return; }
  const n = TeacherLu.PracticeLog.countDone(curStu);
  el.textContent = n + (n===1 ? ' exercise used' : ' exercises used');
}

/* Chamado UMA vez por exercício, no estado terminal. `_logged` evita
   regravar dentro da mesma renderização; o próprio PracticeLog já é
   idempotente por (exercício, dia) — as duas guardas são baratas. */
function markUsed(ex){
  if(!curStu || !ex || !ex.id || ex._logged) return;
  ex._logged = true;
  TeacherLu.PracticeLog.markDone(curStu, ex.id);
  renderUsedCount();
}

function updateScore(ok){
  answeredCount++; if(ok)correctCount++;
  document.getElementById('scoreDisplay').textContent=`${correctCount}/${answeredCount} · ${totalCount} total`;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------------------------------------------------------------------
   Sanitização do enunciado de fill_blank para tela compartilhada com o aluno
   ---------------------------------------------------------------------------
   Alguns itens do banco carregam a resposta (ou o hint) entre parênteses no
   próprio enunciado — legado da versão em que a professora usava o texto para
   se lembrar da resposta durante a aula presencial. Ex.:
      "She is ___ happy (usually)."   answer:"usually"
      "We go to church ___ a week (once)."  answer:"once"
   Na aula online (tela compartilhada), esse parêntese ENTREGA a resposta
   antes do clique em "Show answer". Removemos apenas o parêntese final
   quando seu conteúdo corresponde exatamente à resposta ou ao hint
   (case-insensitive, ignorando espaços). Nenhum outro parêntese é tocado —
   parênteses semânticos como "(paint)" em "She enjoys ___ (paint)."
   permanecem, porque são a base verbal que o aluno precisa transformar.
   Nunca modificamos o dado original: só a string visível é sanitizada.
   ---------------------------------------------------------------------------*/
function sanitizeFillBlankQuestion(ex){
  if(!ex || typeof ex.question!=='string') return ex ? ex.question : '';
  const norm = s => String(s==null?'':s).trim().toLowerCase();
  const answer = norm(ex.correct);
  const hint   = norm(ex.hint);
  // captura APENAS o último parêntese antes de eventual ponto/interrogação
  //   final (ou fim de string). Aceita parênteses simples, sem aninhados.
  return ex.question.replace(
    /\s*\(([^()]+)\)\s*([.!?…]?)\s*$/,
    (match, inner, punct) => {
      const key = norm(inner);
      if(key && (key===answer || key===hint)){
        return punct || '';        // remove o parêntese, mantém a pontuação
      }
      return match;                // não bate: preserva
    }
  );
}

function renderThemeButtons(){
  const c=document.getElementById('themeButtons');
  c.innerHTML=Object.keys(bank).map(k=>`<button class="theme-btn ${k===currentKey?'active':''}" onclick="loadTopic('${k}')">${bank[k].label}</button>`).join('');
}

function loadTopic(key){
  currentKey=key;
  correctCount=0;answeredCount=0;totalCount=0;
  exercises=JSON.parse(JSON.stringify(bank[key].exercises));
  // pre-shuffle matching option lists
  exercises.forEach(ex=>{ if(ex.type==='matching'){ ex._opts=shuffle(ex.pairs.map(p=>p.right)); } });
  exercises.forEach(ex=>{
    if(ex.type==='multiple_choice'||ex.type==='fill_blank')totalCount++;
    if(ex.type==='true_false')totalCount+=ex.statements.length;
    if(ex.type==='matching')totalCount+=ex.pairs.length;
  });
  document.getElementById('currentTopic').textContent=bank[key].label;
  document.getElementById('scoreDisplay').textContent=`0/0 · ${totalCount} total`;
  renderThemeButtons();
  renderExercises();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExercises(){
  const c=document.getElementById('exercisesContainer');
  c.innerHTML='';
  // Reading passage (only rendered when the topic exposes one). Stays sticky
  // above the exercises so the student can re-read at any point.
  const p = bank[currentKey] && bank[currentKey].passage;
  if(p){
    const wrap=document.createElement('div');
    wrap.className='reading-passage';
    wrap.innerHTML=`<p class="rp-tag">Reading${p.level?' · '+p.level:''}</p>
      <h3>${p.title||''}</h3>
      <p class="rp-body">${p.text||''}</p>`;
    c.appendChild(wrap);
  }
  let num=0;
  exercises.forEach((ex,ei)=>{
    const card=document.createElement('div');
    card.className='card ex-card';
    if(ex.type==='multiple_choice'){
      num++;
      card.innerHTML=`<p class="tag">Choose the correct answer</p>
        <p class="text-white q-big font-semibold mb-3">${num}. ${ex.question}</p>
        <div>${ex.options.map((o,oi)=>`<button class="opt" id="opt-${ei}-${oi}" onclick="pick(${ei},${oi})"><span class="letter">${String.fromCharCode(65+oi)}</span>${o}</button>`).join('')}</div>`;
    }
    if(ex.type==='fill_blank'){
      num++;
      // ex.hint preservado no dado; nunca exibido na tela.
      // ex.question passa por sanitizeFillBlankQuestion() para remover parênteses
      //   finais que entregariam a resposta (ver comentário da função acima).
      const safeQ = sanitizeFillBlankQuestion(ex);
      card.innerHTML=`<p class="tag">Complete the sentence</p>
        <p class="text-white q-big font-semibold mb-3">${num}. ${safeQ}</p>
        <div id="fb-${ei}"><button class="reveal-btn" onclick="reveal(${ei})">👁 Show answer</button></div>`;
    }
    if(ex.type==='true_false'){
      card.innerHTML=`<p class="tag">True or False</p>
        <div class="space-y-3 mt-2">${ex.statements.map((s,si)=>`
          <div>
            <p class="text-white q-big mb-2">${si+1}. ${s.text}</p>
            <div style="display:flex;gap:8px">
              <button class="opt" style="flex:1;text-align:center" id="tf-${ei}-${si}-t" onclick="pickTF(${ei},${si},true)">✓ True</button>
              <button class="opt" style="flex:1;text-align:center" id="tf-${ei}-${si}-f" onclick="pickTF(${ei},${si},false)">✗ False</button>
            </div>
          </div>`).join('')}</div>`;
    }
    if(ex.type==='matching'){
      card.innerHTML=`<p class="tag">Match the pairs</p>
        <p class="text-white q-big font-semibold mb-3">${ex.question}</p>
        <div class="legend">${ex._opts.map((r,ri)=>`<p><b>${String.fromCharCode(65+ri)}</b>${r}</p>`).join('')}</div>
        <div class="space-y-2">${ex.pairs.map((p,pi)=>`
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <div style="min-width:110px"><span class="text-white font-bold" style="font-size:18px">${p.left}</span></div>
            <div style="display:flex;gap:6px">${ex._opts.map((r,ri)=>`<button class="mletter" id="ml-${ei}-${pi}-${ri}" onclick="pickMatch(${ei},${pi},${ri})">${String.fromCharCode(65+ri)}</button>`).join('')}</div>
          </div>`).join('')}</div>`;
    }
    c.appendChild(card);
  });
}

// Teacher clicks the option the student SAID → instant feedback, question locks.
function pick(ei,oi){
  const ex=exercises[ei];
  if(ex._done)return; ex._done=true;
  const ok=oi===ex.correct;
  ex.options.forEach((_,i)=>{
    const el=document.getElementById(`opt-${ei}-${i}`);
    el.disabled=true;
    if(i===ex.correct)el.classList.add('right');
    else if(i===oi)el.classList.add('wrong');
    else el.classList.add('dim');
  });
  updateScore(ok);
  markUsed(ex);                        // alternativa escolhida = exercício usado
}

function pickTF(ei,si,val){
  const ex=exercises[ei];
  if(!ex._done)ex._done={};
  if(ex._done[si])return; ex._done[si]=true;
  const s=ex.statements[si];
  const t=document.getElementById(`tf-${ei}-${si}-t`);
  const f=document.getElementById(`tf-${ei}-${si}-f`);
  t.disabled=true;f.disabled=true;
  (s.answer?t:f).classList.add('right');
  if(val!==s.answer)(val?t:f).classList.add('wrong');
  updateScore(val===s.answer);
  // Bloco: só conta como usado quando TODOS os statements foram julgados.
  if(Object.keys(ex._done).length===ex.statements.length) markUsed(ex);
}

function pickMatch(ei,pi,ri){
  const ex=exercises[ei];
  if(!ex._done)ex._done={};
  if(ex._done[pi])return; ex._done[pi]=true;
  const correctIdx=ex._opts.indexOf(ex.pairs[pi].right);
  ex._opts.forEach((_,i)=>{
    const el=document.getElementById(`ml-${ei}-${pi}-${i}`);
    el.disabled=true;
    if(i===correctIdx)el.classList.add('right');
    else if(i===ri)el.classList.add('wrong');
    else el.classList.add('dim');
  });
  updateScore(ri===correctIdx);
  // Bloco: só conta como usado quando TODOS os pares foram julgados.
  if(Object.keys(ex._done).length===ex.pairs.length) markUsed(ex);
}

// Fill in the blank: professora clica "Show answer" para revelar (aluno responde antes).
function reveal(ei){
  const box=document.getElementById(`fb-${ei}`);
  box.innerHTML=`<p class="answer-big">${exercises[ei].correct}</p>
    <div style="display:flex;gap:8px">
      <button class="judge jr" id="jr-${ei}" onclick="judge(${ei},true)">✓ Student got it</button>
      <button class="judge jw" id="jw-${ei}" onclick="judge(${ei},false)">✗ Missed it</button>
    </div>`;
}
function judge(ei,ok){
  const ex=exercises[ei];
  if(ex._done)return; ex._done=true;
  const r=document.getElementById(`jr-${ei}`),w=document.getElementById(`jw-${ei}`);
  r.disabled=true;w.disabled=true;
  (ok?r:w).classList.add('picked');
  updateScore(ok);
  markUsed(ex);                        // veredicto dado — reveal sozinho não marca
}

function exportPDF(){
  if(!currentKey){alert('Choose a topic first!');return;}
  const pa=document.getElementById('printArea');
  let num=0;
  let h=`<div style="font-family:Arial;color:#222;padding:30px;line-height:1.6">
    <h1 style="text-align:center;border-bottom:3px solid #0B3B46;padding-bottom:12px">Exercises — ${bank[currentKey].label}</h1>`;
  const _p = bank[currentKey].passage;
  if(_p){
    h+=`<div style="border-left:4px solid #db6d5d;background:#faf4f2;padding:14px 18px;margin:14px 0"><p style="font-size:11px;font-weight:700;letter-spacing:.5px;color:#a04a3e;margin:0 0 4px">READING${_p.level?' · '+_p.level:''}</p><h2 style="margin:0 0 8px;font-size:18px">${_p.title||''}</h2><p style="white-space:pre-wrap;margin:0">${_p.text||''}</p></div>`;
  }
  exercises.forEach(ex=>{
    if(ex.type==='multiple_choice'){num++;
      h+=`<p style="margin-top:14px"><b>${num}. ${ex.question}</b></p>`;
      ex.options.forEach((o,i)=>h+=`<p style="margin-left:15px">${String.fromCharCode(65+i)}) ${o} ${i===ex.correct?'<b>✔</b>':''}</p>`);
    }
    if(ex.type==='fill_blank'){num++;
      h+=`<p style="margin-top:14px"><b>${num}. ${ex.question}</b> &nbsp; <span style="color:#22C55E"><b>(${ex.correct})</b></span></p>`;
    }
    if(ex.type==='true_false'){
      h+=`<p style="margin-top:14px"><b>True or False:</b></p>`;
      ex.statements.forEach((s,i)=>h+=`<p style="margin-left:15px">${i+1}. ${s.text} — <b>${s.answer?'True':'False'}</b></p>`);
    }
    if(ex.type==='matching'){
      h+=`<p style="margin-top:14px"><b>${ex.question}</b></p>`;
      ex.pairs.forEach(p=>h+=`<p style="margin-left:15px">${p.left} → <b>${p.right}</b></p>`);
    }
  });
  h+=`</div>`;
  pa.innerHTML=h;
  printDoc(document.getElementById('printArea').innerHTML,'Sabatovicz');
}

// Reading track — expose the reading topics of `bank` to the Content registry
// so they show up under Learning Progress → Reading. Presentation and runner
// remain the existing ones; nothing else changes.
(function registerReading(){
  try{
    var NS = window.TeacherLu = window.TeacherLu || {};
    var provider = {
      id:'reading-exercises',
      skill:'reading',
      label:'Reading',
      load:function(){
        return Object.keys(bank)
          .filter(function(k){ return bank[k] && bank[k].passage; })
          .map(function(k){ return { key:k, topic:bank[k] }; });
      },
      map:function(raw, i){
        var p = raw.topic.passage || {};
        return {
          key:      raw.key,
          title:    p.title || raw.topic.label,
          subtitle: (raw.topic.exercises && raw.topic.exercises.length) ? raw.topic.exercises.length + ' exercises' : '',
          level:    p.level || '',
          order:    i
        };
      }
    };
    if (NS.Content) NS.Content.register(provider);
    else (NS.__pendingProviders = NS.__pendingProviders || []).push(provider);
  }catch(e){ console.warn('[reading] could not register', e); }
})();
