<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz — Lesson Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Sugestões flutuantes usadas apenas nesta tela */
  .lp-suggest-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .lp-suggest-list .lbl-inline {
    font-size:11px; color:var(--tl-text-tertiary); align-self:center;
  }
  .lp-suggest-list button {
    background: var(--tl-primary-tint);
    border: 1px dashed var(--tl-border-strong);
    color: var(--tl-primary);
    font-weight: 600;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--tl-radius-pill);
    cursor: pointer;
  }
  .lp-list-item {
    display:flex; align-items:center; gap:9px;
    padding:7px 8px; border-radius:var(--tl-radius-sm); cursor:pointer;
  }
  .lp-list-item.on { background: var(--tl-success-soft); }
  .lp-list-item.on span { color: var(--tl-success-text); font-weight: 600; }
  .lp-list-item input[type="checkbox"] {
    width:16px; height:16px; accent-color:var(--tl-secondary); cursor:pointer;
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topwrap">
    <div class="row">
      <div>
        <h1>Lesson Calendar</h1>
        <p>Track every lesson, student by student</p>
      </div>
      <a href="index.html" class="menu-btn"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</a>
    </div>
  </div>
</div>

<div class="wrap wrap-md">
  <!-- STUDENTS -->
  <div class="card">
    <div class="card-hd">
      <h3>Select student</h3>
      <a href="students.html" style="font-size:13px;font-weight:600"><i data-lucide="settings" class="tl-icon-sm"></i> Manage students</a>
    </div>
    <div class="stu-grid" id="stuGrid"></div>
  </div>

  <!-- CALENDAR -->
  <div class="card">
    <div class="navrow">
      <button class="nav-btn" onclick="shiftMonth(-1)" aria-label="Previous month"><i data-lucide="chevron-left" class="tl-icon-lg"></i></button>
      <div class="month-label" id="monthLabel"></div>
      <button class="nav-btn" onclick="shiftMonth(1)" aria-label="Next month"><i data-lucide="chevron-right" class="tl-icon-lg"></i></button>
    </div>
    <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <div class="lg"><span class="sw" style="background:var(--tl-success-soft);border-color:var(--tl-success)"></span> Lesson done</div>
      <div class="lg"><span class="sw" style="background:var(--tl-info-soft);border-color:var(--tl-info)"></span> Scheduled</div>
      <div class="lg"><span class="sw" style="background:var(--tl-danger-soft);border-color:var(--tl-danger)"></span> Cancelled</div>
      <div class="lg"><span class="sw" style="background:var(--tl-surface);border-color:var(--tl-border)"></span> No lesson</div>
      <div class="lg"><span style="width:5px;height:5px;border-radius:99px;background:var(--tl-primary);display:inline-block"></span> Has note</div>
    </div>
    <p class="tl-caption" style="margin-top:10px">Click any day to mark what happened and add a note.</p>
  </div>

  <!-- STATS -->
  <div class="card">
    <h3 style="margin-bottom:12px" id="statsTitle">This month</h3>
    <div class="stats">
      <div class="stat" style="background:var(--tl-success-soft);border-color:var(--tl-success)"><div class="v" style="color:var(--tl-success-text)" id="sDone">0</div><div class="l">Done</div></div>
      <div class="stat" style="background:var(--tl-info-soft);border-color:var(--tl-info)"><div class="v" style="color:var(--tl-info-text)" id="sSched">0</div><div class="l">Scheduled</div></div>
      <div class="stat" style="background:var(--tl-danger-soft);border-color:var(--tl-danger)"><div class="v" style="color:var(--tl-danger-text)" id="sCanc">0</div><div class="l">Cancelled</div></div>
      <div class="stat" style="background:var(--tl-primary-soft);border-color:var(--tl-primary)"><div class="v" style="color:var(--tl-primary)" id="sTotal">0</div><div class="l">Done all time</div></div>
    </div>
    <div class="toolbar" style="margin-top:16px">
      <button class="btn success" onclick="exportMonth()">Download month PDF</button>
      <button class="btn info" onclick="exportAll()">Download full history PDF</button>
      <button class="btn gray" onclick="goToday()">Go to today</button>
    </div>
  </div>
</div>

<!-- DAY MODAL -->
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="mTitle">Lesson</h3>
    <p class="sub" id="mSub"></p>
    <div class="opts">
      <button class="btn success sm" onclick="setStatus('done')">✓ Lesson done</button>
      <button class="btn info sm" onclick="setStatus('scheduled')">◷ Scheduled</button>
      <button class="btn danger sm" onclick="setStatus('cancelled')">✗ Cancelled</button>
      <button class="btn gray sm" onclick="setStatus('')">Clear</button>
    </div>
    <!-- ===== LEARNING PROGRESS — contents covered in this lesson ===== -->
    <div id="lpBlock" style="margin:14px 0 4px">
      <div class="row" style="margin-bottom:8px">
        <label class="lbl" style="margin:0">Contents covered</label>
        <span id="lpCount" class="tl-caption"></span>
      </div>
      <div id="lpSuggest"></div>
      <input class="inp" id="lpSearch" placeholder="Search vocabulary, grammar, speaking…" style="margin-bottom:8px">
      <div id="lpList" style="max-height:190px;overflow-y:auto;border:1px solid var(--tl-border);border-radius:var(--tl-radius-md);padding:6px"></div>
    </div>

    <label class="lbl">Note (homework, absence reason...)</label>
    <input class="inp" id="mNote" placeholder="e.g. she asked for extra practice">
    <div class="actions">
      <button class="btn gray" onclick="closeModal()">Close</button>
      <button class="btn primary" onclick="saveNote()">Save</button>
    </div>
  </div>
</div>

<!-- Learning Progress: dados dos módulos + camadas compartilhadas -->
<script src="engine/grammar-topics.js?v=4"></script>
<script src="engine/speaking-activities.js?v=4"></script>
<script src="engine/structures-content.js?v=1"></script>
<script src="platform-students.js?v=1"></script>
<script src="platform-content.js?v=1"></script>
<script src="engine/conversation-lessons.js?v=1"></script>
<script src="platform-progress.js?v=1"></script>

<script src="platform-print.js?v=1"></script>
<script>
/* ---------- shared student store (managed in students.html) ---------- */
/* ---------- student store — fonte única: platform-students.js ----------
   O bloco DEFAULT_STUDENTS/loadStudents que existia aqui foi centralizado.
   Estes aliases mantêm o restante desta página inalterado. -------------- */
const STU_KEY = TeacherLu.Students.KEY;
const DEFAULT_STUDENTS = TeacherLu.Students.DEFAULTS;
function loadStudents(){ return TeacherLu.Students.load(); }
const STUDENTS_DATA=loadStudents();
const STUDENTS=STUDENTS_DATA.map(s=>s.id);   // identidade = id (nome é só exibição)

/* Nome de exibição a partir do id — o nome nunca indexa nada. */
function displayName(id){ return TeacherLu.Students.nameOf(id); }
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let student=STUDENTS[0];   // id do aluno selecionado
let view=new Date(2026,6,1);   // July 2026
let selKey=null;

/* ---------- storage ---------- */
/* Chave SEMPRE por student.id — renomear um aluno não pode perder histórico.
   Registros antigos por nome são convertidos por
   TeacherLu.Students.migrateScheduleKeys() ao carregar platform-students.js. */
function keyFor(studentId,d){return 'sched|'+studentId+'|'+d;}
function getRec(s,d){try{const v=localStorage.getItem(keyFor(s,d));return v?JSON.parse(v):null;}catch(e){return null;}}
function setRec(s,d,rec){
  try{
    if(!rec||(!rec.status&&!rec.note))localStorage.removeItem(keyFor(s,d));
    else localStorage.setItem(keyFor(s,d),JSON.stringify(rec));
  }catch(e){alert('Could not save. Check your browser storage settings.');}
}
function allRecs(s){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('sched|'+s+'|')){
        const d=k.split('|')[2];
        const r=JSON.parse(localStorage.getItem(k));
        if(r)out.push({date:d,...r});
      }
    }
  }catch(e){}
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- helpers ---------- */
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function todayISO(){const t=new Date();return iso(t.getFullYear(),t.getMonth(),t.getDate());}
function pretty(d){const[y,m,dd]=d.split('-');return dd+' '+MONTHS[+m-1]+' '+y;}
function dowName(d){const dt=new Date(d+'T12:00:00');return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()];}

/* ---------- render ---------- */
function renderStudents(){
  document.getElementById('stuGrid').innerHTML=STUDENTS_DATA.map((s,i)=>
    `<button class="stu ${s.id===student?'active':''}" onclick="pickStudent(${i})">${s.emoji?s.emoji+' ':''}${s.name}</button>`).join('');
}
function pickStudent(i){student=STUDENTS_DATA[i].id;renderStudents();renderCal();}

function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  document.getElementById('monthLabel').textContent=MONTHS[m]+' '+y;
  document.getElementById('statsTitle').textContent=displayName(student)+' — '+MONTHS[m]+' '+y;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  let h='';
  for(let i=0;i<first;i++)h+='<div class="day blank"></div>';
  let done=0,sch=0,canc=0;
  for(let d=1;d<=days;d++){
    const k=iso(y,m,d);
    const r=getRec(student,k);
    const st=r&&r.status?r.status:'';
    if(st==='done')done++;else if(st==='scheduled')sch++;else if(st==='cancelled')canc++;
    const isToday=k===todayISO();
    const mark=st==='done'?'✓':st==='cancelled'?'✗':st==='scheduled'?'◷':'';
    const col=st==='done'?'var(--tl-success-text)':st==='cancelled'?'var(--tl-danger-text)':st==='scheduled'?'var(--tl-info-text)':'';
    h+=`<div class="day ${st} ${isToday?'today':''}" onclick="openDay('${k}')" title="${r&&r.note?r.note.replace(/"/g,'&quot;'):''}">
          <div class="n">${d}</div>
          ${mark?`<div class="mark" style="color:${col}">${mark}</div>`:''}
          ${r&&r.note?'<div class="notedot"></div>':''}
        </div>`;
  }
  document.getElementById('cal').innerHTML=h;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sSched').textContent=sch;
  document.getElementById('sCanc').textContent=canc;
  document.getElementById('sTotal').textContent=allRecs(student).filter(r=>r.status==='done').length;
}

function shiftMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal();}
function goToday(){const t=new Date();view=new Date(t.getFullYear(),t.getMonth(),1);renderCal();}

/* ---------- modal ---------- */
function openDay(k){
  selKey=k;
  const r=getRec(student,k)||{};
  document.getElementById('mTitle').textContent=displayName(student);
  document.getElementById('mSub').textContent=dowName(k)+', '+pretty(k);
  document.getElementById('mNote').value=r.note||'';
  document.getElementById('ov').classList.add('show');
  renderLessonProgress();
}
function closeModal(){document.getElementById('ov').classList.remove('show');selKey=null;}
function setStatus(st){
  if(!selKey)return;
  const r=getRec(student,selKey)||{};
  r.status=st;
  r.note=document.getElementById('mNote').value.trim();
  setRec(student,selKey,r);
  renderCal();closeModal();
}
function saveNote(){
  if(!selKey)return;
  const r=getRec(student,selKey)||{};
  r.note=document.getElementById('mNote').value.trim();
  if(!r.status&&r.note)r.status='done';
  setRec(student,selKey,r);
  renderCal();closeModal();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ================================================================
   LEARNING PROGRESS — o que foi dado nesta aula
   ================================================================ */
const LP_Content  = window.TeacherLu && window.TeacherLu.Content;
const LP_Progress = window.TeacherLu && window.TeacherLu.Progress;
let lpFilterText = '';

function lpStudentId(){ return student; }
function lpEsc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderLessonProgress(){
  if(!LP_Content || !LP_Progress) return;
  const sid = lpStudentId();
  const block = document.getElementById('lpBlock');
  if(!sid || !selKey){ block.style.display='none'; return; }
  block.style.display='';

  const covered = LP_Progress.ofLesson(sid, selKey);
  document.getElementById('lpCount').textContent =
    covered.length ? covered.length + ' marked' : 'nothing marked yet';

  // Sugestões: próximos conteúdos ainda não estudados por este aluno.
  const sug = LP_Progress.suggestions(sid, 4)
    .filter(s => covered.indexOf(s.item.id) === -1);
  document.getElementById('lpSuggest').innerHTML = sug.length
    ? `<div class="lp-suggest-list">
         <span class="lbl-inline">Suggested:</span>
         ${sug.map(s=>`<button type="button" onclick="lpMark('${s.item.id}')">
            ${s.skill.icon} ${lpEsc(s.item.title)}</button>`).join('')}
       </div>`
    : '';

  // Lista completa: marcados primeiro, depois o resto.
  const rows = [];
  LP_Content.SKILLS.forEach(sk => {
    LP_Content.items(sk.id).forEach(it => {
      if(lpFilterText && it.title.toLowerCase().indexOf(lpFilterText.toLowerCase()) === -1) return;
      rows.push({ it, sk, on: covered.indexOf(it.id) !== -1 });
    });
  });
  rows.sort((a,b) => (b.on?1:0)-(a.on?1:0));

  document.getElementById('lpList').innerHTML = rows.length
    ? rows.slice(0,60).map(r=>`
      <label class="lp-list-item ${r.on?'on':''}">
        <input type="checkbox" ${r.on?'checked':''} onchange="lpMark('${r.it.id}')">
        <span style="font-size:13px;color:var(--tl-text)">${r.sk.icon} ${lpEsc(r.it.title)}</span>
        ${r.it.level?`<span class="lvl-badge" style="margin-left:auto">${lpEsc(r.it.level)}</span>`:''}
      </label>`).join('')
    : '<div class="empty">No content matches.</div>';
}

function lpMark(itemId){
  const sid = lpStudentId();
  if(!sid || !selKey || !LP_Progress) return;
  const r = LP_Progress.toggle(sid, itemId, selKey);
  renderLessonProgress();
  renderCal();
  if(r && r.ok === false){
    alert('Could not save — the browser storage may be full. Nothing was changed.');
  }
}

document.addEventListener('input', e => {
  if(e.target && e.target.id === 'lpSearch'){
    lpFilterText = e.target.value;
    renderLessonProgress();
  }
});

/* ---------- export ---------- */
function label(s){return s==='done'?'Lesson done':s==='cancelled'?'Cancelled':s==='scheduled'?'Scheduled':'—';}
function rowsToTable(rows){
  if(!rows.length)return '<p>No lessons recorded.</p>';
  return `<table><thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Note</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${pretty(r.date)}</td><td>${dowName(r.date)}</td><td>${label(r.status)}</td><td>${r.note||''}</td></tr>`).join('')+
    `</tbody></table>`;
}
function exportMonth(){
  const y=view.getFullYear(),m=view.getMonth();
  const pre=iso(y,m,1).slice(0,7);
  const rows=allRecs(student).filter(r=>r.date.startsWith(pre));
  const done=rows.filter(r=>r.status==='done').length;
  const canc=rows.filter(r=>r.status==='cancelled').length;
  const html=`<h1>Lesson Calendar — ${displayName(student)}</h1>
    <p><b>Month:</b> ${MONTHS[m]} ${y}</p>
    <p><b>Lessons done:</b> ${done} · <b>Cancelled:</b> ${canc}</p>
    ${rowsToTable(rows)}`;
  printDoc(html,'Calendar-'+displayName(student)+'-'+MONTHS[m]+y);
}
function exportAll(){
  const rows=allRecs(student);
  const done=rows.filter(r=>r.status==='done').length;
  const html=`<h1>Lesson History — ${displayName(student)}</h1>
    <p><b>Total lessons done:</b> ${done}</p>
    ${rowsToTable(rows)}`;
  printDoc(html,'History-'+displayName(student));
}
function printDoc(html,title){ TeacherLu.printDoc(html, title, TeacherLu.PRINT_CSS.CALENDAR); }

renderStudents();renderCal();
</script>
</body>
</html>
