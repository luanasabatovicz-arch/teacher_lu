<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz — Listening Lab</title>
  <!-- Camada de nuvem: config -> supabase-js -> auth guard -> sync.
       Precisa vir ANTES de qualquer outro script: o guard decide sobre a
       sessao antes do primeiro pixel, e o engine de sync instala o
       interceptor de localStorage antes de qualquer store ler dado. -->
  <script src="platform-cloud-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="platform-auth.js"></script>
  <script src="platform-cloud.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Listening Lab — padrões desta tela sobre o DS */

  .filters { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 12px; }
  @media (max-width: 700px) { .filters { grid-template-columns: 1fr; } }
  .filters label {
    display: block;
    font-size: 11px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wide);
    text-transform: uppercase;
    color: var(--tl-text-tertiary);
    margin-bottom: 6px;
  }
  .sel {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    font-size: var(--tl-fs-small);
    color: var(--tl-text);
    background: var(--tl-surface);
    font-family: var(--tl-font-sans);
    cursor: pointer;
    transition: border-color var(--tl-dur-fast) var(--tl-ease), box-shadow var(--tl-dur-fast) var(--tl-ease);
  }
  .sel:focus { outline: none; border-color: var(--tl-border-focus); box-shadow: var(--tl-shadow-focus); }

  /* Lição */
  .lesson-head { border-left: 5px solid var(--tl-primary); padding-left: 16px; margin-bottom: 8px; }
  .lesson-head h2 { font-size: 25px; color: var(--tl-primary); }
  .lesson-head .meta { color: var(--tl-text-secondary); font-size: var(--tl-fs-small); margin-top: 3px; }
  .lvl {
    display: inline-block;
    font-size: 10.5px;
    font-weight: var(--tl-fw-bold);
    background: var(--tl-secondary-soft);
    color: var(--tl-secondary-hover);
    border: 1px solid transparent;
    border-radius: var(--tl-radius-pill);
    padding: 3px 9px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .theme-badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: var(--tl-fw-semibold);
    background: var(--tl-info-soft);
    color: var(--tl-info-text);
    border: 1px solid transparent;
    border-radius: var(--tl-radius-pill);
    padding: 3px 10px;
  }

  /* Player */
  .player {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-lg);
    padding: 18px;
    margin: 14px 0 4px;
  }
  .player .lbl {
    font-size: 11px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wider);
    text-transform: uppercase;
    opacity: .85;
    margin-bottom: 10px;
  }
  .player audio { width: 100%; height: 44px; }
  .player.unavailable { background: var(--tl-surface-alt); border: 1px solid var(--tl-border); color: var(--tl-text-secondary); }
  .player.unavailable .lbl { color: var(--tl-primary); opacity: .85; }
  .player .na { font-size: var(--tl-fs-small); color: var(--tl-text-secondary); }

  .sec { margin-top: 22px; }
  .sec > h3 {
    font-size: var(--tl-fs-small);
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wide);
    text-transform: uppercase;
    color: var(--tl-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--tl-primary-soft);
    margin-bottom: 13px;
  }
  .sec > h3 .n {
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    width: 21px; height: 21px;
    border-radius: var(--tl-radius-pill);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }

  /* Transcript */
  .btn.ghost { background: var(--tl-secondary-soft); color: var(--tl-secondary-hover); border-color: transparent; box-shadow: none; }
  .transcript-actions { display: flex; gap: 9px; flex-wrap: wrap; }
  .transcript {
    display: none;
    margin-top: 13px;
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 15px 17px;
    font-size: 15.5px;
    line-height: var(--tl-lh-relaxed);
    color: var(--tl-text);
  }
  .transcript.show { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(10px);
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-md);
    padding: 13px 20px;
    font-size: var(--tl-fs-small);
    font-weight: var(--tl-fw-semibold);
    box-shadow: var(--tl-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: all var(--tl-dur-base) var(--tl-ease);
    z-index: var(--tl-z-toast);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* Vocabulary */
  .vocab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 640px) { .vocab { grid-template-columns: 1fr; } }
  .vocab .v {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 10px 13px;
    font-size: 14.5px;
  }
  .vocab .v b { color: var(--tl-primary); }
  .vocab .v span { color: var(--tl-text-secondary); }

  /* Drills */
  .drill {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 10px 13px;
    margin-bottom: 6px;
    font-size: var(--tl-fs-body);
    display: flex;
    align-items: center;
    gap: 11px;
    flex-wrap: wrap;
  }
  .drill .q { flex: 1; min-width: 190px; }
  .drill .num { font-weight: var(--tl-fw-bold); color: var(--tl-text-tertiary); font-size: var(--tl-fs-label); }
  .reveal {
    background: var(--tl-primary-soft);
    border: none;
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    font-size: var(--tl-fs-caption);
    padding: 5px 12px;
    border-radius: var(--tl-radius-pill);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .reveal:hover { background: var(--tl-primary); color: var(--tl-text-inverse); }
  .ans { display: none; color: var(--tl-success-text); font-weight: var(--tl-fw-bold); font-size: 14.5px; }
  .ans.show { display: inline; }

  /* True/false */
  .tf {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 10px 13px;
    margin-bottom: 6px;
    font-size: var(--tl-fs-body);
  }
  .tf .s { flex: 1; }
  .tf .pick { display: flex; gap: 6px; }
  .tf .pick button {
    border: 1px solid var(--tl-border);
    background: var(--tl-surface);
    border-radius: var(--tl-radius-sm);
    padding: 5px 13px;
    font-weight: var(--tl-fw-bold);
    font-size: 13px;
    cursor: pointer;
    color: var(--tl-text-secondary);
  }
  .tf .pick button.on-t { background: var(--tl-success); border-color: var(--tl-success); color: var(--tl-text-inverse); }
  .tf .pick button.on-f { background: var(--tl-danger); border-color: var(--tl-danger); color: var(--tl-text-inverse); }
  .tf .mark { font-weight: var(--tl-fw-bold); font-size: var(--tl-fs-body); width: 20px; text-align: center; }

  /* Speaking */
  .speak {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-md);
    padding: 15px 17px;
  }
  .speak .q {
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .32);
    border-radius: var(--tl-radius-sm);
    padding: 9px 13px;
    font-size: 14.5px;
    margin-bottom: 7px;
  }
  .speak .q:last-child { margin-bottom: 0; }

  .hint { font-size: 13px; color: var(--tl-text-tertiary); }

  @media print {
    .topbar, .filters, .reveal, .btn, .no-print { display: none !important; }
    .transcript { display: block !important; }
    .ans { display: inline !important; }
    .card { box-shadow: none; border-color: var(--tl-border); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topwrap">
    <div class="row">
      <div>
        <h1>🎧 Listening Lab</h1>
        <p style="opacity:.9;font-size:14px">Micro listenings — pick any image of the same theme, the audio does the rest</p>
      </div>
      <a href="index.html" class="menu-btn"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- FILTROS -->
  <div class="card no-print">
    <div class="filters">
      <div>
        <label>Level</label>
        <select class="sel" id="fLevel"></select>
      </div>
      <div>
        <label>Theme</label>
        <select class="sel" id="fTheme"></select>
      </div>
      <div>
        <label>Listening</label>
        <select class="sel" id="fListening"></select>
      </div>
    </div>
    <p class="hint" style="margin-top:11px">Show any photo of the theme (Google, Canva, Pinterest, your own). The listening only works the context — it fits dozens of images of the same subject.</p>
  </div>

  <!-- LIÇÃO -->
  <div class="card" id="lessonCard"></div>

</div>

<div class="toast" id="toast"></div>

<script src="engine/listening-content.js?v=1"></script>
<script>
/* ================================================================
   Listening Lab — apresentação
   ----------------------------------------------------------------
   Esta página só RENDERIZA. Todo o conteúdo vive em
   engine/listening-content.js. Nenhuma regra de negócio aqui.
   Módulo isolado: não toca em Learning Progress, Calendar, Finance.
   ================================================================ */

const LEVELS   = window.LISTENING_LEVELS.slice();
const THEMES   = window.LISTENING_THEMES.slice();
const CONTENT  = window.LISTENING_CONTENT.slice();
const AUDIO_DIR = 'audio/';

let curLevel = LEVELS[0];
let curTheme = THEMES[0];
let curId    = null;

const esc  = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rich = t => esc(t).replace(/&lt;(\/?[bi])&gt;/g,'<$1>');

/** Listenings que batem com o nível e tema atuais. */
function matching(){
  return CONTENT.filter(l => l.level===curLevel && l.theme===curTheme);
}

function fillSelect(el, values, current){
  el.innerHTML = values.map(v=>{
    const val = typeof v==='object' ? v.value : v;
    const lab = typeof v==='object' ? v.label : v;
    return `<option value="${esc(val)}" ${val===current?'selected':''}>${esc(lab)}</option>`;
  }).join('');
}

function renderFilters(){
  fillSelect(document.getElementById('fLevel'), LEVELS, curLevel);
  fillSelect(document.getElementById('fTheme'), THEMES, curTheme);
  const list = matching();
  // se o listening atual não pertence ao filtro, escolhe o primeiro
  if(!list.some(l=>l.id===curId)) curId = list.length ? list[0].id : null;
  fillSelect(document.getElementById('fListening'),
    list.map(l=>({value:l.id, label:l.title})), curId);
  document.getElementById('fListening').disabled = !list.length;
}

/* ---------- as seções ---------- */
function section(n, title, body){
  return `<div class="sec"><h3><span class="n">${n}</span>${title}</h3>${body}</div>`;
}

function renderLesson(){
  const box = document.getElementById('lessonCard');
  const l = CONTENT.find(x=>x.id===curId);
  if(!l){ box.innerHTML = '<p class="hint">No listening for this level and theme yet.</p>'; return; }
  let n = 0;

  box.innerHTML =
    `<div class="lesson-head">
       <h2>${esc(l.title)}<span class="lvl">${esc(l.level)}</span></h2>
       <div class="meta"><span class="theme-badge">${esc(l.theme)}</span></div>
     </div>

     <!-- Preenchido por probeAudio(): o player só é criado se o MP3 existir.
          Sondamos com fetch HEAD — um 404 de fetch fica só na aba Network,
          nunca vira erro de console (ao contrário de um <source> quebrado). -->
     <div id="audioSlot"></div>

     <div class="sec no-print" style="margin-top:16px">
       <div class="transcript-actions">
         <button class="btn ghost" id="btnTranscript" onclick="toggleTranscript()">Show transcript</button>
         <button class="btn ghost" onclick="copyTranscript()">📋 Copy transcript for TTS</button>
       </div>
       <div class="transcript" id="transcript">${rich(l.transcript)}</div>
     </div>` +

    section(++n, 'Vocabulary',
      `<div class="vocab">${l.vocabulary.map(v=>
        `<div class="v"><b>${esc(v.word)}</b> — <span>${esc(v.meaning)}</span></div>`).join('')}</div>`) +

    section(++n, 'Comprehension',
      l.comprehension.map((c,i)=>`<div class="drill">
        <span class="num">${i+1}.</span><span class="q">${esc(c.q)}</span>
        <button class="reveal" onclick="this.nextElementSibling.classList.toggle('show')">answer</button>
        <span class="ans">${esc(c.a)}</span></div>`).join('')) +

    section(++n, 'Complete the sentence',
      l.complete.map((c,i)=>`<div class="drill">
        <span class="num">${i+1}.</span><span class="q">${esc(c.q)}</span>
        <button class="reveal" onclick="this.nextElementSibling.classList.toggle('show')">answer</button>
        <span class="ans">${esc(c.a)}</span></div>`).join('')) +

    section(++n, 'True or false',
      l.trueFalse.map((t,i)=>`<div class="tf">
        <span class="num">${i+1}.</span><span class="s">${esc(t.s)}</span>
        <span class="pick">
          <button onclick="answerTF(this,${t.a===true})">True</button>
          <button onclick="answerTF(this,${t.a===false})">False</button>
        </span>
        <span class="mark"></span></div>`).join('')) +

    section(++n, 'Speaking follow-up',
      `<div class="speak">${l.speaking.map(q=>`<div class="q">${esc(q)}</div>`).join('')}</div>`);

  // Decide o player DEPOIS de saber se o arquivo existe (sem 404 no console).
  probeAudio(l);
}

/* ---------- player condicional ---------- */
/**
 * Só cria o <audio> quando o MP3 existe de verdade.
 * Sonda com fetch HEAD: um 404 de fetch fica apenas na aba Network — não
 * gera erro de console como um <source> quebrado geraria. Quando o arquivo
 * for adicionado à pasta audio/, o player aparece sozinho no próximo render,
 * sem qualquer alteração de código.
 */
function probeAudio(l){
  const slot = document.getElementById('audioSlot');
  if(!slot) return;
  const url = AUDIO_DIR + l.audio;
  const token = curId;                 // evita corrida ao trocar de listening

  const notice =
    `<div class="player unavailable">
       <div class="lbl">🎧 Audio</div>
       <div class="na">Audio not available yet.</div>
     </div>`;
  const player =
    `<div class="player">
       <div class="lbl">▶ Audio · listen first</div>
       <audio controls preload="none">
         <source src="${esc(url)}" type="audio/mpeg">
       </audio>
     </div>`;

  // Ambiente sem fetch: degrada para o aviso, sem quebrar.
  if(typeof fetch !== 'function'){ slot.innerHTML = notice; return; }

  fetch(url, { method: 'HEAD' })
    .then(res => { if(curId===token) slot.innerHTML = res.ok ? player : notice; })
    .catch(() => { if(curId===token) slot.innerHTML = notice; });
}

/* ---------- microinterações ---------- */
function toggleTranscript(){
  const t = document.getElementById('transcript');
  const b = document.getElementById('btnTranscript');
  const showing = t.classList.toggle('show');
  b.textContent = showing ? 'Hide transcript' : 'Show transcript';
}

/** Copia o transcript puro (o texto que vai para o TTS) e avisa. */
function copyTranscript(){
  const l = CONTENT.find(x=>x.id===curId);
  if(!l) return;
  const text = l.transcript;   // texto cru, sem HTML — pronto para o TTS

  const done = ()=>toast('Transcript copied.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

/** Cópia via textarea temporária — funciona sem a Clipboard API. */
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ toast('Could not copy — select the transcript and copy manually.'); }
  document.body.removeChild(ta);
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

function answerTF(btn, correct){
  const wrap = btn.closest('.tf');
  wrap.querySelectorAll('.pick button').forEach(b=>b.classList.remove('on-t','on-f'));
  const isTrue = btn.textContent === 'True';
  btn.classList.add(isTrue ? 'on-t' : 'on-f');
  wrap.querySelector('.mark').textContent = correct ? '✓' : '✗';
  wrap.querySelector('.mark').style.color = correct ? '#22C55E' : '#DC2626';
}

/* ---------- eventos dos filtros ---------- */
document.getElementById('fLevel').addEventListener('change', e=>{ curLevel=e.target.value; renderFilters(); renderLesson(); });
document.getElementById('fTheme').addEventListener('change', e=>{ curTheme=e.target.value; renderFilters(); renderLesson(); });
document.getElementById('fListening').addEventListener('change', e=>{ curId=e.target.value; renderLesson(); });

renderFilters();
renderLesson();
</script>
</body>
</html>
