<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz — Class Games</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Class Games — overrides sobre o DS */

  /* Seletor de jogos dentro da topbar */
  .selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-top: 14px; }
  .g-btn {
    white-space: nowrap;
    padding: 9px 14px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    background: rgba(255, 255, 255, .14);
    color: var(--tl-text-inverse);
    border: 1px solid rgba(255, 255, 255, .28);
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .g-btn:hover { background: rgba(255, 255, 255, .24); }
  .g-btn.active { background: var(--tl-surface); color: var(--tl-primary); border-color: transparent; }

  h2.title {
    font-size: 30px;
    margin-bottom: 6px;
    color: var(--tl-primary);
    letter-spacing: var(--tl-tracking-tight);
  }
  .desc { color: var(--tl-text-secondary); margin-bottom: 20px; font-size: var(--tl-fs-body); }

  /* Chips (categorias/opções) */
  .chip {
    display: inline-block;
    padding: 7px 14px;
    border-radius: var(--tl-radius-pill);
    font-weight: var(--tl-fw-semibold);
    font-size: var(--tl-fs-small);
    background: var(--tl-primary-soft);
    color: var(--tl-primary);
    border: 1px solid transparent;
    margin: 4px;
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .chip.active { background: var(--tl-primary); color: var(--tl-text-inverse); }

  /* Palavra grande centralizada (hangman etc.) */
  .big {
    font-size: 52px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: .12em;
    text-align: center;
  }

  /* Teclado (hangman) */
  .key {
    width: 44px; height: 48px;
    border: none;
    border-radius: var(--tl-radius-sm);
    background: var(--tl-primary-tint);
    color: var(--tl-primary);
    font-weight: var(--tl-fw-semibold);
    font-size: 16px;
    cursor: pointer;
    margin: 3px;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .key:hover { background: var(--tl-primary); color: var(--tl-text-inverse); }
  .key:disabled { opacity: .35; cursor: not-allowed; }

  .blanks {
    font-size: 34px;
    font-weight: var(--tl-fw-bold);
    letter-spacing: .18em;
    text-align: center;
    color: var(--tl-primary);
    margin: 10px 0;
  }

  /* Feedback */
  .feedback { padding: 14px; border-radius: var(--tl-radius-md); font-weight: var(--tl-fw-semibold); margin-top: 14px; }
  .feedback.ok   { background: var(--tl-success-soft); color: var(--tl-success-text); }
  .feedback.no   { background: var(--tl-danger-soft);  color: var(--tl-danger-text); }
  .feedback.info { background: var(--tl-info-soft);    color: var(--tl-info-text); }
  .ok   { background: var(--tl-success-soft); color: var(--tl-success-text); }
  .no   { background: var(--tl-danger-soft);  color: var(--tl-danger-text); }
  .info { background: var(--tl-info-soft);    color: var(--tl-info-text); }

  .lives { font-size: 22px; text-align: center; color: var(--tl-accent); letter-spacing: .15em; }

  /* Categorias */
  .catrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  .catrow .w {
    flex: 1;
    font-weight: var(--tl-fw-semibold);
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 10px 14px;
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topwrap">
    <div class="row">
      <div>
        <h1>Class Games</h1>
        <p style="opacity:.9;font-size:14px">Eight games to energize conversation</p>
      </div>
      <a href="index.html" class="menu-btn"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</a>
    </div>
    <div class="selector" id="selector"></div>
  </div>
</div>

<div class="wrap"><div class="card" id="gameArea"></div></div>

<script src="engine/games-content.js?v=4"></script>
<script>
const GAMES=[
  {id:'hangman',label:'Hangman'},
  {id:'categories',label:'Categories (Stop)'},
  {id:'q20',label:'20 Questions'},
  {id:'odd',label:'Odd One Out'},
  {id:'sort',label:'Category Sort'},
  {id:'spelling',label:'Spelling Bee'},
  {id:'emoji',label:'Guess the Emoji'},
  {id:'chains',label:'Word Chains'}
];
let current='hangman';

function renderSelector(){
  document.getElementById('selector').innerHTML=GAMES.map(g=>`<button class="g-btn ${g.id===current?'active':''}" onclick="select('${g.id}')">${g.label}</button>`).join('');
}
function select(id){current=id;renderSelector();render();}
function speak(w){if(!('speechSynthesis'in window)){alert('Audio not supported');return;}const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function norm(s){return (s||'').toLowerCase().trim().replace(/[^a-z ]/g,'');}

/* ============ 1. HANGMAN ============ */
const HANG=GAMES_CONTENT.hangman;
let hCat='Animals',hWord='',hGuessed=[],hLives=6;
function hStart(cat){hCat=cat;hWord=GAMES_CONTENT.next('hangman:'+cat,HANG[cat]);hGuessed=[];hLives=6;render();}
function hGuess(l){if(hGuessed.includes(l))return;hGuessed.push(l);if(!hWord.includes(l))hLives--;render();}
function renderHangman(){
  const done=hWord && hWord.split('').every(c=>c===' '||hGuessed.includes(c));
  const lost=hLives<=0;
  let g=document.getElementById('gameArea');
  let cats=Object.keys(HANG).map(c=>`<span class="chip ${c===hCat?'active':''}" onclick="hStart('${c}')">${c}</span>`).join('');
  if(!hWord){g.innerHTML=`<h2 class="title">Hangman</h2><p class="desc">Pick a category and start guessing letters.</p><div>${cats}</div>`;return;}
  const blanks=hWord.split('').map(c=>c===' '?'&nbsp;&nbsp;':(hGuessed.includes(c)?c:'_')).join(' ');
  const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button class="key" onclick="hGuess('${l}')" ${hGuessed.includes(l)||done||lost?'disabled':''}>${l}</button>`).join('');
  let fb='';
  if(done)fb=`<div class="feedback ok">Well done! The word was <b>${hWord}</b>.</div>`;
  else if(lost)fb=`<div class="feedback no">Game over! The word was <b>${hWord}</b>.</div>`;
  g.innerHTML=`<h2 class="title">Hangman — ${hCat}</h2><div>${cats}</div>
    <div class="lives" style="margin-top:14px">${'♥ '.repeat(Math.max(0,hLives))}${'· '.repeat(6-Math.max(0,hLives))}</div>
    <div class="blanks">${blanks}</div>
    <div style="text-align:center;margin:14px 0">${keys}</div>${fb}
    <div style="text-align:center"><button class="btn purple" onclick="hStart('${hCat}')">New word</button></div>`;
}

/* ============ 2. CATEGORIES (STOP) ============ */
const CATS=GAMES_CONTENT.stop.map(w=>w.replace(/\b\w/g,c=>c.toUpperCase()));
const LETTERS='ABCDEFGHIJKLMNOPRSTW'.split('');
let cTimer=null,cTime=120;
function cNew(){const l=LETTERS[Math.floor(Math.random()*LETTERS.length)];document.getElementById('cLetter').textContent=l;cReset();}
function cReset(){clearInterval(cTimer);cTime=120;cUpd();}
function cStart(){clearInterval(cTimer);cTimer=setInterval(()=>{cTime--;cUpd();if(cTime<=0){clearInterval(cTimer);}},1000);}
function cUpd(){const m=Math.floor(cTime/60),s=cTime%60;const el=document.getElementById('cTime');if(el)el.textContent=`${m}:${String(s).padStart(2,'0')}`;}
function renderCategories(){
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Categories (Stop)</h2>
  <p class="desc">Draw a letter. Say one word for each category starting with that letter. First to finish shouts "Stop!".</p>
  <div class="big" id="cLetter" style="color:#0B3B46">?</div>
  <div style="text-align:center;font-size:28px;font-weight:800;color:#FF6B6B;margin:6px 0" id="cTime">2:00</div>
  <div style="text-align:center;margin:16px 0">
    <button class="btn pink" onclick="cNew()">Random letter</button>
    <button class="btn green" onclick="cStart()">Start timer</button>
    <button class="btn gray" onclick="cReset()">Reset</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${CATS.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`;
}

/* ============ 3. 20 QUESTIONS ============ */
const Q20=GAMES_CONTENT.q20;
let qWord='',qCount=0,qShow=false;
function qNew(){qWord=GAMES_CONTENT.next('q20',Q20);qCount=0;qShow=false;render();}
function qToggle(){qShow=!qShow;render();}
function qInc(){qCount++;render();}
function renderQ20(){
  if(!qWord){document.getElementById('gameArea').innerHTML=`<h2 class="title">20 Questions</h2><p class="desc">One player sees the secret word; the other asks up to 20 yes/no questions to guess it.</p><div style="text-align:center"><button class="btn cyan" onclick="qNew()">New secret word</button></div>`;return;}
  document.getElementById('gameArea').innerHTML=`<h2 class="title">20 Questions</h2>
  <p class="desc">One player looks at the word (hide it from the other!). The other asks yes/no questions.</p>
  <div style="text-align:center;margin:16px 0">
    <div class="big" style="color:#0B3B46">${qShow?qWord.toUpperCase():'• • • • •'}</div>
    <button class="btn amber" onclick="qToggle()">${qShow?'Hide':'Show word'}</button>
  </div>
  <div style="text-align:center;font-size:20px;font-weight:700;margin:10px 0">Questions used: <span style="color:#FF6B6B">${qCount}/20</span></div>
  <div style="text-align:center">
    <button class="btn purple" onclick="qInc()">+1 question</button>
    <button class="btn green" onclick="qNew()">New word</button>
  </div>`;
}

/* ============ 4. ODD ONE OUT ============ */
function gShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ODD=GAMES_CONTENT.odd;
let oAns=null,oCur=null;
function oNew(){
  const src=GAMES_CONTENT.next('odd',ODD), correct=src.w[src.odd];
  const w=gShuffle(src.w);                      // alternativas em ordem nova a cada rodada
  oCur={w:w, odd:w.indexOf(correct), reason:src.reason};
  oAns=null;render();
}
function oPick(i){oAns=i;render();}
function renderOdd(){
  if(!oCur){oNew();return;}
  const it=oCur;
  let opts=it.w.map((w,i)=>{let cls='opt';if(oAns!==null){if(i===it.odd)cls+=' right';else if(i===oAns)cls+=' wrong';}return `<button class="chip" style="font-size:16px;padding:12px 18px;${oAns!==null&&i===it.odd?'background:linear-gradient(135deg,#22C55E,#22C55E);color:#fff':''}${oAns!==null&&i===oAns&&i!==it.odd?'background:#FEE2E2;color:#991B1B':''}" onclick="oPick(${i})">${w}</button>`;}).join(' ');
  let fb=oAns!==null?`<div class="feedback ${oAns===it.odd?'ok':'no'}">${oAns===it.odd?'Correct! ':'No. '}<b>${it.w[it.odd]}</b> — ${it.reason}.</div>`:'';
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Odd One Out</h2><p class="desc">Which word does not belong? Say it out loud and explain why in English.</p>
  <div style="text-align:center;margin:16px 0">${opts}</div>${fb}
  <div style="text-align:center;margin-top:14px"><button class="btn cyan" onclick="oNew()">Next</button></div>`;
}

/* ============ 5. CATEGORY SORT ============ */
const SORT=GAMES_CONTENT.sort;
let sAns={},sCur=null;
function sNew(){
  const src=GAMES_CONTENT.next('sort',SORT), flip=Math.random()<0.5;
  sCur={title:src.title, a:flip?src.b:src.a, b:flip?src.a:src.b, items:gShuffle(src.items)};
  sAns={};render();
}
function sPick(i,v){if(sAns[i]!==undefined)return;sAns[i]=v;render();}
function renderSort(){
  const t=sCur||GAMES_CONTENT.sort[0];
  let rows=t.items.map((it,i)=>{
    const answered=sAns[i]!==undefined;
    const btn=(label)=>{
      let st='';
      if(answered){
        if(label===it[1])st='background:linear-gradient(135deg,#22C55E,#22C55E);color:#fff;border-color:transparent';
        else if(label===sAns[i])st='background:#FEE2E2;color:#991B1B;border-color:#EF4444';
        else st='opacity:.4';
      }
      return `<button class="chip" style="font-size:15px;padding:10px 16px;margin:0;${st}" ${answered?'disabled':''} onclick="sPick(${i},'${label}')">${label}</button>`;
    };
    return `<div class="catrow"><div class="w" style="font-size:17px">${it[0]}</div>
    <div style="display:flex;gap:8px">${btn(t.a)}${btn(t.b)}</div></div>`;
  }).join('');
  const done=Object.keys(sAns).length===t.items.length;
  let score='';if(done){let c=t.items.filter((it,i)=>sAns[i]===it[1]).length;score=`<div class="feedback info">Correct: <b>${c}/${t.items.length}</b></div>`;}
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Category Sort</h2><p class="desc"><b>${t.title}</b></p><p class="desc">Say the category for each word.</p>${rows}${score}
  <div style="text-align:center;margin-top:16px"><button class="btn cyan" onclick="sNew()">Another set</button></div>`;
}

/* ============ 6. SPELLING BEE ============ */
const SPELL=GAMES_CONTENT.spelling;
let spLevel='Easy',spWord='',spChecked=false,spVal='';
function spNew(lv){if(lv)spLevel=lv;spWord=GAMES_CONTENT.next('spell:'+spLevel,SPELL[spLevel]);spChecked=false;spVal='';render();setTimeout(()=>speak(spWord),200);}
function spCheck(){spVal=document.getElementById('spInp').value;spChecked=true;render();}
function renderSpelling(){
  let levels=Object.keys(SPELL).map(l=>`<span class="chip ${l===spLevel?'active':''}" onclick="spNew('${l}')">${l}</span>`).join('');
  if(!spWord){document.getElementById('gameArea').innerHTML=`<h2 class="title">Spelling Bee</h2><p class="desc">Listen to the word and spell it out loud, letter by letter. Choose a level to begin.</p><div>${levels}</div>`;return;}
  let fb='';if(spChecked){const ok=norm(spVal)===spWord;fb=`<div class="feedback ${ok?'ok':'no'}">${ok?'Perfect!':'The correct spelling is:'} <b>${spWord}</b></div>`;}
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Spelling Bee — ${spLevel}</h2><div>${levels}</div>
  <p class="desc" style="margin-top:14px">Listen to the audio and spell the word out loud:</p>
  <div style="text-align:center;margin-bottom:14px"><button class="btn amber" onclick="speak('${spWord}')">Hear again</button></div>
  <input class="inp" id="spInp" placeholder="Type here..." value="${spChecked?spVal:''}">
  <div style="text-align:center;margin-top:16px"><button class="btn green" onclick="spCheck()">Check</button> <button class="btn purple" onclick="spNew()">Next</button></div>${fb}`;
}

/* ============ 7. GUESS THE EMOJI ============ */
const EMO=GAMES_CONTENT.emoji;
let emCur=EMO[0],emState='';   // '' → 'shown' → 'right'/'wrong'
function emNew(){emCur=GAMES_CONTENT.next('emoji',EMO);emState='';render();}
function emShow(){emState='shown';render();}
function emJudge(ok){emState=ok?'right':'wrong';render();}
function renderEmoji(){
  const it=emCur;
  let area='';
  if(emState===''){
    area=`<div style="text-align:center"><button class="btn amber" onclick="emShow()">👁 Show answer</button></div>`;
  }else{
    area=`<div style="text-align:center;font-size:30px;font-weight:800;color:var(--tl-primary);margin:8px 0">${it.a[0]}</div>`;
    if(emState==='shown'){
      area+=`<div style="text-align:center;display:flex;gap:10px;justify-content:center">
        <button class="btn green" onclick="emJudge(true)">✓ Got it</button>
        <button class="btn gray" style="background:#FEE2E2;color:#991B1B" onclick="emJudge(false)">✗ Missed it</button></div>`;
    }else{
      area+=`<div class="feedback ${emState==='right'?'ok':'no'}" style="text-align:center">${emState==='right'?'Great job! 🎉':'Almost — practice this one again.'}</div>`;
    }
  }
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Guess the Emoji</h2><p class="desc">Say the English word for the emoji.</p>
  <div style="text-align:center;font-size:80px;margin:10px 0">${it.e}</div>
  ${area}
  <div style="text-align:center;margin-top:16px"><button class="btn pink" onclick="emNew()">Next</button></div>`;
}

/* ============ 8. WORD CHAINS ============ */
const STARTS=GAMES_CONTENT.chains;
let chChain=[],chMsg='';
function chNew(){chChain=[GAMES_CONTENT.next('chains',STARTS)];chMsg='';render();}
function chAdd(){
  const v=norm(document.getElementById('chInp').value);
  const last=chChain[chChain.length-1];
  const need=last[last.length-1];
  if(!v){return;}
  if(v[0]!==need){chMsg=`The word must start with "${need.toUpperCase()}".`;render();return;}
  if(chChain.includes(v)){chMsg='That word was already used!';render();return;}
  chChain.push(v);chMsg='';render();
}
function renderChains(){
  if(!chChain.length){document.getElementById('gameArea').innerHTML=`<h2 class="title">Word Chains</h2><p class="desc">Each word starts with the last letter of the previous one (cat → tiger → rabbit...). Say the next word to keep the chain going!</p><div style="text-align:center"><button class="btn purple" onclick="chNew()">Start</button></div>`;return;}
  const last=chChain[chChain.length-1];const need=last[last.length-1].toUpperCase();
  let chain=chChain.map((w,i)=>`<span class="chip" style="${i===chChain.length-1?'background:linear-gradient(135deg,#0B3B46,#FF6B6B);color:#fff':''}">${w}</span>`).join(' → ');
  let msg=chMsg?`<div class="feedback no">${chMsg}</div>`:'';
  document.getElementById('gameArea').innerHTML=`<h2 class="title">Word Chains</h2><p class="desc">Next word must start with <b style="color:#FF6B6B;font-size:20px">${need}</b></p>
  <div style="margin:14px 0;line-height:2.2">${chain}</div>
  <input class="inp" id="chInp" placeholder="Next word..." onkeydown="if(event.key==='Enter')chAdd()">
  <div style="text-align:center;margin-top:16px"><button class="btn green" onclick="chAdd()">Add</button> <button class="btn gray" onclick="chNew()">Restart</button></div>${msg}`;
}

/* ============ ROUTER ============ */
function render(){
  ({hangman:renderHangman,categories:renderCategories,q20:renderQ20,odd:renderOdd,sort:renderSort,spelling:renderSpelling,emoji:renderEmoji,chains:renderChains})[current]();
}
renderSelector();render();
</script>
</body>
</html>
