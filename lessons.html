<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz - Conversation Lessons</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Learning Progress: registro compartilhado de conteúdos da plataforma -->
<script src="platform-students.js?v=1"></script>
<script src="platform-content.js?v=1"></script>
<script src="engine/conversation-lessons.js?v=1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Lessons — overrides do DS + integração com Tailwind (mesma base de grammar.html) */
  * { font-family: var(--tl-font-sans); }
  h1, h2, h3, h4 { font-family: var(--tl-font-sans); }
  body { background: var(--tl-bg) !important; color: var(--tl-text) !important; }

  /* Topbar unificada */
  .topbar {
    background: linear-gradient(120deg, var(--tl-primary) 0%, #0F5561 55%, var(--tl-secondary) 100%) !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
    color: var(--tl-text-inverse) !important;
    box-shadow: var(--tl-shadow-md);
  }
  .topbar h1, .topbar h2, .topbar h3, .topbar p, .topbar span { color: var(--tl-text-inverse) !important; }
  [onclick="goHome()"] {
    background: rgba(255,255,255,.14) !important;
    border: 1px solid rgba(255,255,255,.35) !important;
    color: var(--tl-text-inverse) !important;
    font-family: var(--tl-font-sans) !important;
    border-radius: var(--tl-radius-md);
    padding: var(--tl-space-2) var(--tl-space-4);
    font-weight: var(--tl-fw-semibold);
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  [onclick="goHome()"]:hover { background: rgba(255,255,255,.24) !important; }

  /* Tailwind text overrides para tema claro */
  .text-white       { color: var(--tl-text) !important; }
  .text-slate-300   { color: var(--tl-text-secondary) !important; }
  .text-slate-400   { color: var(--tl-text-secondary) !important; }
  .text-slate-200   { color: var(--tl-text) !important; }
  .text-slate-500,
  .text-slate-600   { color: var(--tl-text-tertiary) !important; }
  .text-indigo-100,
  .text-indigo-200,
  .text-indigo-400  { color: var(--tl-primary) !important; }
  .text-emerald-400,
  .text-emerald-300 { color: var(--tl-success) !important; }
  .text-red-300,
  .text-red-400     { color: var(--tl-danger) !important; }
  .text-amber-300   { color: var(--tl-warning) !important; }
  .text-pink-300    { color: var(--tl-accent) !important; }

  /* Gradientes uniformizados */
  .gradient-coral   { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-emerald { background: linear-gradient(135deg, var(--tl-secondary), var(--tl-success)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-indigo  { background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary)) !important; color: var(--tl-text-inverse) !important; }
  .gradient-amber   { background: linear-gradient(135deg, var(--tl-warning), #F59E0B) !important; color: var(--tl-warning-text) !important; }
  .gradient-pink    { background: linear-gradient(135deg, var(--tl-accent), var(--tl-accent-hover)) !important; color: var(--tl-text-inverse) !important; }

  /* Cards */
  .card {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    box-shadow: var(--tl-shadow-sm) !important;
    border-radius: var(--tl-radius-lg) !important;
    transition: box-shadow var(--tl-dur-base) var(--tl-ease), border-color var(--tl-dur-base) var(--tl-ease);
  }
  .card:hover { box-shadow: var(--tl-shadow-lg) !important; border-color: var(--tl-border-strong) !important; }
  .stage {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border);
    border-left: 5px solid var(--tl-primary);
    box-shadow: var(--tl-shadow-xs) !important;
    border-radius: var(--tl-radius-md);
    padding: 24px;
    margin-bottom: 18px;
  }

  /* CORREÇÃO DE CONTRASTE
     ---------------------------------------------------------------
     .stage passou a ter fundo claro (--tl-surface), mas o render
     ainda herda classes Tailwind do tema dark antigo (text-white,
     text-slate-300/400/500/600/700). Isso deixava headings de
     seção e explicações praticamente invisíveis sobre o fundo
     branco. Reancoramos essas classes ao Design System.
     Blocos com fundo escuro dentro de .stage recebem a classe
     .dark-box, que reverte para texto claro (--tl-text-inverse). */
  .text-white         { color: var(--tl-text) !important; }
  .text-slate-300     { color: var(--tl-text-secondary) !important; }
  .text-slate-400     { color: var(--tl-text-secondary) !important; }
  .text-slate-500     { color: var(--tl-text-secondary) !important; }
  .text-slate-600     { color: var(--tl-text) !important; }
  .text-slate-700     { color: var(--tl-text) !important; }

  .dark-box                          { color: var(--tl-text-inverse); }
  .dark-box .text-white              { color: var(--tl-text-inverse) !important; }
  .dark-box .text-slate-300          { color: rgba(255,255,255,.82) !important; }
  .dark-box .text-slate-400          { color: rgba(255,255,255,.75) !important; }
  .dark-box .text-slate-500          { color: rgba(255,255,255,.72) !important; }
  .dark-box .text-indigo-200         { color: var(--tl-secondary-tint) !important; }

  /* Cards de conteúdo */
  .q-item, .form-box, .ex-line, .vocab-card {
    background: var(--tl-surface-alt) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
    padding: 14px 16px;
    margin: 8px 0;
    font-size: var(--tl-fs-body);
    transition: border-color var(--tl-dur-fast) var(--tl-ease);
  }
  .q-item:hover { border-color: var(--tl-secondary) !important; }
  .vocab-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* Inputs */
  .inp {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .inp:focus { border-color: var(--tl-border-focus) !important; outline: none; box-shadow: var(--tl-shadow-focus); }
  .inp::placeholder, input::placeholder, textarea::placeholder { color: var(--tl-text-tertiary) !important; }

  /* Options */
  .opt {
    background: var(--tl-surface-alt) !important;
    border: 1.5px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .opt:hover { border-color: var(--tl-secondary) !important; }
  .opt.sel { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; color: var(--tl-text-inverse) !important; }
  .opt.right, .inp.right { background: var(--tl-success-soft) !important; border-color: var(--tl-success) !important; color: var(--tl-success-text) !important; }
  .opt.wrong, .inp.wrong { background: var(--tl-danger-soft) !important; border-color: var(--tl-danger) !important; color: var(--tl-danger-text) !important; }

  /* Chips / tags */
  .chip { background: var(--tl-primary-soft) !important; color: var(--tl-primary) !important; border: 1px solid transparent !important; padding: 6px 12px; border-radius: var(--tl-radius-pill); font-size: 13px; font-weight: var(--tl-fw-semibold); margin: 4px; display: inline-block; }
  .tag { color: var(--tl-primary) !important; }

  /* IPA + botão falar */
  .ipa { color: var(--tl-accent) !important; font-family: 'Times New Roman', serif; font-size: var(--tl-fs-body); }
  .speak-btn {
    background: var(--tl-secondary-soft) !important;
    color: var(--tl-secondary-hover) !important;
    border: none;
    width: 38px; height: 38px;
    border-radius: var(--tl-radius-sm);
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .speak-btn:hover { background: var(--tl-secondary) !important; color: var(--tl-text-inverse) !important; }

  /* Erros comuns */
  .mistake { background: var(--tl-danger-soft) !important; border: 1px solid transparent !important; color: var(--tl-text) !important; border-radius: var(--tl-radius-md); padding: 12px 14px; }

  /* Botões theme/week/tense */
  .theme-btn, .week-btn, .tense-btn {
    background: var(--tl-primary-tint) !important;
    color: var(--tl-primary) !important;
    white-space: nowrap;
    padding: 10px 16px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .theme-btn:hover, .week-btn:hover, .tense-btn:hover { border-color: var(--tl-primary) !important; }
  .theme-btn.active, .week-btn.active, .tense-btn.active {
    background: var(--tl-primary) !important;
    color: var(--tl-text-inverse) !important;
  }

  .q-item.flash {
    background: var(--tl-warning-soft) !important;
    border-color: var(--tl-warning) !important;
    color: var(--tl-warning-text) !important;
    box-shadow: 0 8px 22px rgba(245, 158, 11, .3) !important;
    transform: scale(1.02);
  }

  /* Respostas */
  .answer { display: none; margin-top: 8px; color: var(--tl-success-text) !important; font-weight: var(--tl-fw-semibold); }
  .answer.show { display: block; }
  .correct-note { color: var(--tl-success-text) !important; }

  /* Checkbox custom */
  .custom-checkbox { border-color: var(--tl-primary) !important; }
  .custom-checkbox.checked { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; }
  .custom-checkbox.checked::after { color: var(--tl-text-inverse) !important; }

  /* Progress */
  .progress-bar { background: var(--tl-primary-soft) !important; }
  .progress-fill { background: linear-gradient(90deg, var(--tl-primary), var(--tl-secondary)) !important; }

  /* Week cards */
  .week-card { background: var(--tl-surface) !important; }
  .week-card.completed { background: var(--tl-success-soft) !important; }
  .week-card:hover { background: var(--tl-surface-alt) !important; }

  /* Overrides Tailwind bg */
  .bg-slate-700, .bg-slate-800, .bg-slate-900 { background: var(--tl-surface-alt) !important; }
  .bg-slate-600 { background: var(--tl-primary-soft) !important; }
  .border-slate-600, .border-slate-700 { border-color: var(--tl-border) !important; }
  select.inp option { background: var(--tl-surface) !important; color: var(--tl-text) !important; }
</style>
</head>
<body>
<div class="min-h-screen">
  <!-- HEADER -->
  <div class="topbar text-white p-6 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">Conversation Lessons</h1>
          <p class="text-[#6B7280] text-sm">Ready content • Adult A1 • Speaking focus</p>
        </div>
        <button onclick="goHome()" class="bg-white text-indigo-600 font-bold py-2 px-4 rounded-lg hover:bg-indigo-50 text-sm"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</button>
      </div>
      <!-- WEEK SELECTOR -->
      <div class="flex gap-2 overflow-x-auto pb-1" id="weekSelector"></div>
    </div>
  </div>

  <!-- LESSON -->
  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <div id="lessonTitle" class="card rounded-xl p-6 mb-6"></div>
    <div id="stuBar" class="card rounded-xl p-4 mb-6"></div>
    <div id="lessonBody"></div>

    <div class="card rounded-xl p-6 mt-6 flex gap-3 flex-wrap">
      <button onclick="exportLesson()" class="gradient-emerald text-white font-bold py-3 px-6 rounded-lg">Download lesson PDF</button>
    </div>
    <div id="printArea" class="hidden"></div>
  </div>
</div>

<script src="platform-print.js?v=1"></script>
<script>
// ============ LESSON CONTENT (weeks 1-13) ============
/* Os dados das 52 semanas foram movidos para engine/conversation-lessons.js
   para que qualquer página os leia sem depender desta ter sido aberta.
   Este alias mantém todo o restante da página inalterado. */
const lessons = window.CONV_LESSONS;

// ============ RENDER ============
let current = 0;

function renderSelector(){
  const s = document.getElementById('weekSelector');
  const pilot = i => window.CONV_PLUS && CONV_PLUS[lessons[i].week];
  let h='';
  if(lessons.some((l,i)=>pilot(i))){
    h+=`<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--tl-primary);background:var(--tl-primary-soft);border:1px solid var(--tl-border);border-radius:8px;padding:6px 10px;white-space:nowrap">⚡ PILOTO — NOVO PADRÃO</span>`;
  }
  h+=lessons.map((l,i)=>{
    const on=i===current, p=pilot(i);
    const style=p
      ? `background:${on?'linear-gradient(135deg,var(--tl-primary),var(--tl-secondary))':'var(--tl-primary-tint)'} !important;color:${on?'var(--tl-text-inverse)':'var(--tl-primary)'} !important;border:2px solid ${on?'var(--tl-primary)':'var(--tl-border)'} !important;box-shadow:var(--tl-shadow-sm)`
      : '';
    return `<button class="week-btn ${on?'active':''}" style="${style}" onclick="selectWeek(${i})">${p?'⚡ ':''}S${l.week} · ${l.theme.split('—')[0].trim()}</button>`;
  }).join('');
  s.innerHTML=h;
}

function selectWeek(i){ current=i; renderSelector(); renderLesson(); window.scrollTo({top:0,behavior:'smooth'}); }

function speak(word){
  if(!('speechSynthesis' in window)){alert('Audio not supported in this browser');return;}
  const clean = word.replace(/\(.*?\)/g,'').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang='en-US'; u.rate=0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function randomQuestion(){
  const items = document.querySelectorAll('#speakingList .q-item');
  if(!items.length) return;
  items.forEach(it=>it.classList.remove('flash'));
  const pick = items[Math.floor(Math.random()*items.length)];
  pick.classList.add('flash');
  pick.scrollIntoView({behavior:'smooth',block:'center'});
}

function toggleAnswer(id){ document.getElementById(id).classList.toggle('show'); }

function renderLesson(){
  const l = lessons[current];
  const enriched = window.CONV_PLUS && CONV_PLUS[l.week];
  document.getElementById('lessonTitle').innerHTML = `
    <div class="flex items-center gap-3 mb-1">
      <span class="text-xs px-2 py-1 rounded font-bold" style="background:var(--tl-primary);color:var(--tl-text-inverse)">WEEK ${l.week}</span>
      <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">${l.level}</span>
      ${enriched?'<span class="text-xs px-2 py-1 rounded font-bold" style="background:linear-gradient(135deg,var(--tl-primary),var(--tl-secondary));color:var(--tl-text-inverse)">⚡ Conversation Live</span>':''}
    </div>
    <h2 class="text-2xl md:text-3xl font-bold text-white">${l.theme}</h2>
    <p class="text-slate-400 mt-1">Grammar: ${l.grammar} · 60 min</p>`;

  renderStuBar();
  if(enriched){ renderEnriched(l); return; }

  const body = document.getElementById('lessonBody');
  let h = '';

  // 1 WARM-UP
  h += stageBlock('#0EA5E9','1 · Welcome + Small Talk','5 min · warm up in English',
    l.warmup.map(q=>`<div class="q-item">${q}</div>`).join(''));

  // 2 REVIEW
  h += stageBlock('#22C55E','2 · Review','8 min · review the previous lesson',
    l.review.map(q=>`<div class="q-item">${q}</div>`).join(''));

  // 3 LEAD-IN
  h += stageBlock('#0B3B46','3 · Lead-in','5 min · introduce the topic',
    `<p class="text-slate-300 mb-3">${l.leadin.text}</p><div class="q-item">${l.leadin.q}</div>`);

  // 4 VOCABULARY
  h += stageBlock('#F59E0B','4 · Vocabulary','8 min · click ► to listen',
    `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">`+
    l.vocab.map(v=>`<div class="vocab-card">
        <div><div class="text-white font-bold">${v.en}</div>
        <div class="ipa">${v.ipa}</div>
        <div class="text-slate-400 text-sm">${v.pt}</div></div>
        <button class="speak-btn" onclick="speak('${v.en.replace(/'/g,"\\'")}')">►</button>
      </div>`).join('')+`</div>`);

  // 5 GRAMMAR
  h += stageBlock('#EF4444','5 · Grammar Focus','10 min · the structure',
    `<p class="text-slate-300 mb-3">${l.grammar.exp}</p>
     <div class="space-y-2">${l.grammar.ex.map(e=>`<div class="q-item" style="color:#FCA5A5">${e}</div>`).join('')}</div>`);

  // 6 CONTROLLED PRACTICE
  h += stageBlock('#FF6B6B','6 · Controlled Practice','8 min · practice with no pressure',
    l.practice.map((p,idx)=>{
      const id=`ans-${l.week}-${idx}`;
      return `<div class="q-item">
        <div class="flex items-center justify-between gap-3">
          <span>${idx+1}. ${p.q}</span>
          <button onclick="toggleAnswer('${id}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded flex-shrink-0">show answer</button>
        </div>
        <div id="${id}" class="answer">✓ ${p.a}</div>
      </div>`;
    }).join(''));

  // 7 SPEAKING (star)
  h += stageBlock('#16B1A9','7 · Speaking / Activate','12 min · time to SPEAK',
    `<div class="flex justify-between items-center mb-3 flex-wrap gap-2">
       <p class="text-slate-400 text-sm">Answer the questions.</p>
       <button onclick="randomQuestion()" class="gradient-amber text-white font-bold py-2 px-4 rounded-lg text-sm">Random question</button>
     </div>
     <div id="speakingList">${l.speaking.map(q=>`<div class="q-item">${q}</div>`).join('')}</div>
     <div class="mt-5 p-4 rounded-xl dark-box" style="background:linear-gradient(135deg,var(--tl-primary) 0%,var(--tl-primary-hover) 100%);border:1px solid var(--tl-secondary)">
       <p class="text-indigo-200 font-bold mb-2" style="color:var(--tl-secondary-tint)">${l.roleplay.title}</p>
       <p class="text-slate-300 text-sm mb-3">${l.roleplay.scenario}</p>
       ${l.roleplay.lines.map(line=>`<p class="text-white text-sm mb-1">${line}</p>`).join('')}
     </div>`);

  // 8 WRAP-UP
  h += stageBlock('#22C55E','8 · Wrap-up + Homework','4 min · consolidate',
    `<p class="text-slate-300 font-bold mb-2">Homework:</p>
     ${l.homework.tasks.map(t=>`<div class="q-item">${t}</div>`).join('')}
     <a href="${l.homework.link}" target="_blank" class="inline-block mt-3 gradient-coral text-white font-bold py-2 px-4 rounded-lg text-sm">Practice on Test-English →</a>`);

  body.innerHTML = h;
}

function stageBlock(color,title,sub,inner){
  return `<div class="stage" style="border-left-color:${color}">
    <div class="mb-4"><h3 class="text-xl font-bold text-white">${title}</h3>
    <p class="text-slate-400 text-sm">${sub}</p></div>${inner}</div>`;
}

// ============ PDF ============
function exportLesson(){
  const l = lessons[current];
  const pa = document.getElementById('printArea');
  let h = `<div style="font-family:Arial;color:#222;padding:30px;line-height:1.6">
    <h1 style="text-align:center;border-bottom:3px solid #0B3B46;padding-bottom:12px">Sabatovicz — Week ${l.week}: ${l.theme}</h1>
    <p style="text-align:center;color:#666">Level ${l.level} · Grammar: ${l.grammar} · 60 min</p>`;
  const sec=(t,c)=>`<h2 style="border-left:4px solid #0B3B46;padding-left:10px;margin-top:22px">${t}</h2>${c}`;
  h+=sec('1 · Welcome + Small Talk',l.warmup.map(q=>`<p>• ${q}</p>`).join(''));
  h+=sec('2 · Review',l.review.map(q=>`<p>• ${q}</p>`).join(''));
  h+=sec('3 · Lead-in',`<p>${l.leadin.text}</p><p><b>${l.leadin.q}</b></p>`);
  h+=sec('4 · Vocabulary',`<table style="width:100%;border-collapse:collapse">${l.vocab.map(v=>`<tr><td style="border:1px solid #ddd;padding:6px"><b>${v.en}</b></td><td style="border:1px solid #ddd;padding:6px">${v.ipa}</td><td style="border:1px solid #ddd;padding:6px">${v.pt}</td></tr>`).join('')}</table>`);
  h+=sec('5 · Grammar Focus',`<p>${l.grammar.exp.replace(/<b>/g,'').replace(/<\/b>/g,'')}</p>${l.grammar.ex.map(e=>`<p>• ${e}</p>`).join('')}`);
  h+=sec('6 · Controlled Practice',l.practice.map((p,i)=>`<p>${i+1}. ${p.q} <b>(${p.a})</b></p>`).join(''));
  h+=sec('7 · Speaking',l.speaking.map(q=>`<p>• ${q}</p>`).join('')+`<p style="margin-top:10px"><b>${l.roleplay.title}:</b> ${l.roleplay.scenario}</p>${l.roleplay.lines.map(x=>`<p style="margin-left:15px">${x}</p>`).join('')}`);
  h+=sec('8 · Wrap-up + Homework',l.homework.tasks.map(t=>`<p>${t}</p>`).join('')+`<p>Link: ${l.homework.link}</p>`);
  h+=`</div>`;
  pa.innerHTML=h;
  printDoc(document.getElementById('printArea').innerHTML,'Sabatovicz');
}

function printDoc(html,title){ TeacherLu.printDoc(html, title); }

function goHome(){ window.location.href='index.html'; }

/* ================================================================
   CONVERSATION LIVE — piloto SLF módulo 8 (semanas 1–3).
   Camada aditiva: só as semanas em CONV_PLUS usam o renderizador
   novo; as demais seguem no renderer legado acima, intactas.
   ================================================================ */
/* ---------- student store — fonte única: platform-students.js ----------
   O bloco DEFAULT_STUDENTS/loadStudents que existia aqui foi centralizado.
   Estes aliases mantêm o restante desta página inalterado. -------------- */
const STU_KEY = TeacherLu.Students.KEY;

let cpPr={}, cpEv={}, cpMiss=[], cpVocab={};
function judgeCpPr(i,ok){
  if(cpPr[i]!==undefined)return; cpPr[i]=ok;
  document.getElementById('cpy-'+i).style.opacity=ok?'1':'.35';
  document.getElementById('cpn-'+i).style.opacity=ok?'.35':'1';
  const l=lessons[current];
  if(!ok){logError('practice',l.practice[i].q,l.practice[i].a);cpMiss.push({q:l.practice[i].q,a:l.practice[i].a});}
  const n=Object.keys(cpPr).length,c=Object.values(cpPr).filter(Boolean).length;
  const el=document.getElementById('cpScore');if(el)el.textContent=`${c} correct / ${n} checked of ${l.practice.length} · gate: ≥80%`;
  if(n===l.practice.length){
    const pct=Math.round(c/n*100);
    document.getElementById('cpVerdict').innerHTML=pct>=80
      ?`<div class="mistake" style="background:var(--tl-success-soft) !important;border-color:var(--tl-success) !important;color:var(--tl-success-text) !important;font-weight:700">✅ ${pct}% — ready to really talk. Go to the conversation.</div>`
      :`<div class="mistake" style="font-weight:700">⚠ ${pct}% — revisit the pattern together first (misses saved to ${stuName()}'s review queue).</div>`;
  }
}
function judgeCpEv(i,ok){
  if(cpEv[i]!==undefined)return; cpEv[i]=ok;

/* validador de propagação: garante que uma semana nova só precisa de DADOS.
   Retorna a lista de campos faltando — a página avisa em vez de quebrar. */
function convMissing(cp){
  if(!cp)return['(sem dados para esta semana)'];
  const m=[],need=(c,n)=>{if(!c)m.push(n);};
  need(cp.discover&&cp.discover.examples&&cp.discover.examples.length>=1,'discover.examples');
  need(cp.discover&&cp.discover.qs&&cp.discover.qs.form&&cp.discover.qs.meaning,'discover.qs (form+meaning)');
  need(cp.discover&&cp.discover.hints&&cp.discover.hints.length>=3,'discover.hints (3)');
  need(cp.brTip,'brTip');
  need(cp.ladder&&['concrete','experience','opinion','hypothesis'].every(k=>Array.isArray(cp.ladder[k])),'ladder (4 níveis)');
  need(cp.teacherOpinion,'teacherOpinion');
  need(cp.reactions&&cp.reactions.length,'reactions');
  need(cp.canDoNow,'canDoNow');
  need(cp.convGoal,'convGoal');
  need(cp.studyTip,'studyTip');
  return m;
}

     </div>
     <div class="mt-4 p-4 rounded-xl" style="background:#F2F6F7;border:1px solid #E6EEF0">
       <p class="font-bold text-sm" style="color:#0B3B46">🔑 Target words (<b><span id="vUsed">0</span>/${l.vocab.length}</b>):</p>
       <div class="mt-2">${l.vocab.map((v,i)=>`<span id="vchip-${i}" class="chip" style="cursor:pointer" onclick="markVocab(${i})">${v.en}</span>`).join('')}</div>
     </div>
     <div class="mt-3"><span class="text-slate-500 text-xs font-bold">Useful words to react in the conversation:</span><br>${cp.reactions.map(r=>`<span class="chip">${r}</span>`).join('')}</div>
     <div class="mt-4 p-4 rounded-xl dark-box" style="background:linear-gradient(135deg,#0B3B46 0%,#0E4B58 100%);border:1px solid #0B3B46">
       <p class="text-indigo-200 font-bold mb-2">${l.roleplay.title}</p>
       <p class="text-slate-300 text-sm mb-3">${l.roleplay.scenario}</p>
       ${l.roleplay.lines.map(line=>`<p class="text-white text-sm mb-1">${line}</p>`).join('')}
     </div>`);

  // 6 EVIDENCE — 3 sinais de conversa real (SLF §8)
  h+=stageBlock('#0B3B46','6 · Evidence — signs of real conversation','2 min · mark what you saw',"<div class=''>"+
    [['Did '+stuName()+'’s turns get LONGER through the lesson?'],
     [stuName()+' started a topic or added something without being asked?'],
     [stuName()+' asked YOU a question back?']].map((t,i)=>`
      <div class="q-item" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span>${i+1}. ${t[0]}</span>
        <span style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="judgeCpEv(${i},true)" id="evy-${i}" class="text-xs px-3 py-1 rounded" style="background:#DCFCE7;color:#166534;font-weight:700;border:1px solid #22C55E">✓</button>
          <button onclick="judgeCpEv(${i},false)" id="evn-${i}" class="text-xs px-3 py-1 rounded" style="background:#FEE2E2;color:#991B1B;font-weight:700;border:1px solid #EF4444">✗</button>
        </span>
      </div>`).join('')+`<div id="evVerdict" style="margin-top:8px"></div></div>`);

  // 7 LESSON SUMMARY — desempenho + correções + sugestões de estudo
  h+=stageBlock('#22C55E','7 · Lesson summary','2 min · '+stuName()+'’s report for today',
    `<button onclick="buildDebrief()" class="gradient-emerald text-white font-bold py-3 px-6 rounded-lg">📋 Build ${stuName()}'s summary</button>
     <div id="cpDebrief" style="margin-top:12px"></div>`);

  body.innerHTML=h;
}

renderSelector();
renderLesson();

</script>
</body>
</html>
