<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz — Language Structures</title>
  <!-- Camada de nuvem: config -> supabase-js -> auth guard -> sync.
       Precisa vir ANTES de qualquer outro script: o guard decide sobre a
       sessao antes do primeiro pixel, e o engine de sync instala o
       interceptor de localStorage antes de qualquer store ler dado. -->
  <script src="platform-cloud-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="platform-auth.js"></script>
  <script src="platform-cloud.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Structures — padrões específicos desta tela sobre o DS */

  /* Seletor de categoria */
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  @media (max-width: 860px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 620px) { .cat-grid { grid-template-columns: 1fr 1fr; } }
  .cat {
    padding: 11px 9px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    background: var(--tl-surface-alt);
    color: var(--tl-primary);
    border: 1.5px solid var(--tl-border);
    transition: all var(--tl-dur-fast) var(--tl-ease);
    text-align: center;
    position: relative;
  }
  .cat:hover { border-color: var(--tl-secondary); }
  .cat.active { background: var(--tl-primary); color: var(--tl-text-inverse); border-color: var(--tl-primary); }
  .cat .ic { display: block; font-size: 19px; margin-bottom: 3px; }
  .cat .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: var(--tl-radius-pill); background: var(--tl-success); }
  .cat.active .dot { background: var(--tl-success-soft); }

  /* Cabeçalho da lição */
  .lesson-head { border-left: 5px solid var(--tl-primary); padding-left: 16px; margin-bottom: 6px; }
  .lesson-head h2 { font-size: 25px; color: var(--tl-primary); }
  .lesson-head .meta { color: var(--tl-text-secondary); font-size: var(--tl-fs-small); margin-top: 3px; }
  .lvl {
    display: inline-block;
    font-size: 10.5px;
    font-weight: var(--tl-fw-bold);
    background: var(--tl-secondary-soft);
    color: var(--tl-secondary-hover);
    border: 1px solid transparent;
    border-radius: var(--tl-radius-pill);
    padding: 3px 9px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .goal {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-md);
    padding: 14px 18px;
    margin: 14px 0 4px;
    font-size: var(--tl-fs-body);
  }
  .goal b { font-weight: var(--tl-fw-bold); }

  .sec { margin-top: 22px; }
  .sec > h3 {
    font-size: var(--tl-fs-small);
    font-weight: var(--tl-fw-bold);
    letter-spacing: var(--tl-tracking-wide);
    text-transform: uppercase;
    color: var(--tl-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--tl-primary-soft);
    margin-bottom: 13px;
  }
  .sec > h3 .n {
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    width: 21px; height: 21px;
    border-radius: var(--tl-radius-pill);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }

  .explain { font-size: 15.5px; line-height: var(--tl-lh-relaxed); color: var(--tl-text); }
  .points { list-style: none; margin-top: 12px; }
  .points li {
    background: var(--tl-surface-alt);
    border-left: 3px solid var(--tl-secondary);
    border-radius: 0 8px 8px 0;
    padding: 9px 13px;
    margin-bottom: 7px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .ex-group { margin-bottom: 14px; }
  .ex-group .use { font-size: 13px; font-weight: var(--tl-fw-bold); color: var(--tl-primary); margin-bottom: 6px; }
  .ex-line {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 9px 13px;
    margin-bottom: 5px;
    font-size: var(--tl-fs-body);
  }
  .ex-line b { color: var(--tl-primary); }

  .mistake {
    background: var(--tl-danger-soft);
    border: 1px solid transparent;
    border-radius: var(--tl-radius-md);
    padding: 12px 14px;
    margin-bottom: 9px;
  }
  .mistake .bad { color: var(--tl-danger-text); font-size: 14.5px; }
  .mistake .bad::before { content: '✗ '; font-weight: var(--tl-fw-bold); }
  .mistake .good { color: var(--tl-success-text); font-size: 14.5px; margin-top: 3px; }
  .mistake .good::before { content: '✓ '; font-weight: var(--tl-fw-bold); }
  .mistake .why { color: var(--tl-text-secondary); font-size: 12.5px; margin-top: 5px; font-style: italic; }

  .drill {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 11px 14px;
    margin-bottom: 7px;
    font-size: var(--tl-fs-body);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .drill .q { flex: 1; min-width: 200px; }
  .drill .num { font-weight: var(--tl-fw-bold); color: var(--tl-text-tertiary); font-size: var(--tl-fs-label); }
  .reveal {
    background: var(--tl-primary-soft);
    border: none;
    color: var(--tl-primary);
    font-weight: var(--tl-fw-bold);
    font-size: var(--tl-fs-caption);
    padding: 5px 12px;
    border-radius: var(--tl-radius-pill);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .reveal:hover { background: var(--tl-primary); color: var(--tl-text-inverse); }
  .ans { display: none; color: var(--tl-success-text); font-weight: var(--tl-fw-bold); font-size: 14.5px; }
  .ans.show { display: inline; }

  .speak {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-md);
    padding: 16px 18px;
    font-size: 15.5px;
    line-height: var(--tl-lh-relaxed);
  }
  .cues { margin-top: 11px; display: flex; flex-direction: column; gap: 6px; }
  .cue {
    background: rgba(255, 255, 255, .2);
    border: 1px solid rgba(255, 255, 255, .38);
    border-radius: var(--tl-radius-sm);
    padding: 8px 12px;
    font-size: var(--tl-fs-small);
  }

  .conv {
    background: var(--tl-surface-alt);
    border: 1px solid var(--tl-border);
    border-radius: var(--tl-radius-sm);
    padding: 11px 14px;
    margin-bottom: 6px;
    font-size: var(--tl-fs-body);
    display: flex;
    gap: 10px;
  }
  .conv .q-n { color: var(--tl-accent); font-weight: var(--tl-fw-bold); flex-shrink: 0; }

  .review {
    background: var(--tl-success-soft);
    border: 1px solid transparent;
    border-radius: var(--tl-radius-md);
    padding: 16px 18px;
  }
  .review ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
  .review li {
    background: var(--tl-surface);
    border: 1px solid var(--tl-success);
    border-radius: var(--tl-radius-pill);
    padding: 6px 13px;
    font-size: 13.5px;
    color: var(--tl-success-text);
  }
  .review .one { font-size: var(--tl-fs-body); color: var(--tl-success-text); font-weight: var(--tl-fw-semibold); font-style: italic; }

  .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .taught { font-size: 13px; color: var(--tl-success-text); font-weight: var(--tl-fw-bold); }
  .hint { font-size: 13px; color: var(--tl-text-tertiary); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(10px);
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-md);
    padding: 13px 20px;
    font-size: var(--tl-fs-small);
    font-weight: var(--tl-fw-semibold);
    box-shadow: var(--tl-shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: all var(--tl-dur-base) var(--tl-ease);
    z-index: var(--tl-z-toast);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media print {
    .topbar, .stu-grid, .cat-grid, .actions, .reveal, .no-print { display: none !important; }
    .ans { display: inline !important; }
    .card { box-shadow: none; border-color: var(--tl-border); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topwrap">
    <div class="row">
      <div>
        <h1>Language Structures</h1>
        <p style="opacity:.9;font-size:14px">Prepositions, articles, word order — the structures behind every sentence</p>
      </div>
      <a href="index.html" class="menu-btn"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- ALUNO -->
  <div class="card no-print">
    <div class="row" style="margin-bottom:10px">
      <h3 class="section-title">Class with</h3>
      <a href="students.html" style="font-size:13px;font-weight:700;color:#0B3B46;text-decoration:none"><i data-lucide="settings" class="tl-icon-sm"></i> Manage students</a>
    </div>
    <div class="stu-grid" id="stuGrid"></div>
  </div>

  <!-- CATEGORIA -->
  <div class="card no-print">
    <h3 class="section-title" style="margin-bottom:12px">Category</h3>
    <div class="cat-grid" id="catGrid"></div>
    <p class="hint" style="margin-top:11px">● marks what this student has already studied.</p>
  </div>

  <!-- LIÇÃO -->
  <div class="card" id="lessonCard"></div>

</div>

<div class="toast" id="toast"></div>

<script src="platform-students.js?v=1"></script>
<script src="platform-content.js?v=1"></script>
<script src="platform-progress.js?v=1"></script>
<script src="engine/structures-content.js?v=1"></script>
<script>
/* ================================================================
   Language Structures — apresentação
   ----------------------------------------------------------------
   Esta página só RENDERIZA. O conteúdo vive em
   engine/structures-content.js e o progresso em platform-progress.js.
   Nenhuma regra de negócio aqui.
   ================================================================ */

const STUDENTS_DATA = TeacherLu.Students.load();
const CATS   = window.STRUCTURES_CATEGORIES.slice().sort((a,b)=>a.order-b.order);
const TOPICS = window.STRUCTURES_TOPICS;

let student = STUDENTS_DATA.length ? STUDENTS_DATA[0].id : null;
let category = CATS[0].id;

const esc = t => String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/** Permite as tags <b> e <i> que o conteúdo usa para destacar a estrutura. */
const rich = t => esc(t).replace(/&lt;(\/?[bi])&gt;/g,'<$1>');

/** A lição de uma categoria (hoje uma por categoria; o schema aceita várias). */
function lessonOf(catId){
  return Object.keys(TOPICS).map(k=>TOPICS[k])
    .filter(t=>t.category===catId)
    .sort((a,b)=>(a.order||0)-(b.order||0))[0] || null;
}

/** Id do conteúdo no Learning Progress — mesmo formato do registro. */
const itemIdOf = topic => 'structures:' + topic.id;

function isTaught(topic){
  return student && TeacherLu.Progress.isCovered(student, itemIdOf(topic));
}

function renderStudents(){
  document.getElementById('stuGrid').innerHTML = STUDENTS_DATA.map(s=>
    `<button class="stu ${s.id===student?'active':''}" onclick="pickStudent('${s.id}')">${s.emoji?s.emoji+' ':''}${esc(s.name)}</button>`
  ).join('') || '<p class="hint">No students yet.</p>';
}
function pickStudent(id){ student=id; renderStudents(); renderCategories(); renderLesson(); }

function renderCategories(){
  document.getElementById('catGrid').innerHTML = CATS.map(c=>{
    const t = lessonOf(c.id);
    const done = t && isTaught(t);
    return `<button class="cat ${c.id===category?'active':''}" onclick="pickCategory('${c.id}')">
      ${done?'<span class="dot"></span>':''}
      <span class="ic">${c.icon}</span>${esc(c.label)}
    </button>`;
  }).join('');
}
function pickCategory(id){ category=id; renderCategories(); renderLesson(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- as 8 seções ---------- */
function section(n,title,body){
  return `<div class="sec"><h3><span class="n">${n}</span>${title}</h3>${body}</div>`;
}

function renderLesson(){
  const t = lessonOf(category);
  const box = document.getElementById('lessonCard');
  if(!t){ box.innerHTML='<p class="hint">No lesson for this category yet.</p>'; return; }

  const name = student ? TeacherLu.Students.nameOf(student) : 'the student';
  const P = s => rich(s).replace(/\{name\}/g, esc(name));
  let n = 0;

  box.innerHTML =
    `<div class="lesson-head">
       <h2>${esc(t.title)}<span class="lvl">${esc(t.level)}</span></h2>
       <div class="meta">${esc((CATS.find(c=>c.id===t.category)||{}).label)} · ${esc(t.short)}</div>
     </div>
     <div class="goal"><b>Goal:</b> ${P(t.goal)}</div>` +

    section(++n,'Explanation',
      `<p class="explain">${P(t.explain.text)}</p>
       <ul class="points">${t.explain.points.map(p=>`<li>${P(p)}</li>`).join('')}</ul>`) +

    section(++n,'Examples',
      t.examples.map(g=>`<div class="ex-group"><div class="use">${P(g.use)}</div>
        ${g.items.map(i=>`<div class="ex-line">${P(i)}</div>`).join('')}</div>`).join('')) +

    section(++n,'Common mistakes',
      t.mistakes.map(m=>`<div class="mistake">
        <div class="bad">${P(m.bad)}</div>
        <div class="good">${P(m.good)}</div>
        <div class="why">${P(m.why)}</div></div>`).join('')) +

    section(++n,'Exercises',
      t.exercises.map((e,i)=>`<div class="drill">
        <span class="num">${i+1}.</span><span class="q">${P(e.q)}</span>
        <button class="reveal" onclick="this.nextElementSibling.classList.toggle('show')">answer</button>
        <span class="ans">${P(e.a)}</span></div>`).join('')) +

    section(++n,'Speaking practice',
      `<div class="speak">${P(t.speaking.prompt)}
        <div class="cues">${t.speaking.cues.map(c=>`<div class="cue">${P(c)}</div>`).join('')}</div>
      </div>`) +

    section(++n,'Complete the sentence',
      t.complete.map((c,i)=>`<div class="drill">
        <span class="num">${i+1}.</span><span class="q">${P(c.q)}</span>
        <button class="reveal" onclick="this.nextElementSibling.classList.toggle('show')">idea</button>
        <span class="ans">${P(c.a)}</span></div>`).join('')) +

    section(++n,'Conversation questions',
      t.questions.map((q,i)=>`<div class="conv"><span class="q-n">${i+1}</span><span>${P(q)}</span></div>`).join('')) +

    section(++n,'Quick review',
      `<div class="review">
        <ul>${t.review.key.map(k=>`<li>${P(k)}</li>`).join('')}</ul>
        <div class="one">${P(t.review.oneLiner)}</div>
      </div>`) +

    `<div class="sec actions no-print" id="lessonActions"></div>`;

  renderActions(t);
}

/* ---------- registro no Learning Progress ---------- */
function renderActions(t){
  const el = document.getElementById('lessonActions');
  if(!student){ el.innerHTML='<span class="hint">Select a student to record this lesson.</span>'; return; }
  const done = isTaught(t);
  const entry = TeacherLu.Progress.entry(student, itemIdOf(t));
  el.innerHTML =
    `<button class="btn ${done?'green':'blue'}" onclick="markTaught()">
       ${done?'✓ Taught':'Mark as taught'}
     </button>
     <button class="btn gray sm" onclick="window.print()">⬇ PDF</button>
     ${done&&entry?`<span class="taught">recorded ${esc(entry.lastAt)}${entry.times>1?' · '+entry.times+'×':''}</span>`:''}
     ${done?`<button class="btn gray sm" onclick="markTaught()">undo</button>`:''}`;
}

function markTaught(){
  const t = lessonOf(category);
  if(!t || !student) return;
  const r = TeacherLu.Progress.toggle(student, itemIdOf(t));
  // F-2: se a gravação falhou, não confirma e recarrega o estado real.
  if(!r.ok){
    renderCategories(); renderActions(t);
    toast('Could not save — the browser storage may be full. Nothing was changed.');
    return;
  }
  renderCategories(); renderActions(t);
  toast(r.on
    ? 'Recorded in ' + TeacherLu.Students.nameOf(student) + '’s Learning Progress'
    : 'Removed from Learning Progress');
}

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

renderStudents(); renderCategories(); renderLesson();
</script>
</body>
</html>
