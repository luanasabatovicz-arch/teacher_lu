<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabatovicz - Grammar Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="engine/grammar-topics.js?v=4"></script>
<script src="engine/grammar-engine.js?v=4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Grammar — overrides do DS + integração com classes utilitárias do Tailwind */
  * { font-family: var(--tl-font-sans); }
  h1, h2, h3, h4 { font-family: var(--tl-font-sans); }
  body { background: var(--tl-bg) !important; color: var(--tl-text) !important; }

  /* Topbar — mesmo padrão do DS */
  .topbar {
    background: linear-gradient(120deg, var(--tl-primary) 0%, #0F5561 55%, var(--tl-secondary) 100%) !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
    color: var(--tl-text-inverse) !important;
    box-shadow: var(--tl-shadow-md);
  }
  .topbar h1, .topbar h2, .topbar h3, .topbar p, .topbar span { color: var(--tl-text-inverse) !important; }
  [onclick="goHome()"] {
    background: rgba(255,255,255,.14) !important;
    border: 1px solid rgba(255,255,255,.35) !important;
    color: var(--tl-text-inverse) !important;
    font-family: var(--tl-font-sans) !important;
    border-radius: var(--tl-radius-md);
    padding: var(--tl-space-2) var(--tl-space-4);
    font-weight: var(--tl-fw-semibold);
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  [onclick="goHome()"]:hover { background: rgba(255,255,255,.24) !important; }

  /* Sobrescrevendo cores utilitárias do Tailwind para o tema claro */
  .text-white         { color: var(--tl-text) !important; }
  .text-slate-300     { color: var(--tl-text-secondary) !important; }
  .text-slate-400     { color: var(--tl-text-secondary) !important; }
  .text-slate-200     { color: var(--tl-text) !important; }
  .text-slate-500,
  .text-slate-600     { color: var(--tl-text-tertiary) !important; }
  .text-indigo-100,
  .text-indigo-200,
  .text-indigo-400    { color: var(--tl-primary) !important; }
  .text-emerald-400,
  .text-emerald-300   { color: var(--tl-success) !important; }
  .text-red-300,
  .text-red-400       { color: var(--tl-danger) !important; }
  .text-amber-300     { color: var(--tl-warning) !important; }
  .text-pink-300      { color: var(--tl-accent) !important; }

  /* Gradientes: uniformizados com a paleta do DS */
  .gradient-coral    { background: linear-gradient(135deg, var(--tl-accent) 0%, var(--tl-accent-hover) 100%) !important; color: var(--tl-text-inverse) !important; }
  .gradient-emerald  { background: linear-gradient(135deg, var(--tl-secondary) 0%, var(--tl-success) 100%) !important; color: var(--tl-text-inverse) !important; }
  .gradient-indigo   { background: linear-gradient(135deg, var(--tl-primary) 0%, var(--tl-secondary) 100%) !important; color: var(--tl-text-inverse) !important; }
  .gradient-amber    { background: linear-gradient(135deg, var(--tl-warning) 0%, #F59E0B 100%) !important; color: var(--tl-warning-text) !important; }
  .gradient-pink     { background: linear-gradient(135deg, var(--tl-accent) 0%, var(--tl-accent-hover) 100%) !important; color: var(--tl-text-inverse) !important; }

  /* Cards e stages */
  .card {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    box-shadow: var(--tl-shadow-sm) !important;
    border-radius: var(--tl-radius-lg) !important;
    transition: box-shadow var(--tl-dur-base) var(--tl-ease), border-color var(--tl-dur-base) var(--tl-ease);
  }
  .card:hover {
    box-shadow: var(--tl-shadow-lg) !important;
    border-color: var(--tl-border-strong) !important;
  }
  .stage {
    border-left: 5px solid var(--tl-primary);
    border-radius: var(--tl-radius-md);
    padding: 22px;
    margin-bottom: 18px;
    background: var(--tl-surface) !important;
    box-shadow: var(--tl-shadow-xs) !important;
    border: 1px solid var(--tl-border);
    border-left-width: 5px;
  }

  /* Itens dentro dos cards */
  .q-item, .form-box, .ex-line, .vocab-card {
    background: var(--tl-surface-alt) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
  }
  .q-item:hover { border-color: var(--tl-secondary) !important; }
  .ex-line { border-radius: var(--tl-radius-md); padding: 12px 14px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .form-box { border-radius: var(--tl-radius-md); padding: 14px; margin: 8px 0; }
  .form-box .label { font-size: 11px; font-weight: var(--tl-fw-bold); text-transform: uppercase; letter-spacing: var(--tl-tracking-wide); margin-bottom: 6px; color: var(--tl-text-secondary); }

  /* Chips e tags */
  .chip {
    display: inline-block;
    background: var(--tl-primary-soft) !important;
    color: var(--tl-primary) !important;
    border: 1px solid transparent !important;
    padding: 6px 12px;
    border-radius: var(--tl-radius-pill);
    font-size: 13px;
    font-weight: var(--tl-fw-semibold);
    margin: 4px;
  }
  .tag { color: var(--tl-primary) !important; }

  /* Inputs */
  .inp {
    background: var(--tl-surface) !important;
    border: 1px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .inp:focus { border-color: var(--tl-border-focus) !important; outline: none; box-shadow: var(--tl-shadow-focus); }
  .inp::placeholder, input::placeholder, textarea::placeholder { color: var(--tl-text-tertiary) !important; }

  /* Opções (múltipla escolha) */
  .opt {
    background: var(--tl-surface-alt) !important;
    border: 1.5px solid var(--tl-border) !important;
    color: var(--tl-text) !important;
    border-radius: var(--tl-radius-md);
  }
  .opt:hover { border-color: var(--tl-secondary) !important; }
  .opt.sel { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; color: var(--tl-text-inverse) !important; }
  .opt.right, .inp.right { background: var(--tl-success-soft) !important; border-color: var(--tl-success) !important; color: var(--tl-success-text) !important; }
  .opt.wrong, .inp.wrong { background: var(--tl-danger-soft) !important; border-color: var(--tl-danger) !important; color: var(--tl-danger-text) !important; }

  /* Erros comuns */
  .mistake { background: var(--tl-danger-soft) !important; border: 1px solid transparent !important; color: var(--tl-text) !important; border-radius: var(--tl-radius-md); padding: 12px 14px; margin: 8px 0; }

  /* Botão "falar" (áudio) */
  .speak-btn {
    background: var(--tl-secondary-soft) !important;
    color: var(--tl-secondary-hover) !important;
    border: none;
    width: 36px; height: 36px;
    border-radius: var(--tl-radius-sm);
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .speak-btn:hover { background: var(--tl-secondary) !important; color: var(--tl-text-inverse) !important; }
  .ipa { color: var(--tl-accent) !important; }

  /* Respostas reveladas */
  .answer { display: none; margin-top: 8px; color: var(--tl-success-text) !important; font-weight: var(--tl-fw-semibold); }
  .answer.show { display: block; }
  .correct-note { color: var(--tl-success-text) !important; }

  /* Seletor de tempo verbal / tema / semana */
  .theme-btn, .week-btn, .tense-btn {
    background: var(--tl-primary-tint) !important;
    color: var(--tl-primary) !important;
    white-space: nowrap;
    padding: 9px 14px;
    border-radius: var(--tl-radius-md);
    font-weight: var(--tl-fw-semibold);
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .theme-btn:hover, .week-btn:hover, .tense-btn:hover { border-color: var(--tl-primary) !important; }
  .theme-btn.active, .week-btn.active, .tense-btn.active {
    background: var(--tl-primary) !important;
    color: var(--tl-text-inverse) !important;
  }

  /* Item em destaque (flash) */
  .q-item.flash {
    background: var(--tl-warning-soft) !important;
    border-color: var(--tl-warning) !important;
    color: var(--tl-warning-text) !important;
    box-shadow: 0 8px 22px rgba(245, 158, 11, .3) !important;
  }

  /* Checkbox customizada */
  .custom-checkbox { border-color: var(--tl-primary) !important; }
  .custom-checkbox.checked { background: var(--tl-primary) !important; border-color: var(--tl-primary) !important; }
  .custom-checkbox.checked::after { color: var(--tl-text-inverse) !important; }

  /* Barra de progresso */
  .progress-bar { background: var(--tl-primary-soft) !important; }
  .progress-fill { background: linear-gradient(90deg, var(--tl-primary), var(--tl-secondary)) !important; }

  /* Cards de semana */
  .week-card { background: var(--tl-surface) !important; }
  .week-card.completed { background: var(--tl-success-soft) !important; }
  .week-card:hover { background: var(--tl-surface-alt) !important; }

  /* Cores Tailwind que precisam ser sobrescritas */
  .bg-slate-700, .bg-slate-800, .bg-slate-900 { background: var(--tl-surface-alt) !important; }
  .bg-slate-600 { background: var(--tl-primary-soft) !important; }
  .border-slate-600, .border-slate-700 { border-color: var(--tl-border) !important; }
  select.inp option { background: var(--tl-surface) !important; color: var(--tl-text) !important; }

  .hide-rule { display: none; }
</style>
</head>
<body>
<div class="min-h-screen">

  <!-- HEADER — só o essencial: onde estou e para quem -->
  <div class="topbar text-white p-6 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">Grammar Practice</h1>
          <p class="text-[#6B7280] text-sm font-semibold" id="hdrSub">Pick a topic and practise</p>
        </div>
        <button onclick="goHome()" class=" font-bold py-2 px-4 rounded-lg hover:bg-gray-800 text-sm"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</button>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1" id="topicSelector"></div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto p-4 md:p-6">

    <!-- Aluno + tópico atual -->
    <div class="card rounded-xl p-4 mb-4 flex items-center justify-between flex-wrap gap-3">
      <div id="stuBar" class="flex items-center flex-wrap"></div>
      <p class="text-slate-400 text-sm" id="poolCount">—</p>
    </div>

    <!-- Filtros de formato -->
    <div class="flex gap-2 overflow-x-auto pb-1 mb-4" id="formatFilter"></div>

    <!-- Um exercício por vez -->
    <div id="gePractice"></div>

  </div>
</div>

<script src="platform-students.js?v=1"></script>
<script>
/* ===========================================================================
   GRAMMAR PRACTICE — página
   ---------------------------------------------------------------------------
   Student → Topic → um exercício por vez → veredicto → Next.

   A aula guiada em 10 etapas (Goal, Warm-up, Notice, CCQs, Rule, Watch out,
   Make it yours, Task, Exit Ticket), o mapa de etapas, os portões de 80% e o
   relógio por seção saíram da interface. A explicação acontece fora da
   plataforma; aqui só se pratica.

   O conteúdo continua inteiro em engine/grammar-topics.js — inclusive os
   campos que deixaram de ser renderizados.
   =========================================================================== */

/* ---------- tópicos: direto do banco, sem lista paralela ---------- */
const TOPICS = Object.keys(window.ENGINE_TOPICS||{}).map(k=>window.ENGINE_TOPICS[k]);
let current = TOPICS.length ? TOPICS[0].id : null;

/* ---------- aluno ---------- */
const STUDENTS_DATA = TeacherLu.Students.load();
let curStu = localStorage.getItem('sabatovicz_current_student');
if(!STUDENTS_DATA.some(s=>s.id===curStu)) curStu = STUDENTS_DATA.length ? STUDENTS_DATA[0].id : null;
function stuName(){ const s=STUDENTS_DATA.find(x=>x.id===curStu); return s?s.name:'the student'; }
function pickStu(id){
  curStu=id;
  localStorage.setItem('sabatovicz_current_student',id);
  renderStuBar();
}
function renderStuBar(){
  const el=document.getElementById('stuBar');
  if(!el) return;
  if(!STUDENTS_DATA.length){
    el.innerHTML='<span class="text-slate-400 text-sm">No students yet — add one in Students.</span>';
    return;
  }
  el.innerHTML='<span class="text-slate-400 text-sm font-bold" style="margin-right:8px">Student:</span>'+
    STUDENTS_DATA.map(s=>`<button onclick="pickStu('${s.id}')" class="theme-btn ${s.id===curStu?'active':''}" style="margin:2px">${s.emoji||''} ${s.name}</button>`).join('');
}

/* ---------- fila de erros — sem UI, igual ao que já existia ----------
   Um ✗ continua alimentando errq|<studentId>. É outro assunto (revisão),
   não aparece nesta tela. */
function logError(kind,q,a){
  if(!curStu) return;
  try{
    const k='errq|'+curStu;
    const arr=JSON.parse(localStorage.getItem(k)||'[]');
    const t=ENGINE_TOPICS[current];
    arr.push({m:'grammar',topic:t?t.short||t.name:'',kind,q:String(q),a:String(a),d:new Date().toISOString().slice(0,10)});
    localStorage.setItem(k,JSON.stringify(arr));
  }catch(e){}
}

/* ---------- tópicos ---------- */
function renderTopics(){
  document.getElementById('topicSelector').innerHTML =
    TOPICS.map(t=>`<button class="tense-btn ${t.id===current?'active':''}" onclick="pickTopic('${t.id}')">${t.short||t.name}</button>`).join('');
}
function pickTopic(id){
  current=id;
  renderTopics();
  GE.start(ENGINE_TOPICS[id],'gePractice');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- filtros de formato ---------- */
function renderFilters(state){
  const el=document.getElementById('formatFilter');
  if(!el) return;
  const c=state.counts||{};
  el.innerHTML = GE.FORMATS
    .filter(f=>f.id==='all' || c[f.id]>0)
    .map(f=>`<button class="theme-btn ${state.filter===f.id?'active':''}" onclick="GE.setFilter('${f.id}')">${f.label}</button>`).join('');
}

/* ---------- cabeçalho: chamado pelo runtime a cada render ---------- */
function onPracticeRender(state){
  const t=state.topic;
  document.getElementById('hdrSub').textContent = t ? (t.name+(t.level?' · '+t.level:'')) : '';
  document.getElementById('poolCount').textContent =
    state.shown + (state.shown===1?' exercise':' exercises');
  renderFilters(state);
}

function goHome(){ window.location.href='index.html'; }

/* ---------- init ---------- */
renderStuBar();
renderTopics();
if(current) GE.start(ENGINE_TOPICS[current],'gePractice');

/* ===========================================================================
   LEGADO — NÃO RENDERIZADO
   ---------------------------------------------------------------------------
   Este era o banco próprio desta página, usado quando um tópico ainda não
   existia no engine. Hoje os 18 tópicos têm equivalente em
   engine/grammar-topics.js, então nada aqui é lido. Preservado para não
   perder conteúdo; pode ser apagado depois do piloto.
   =========================================================================== */
const LEGACY_TENSES = [
{
  eid:"verb-to-be",
  name:"Verb to be — Present", short:"Verb to be", level:"A1",
  use:"We use the verb TO BE to say who we are, how we feel, where we are from, age, job and characteristics. It is the first verb in English.",
  form:{
    aff:["I <b>am</b> (I'm) a teacher.","You / We / They <b>are</b> ('re) happy.","He / She / It <b>is</b> ('s) from Brazil."],
    neg:["I <b>am not</b> (I'm not) tired.","You <b>aren't</b> ready.","He <b>isn't</b> at home."],
    q:["<b>Am</b> I right?","<b>Are</b> you a student?","<b>Is</b> she Brazilian?"]
  },
  examples:["I'm a teacher.","She is very happy today.","They are from Curitiba.","Are you tired?","He isn't at home right now."],
  signals:["name","age","origin","feelings","job","characteristics"],
  mistakes:["✗ I have 30 years → ✓ I <b>am</b> 30 years old","✗ She have happy → ✓ She <b>is</b> happy","✗ I am agree → ✓ I agree (agree doesn't use 'be')"],
  practice:[
    {q:"I ___ a student.",a:"am"},
    {q:"She ___ from Italy.",a:"is"},
    {q:"They ___ my friends.",a:"are"},
    {q:"___ you ready?",a:"Are"},
    {q:"He ___ (not) tired.",a:"isn't / is not"},
    {q:"We ___ 20 years old.",a:"are"}
  ],
  speaking:["Who are you?","How are you today?","Where are you from?","Are you a happy person?"]
},
{
  eid:"present-simple",
  name:"Present Simple", short:"Present Simple", level:"A1",
  use:"We use the Present Simple for routines, habits, facts and general truths — things that happen always or regularly.",
  form:{
    aff:["I / You / We / They + <b>verb</b>: I work.","He / She / It + <b>verb + s</b>: She work<b>s</b>."],
    neg:["I / You / We / They + <b>don't</b> + verb: I don't work.","He / She / It + <b>doesn't</b> + verb: He doesn't work."],
    q:["<b>Do</b> + I/you/we/they + verb? Do you work?","<b>Does</b> + he/she/it + verb? Does she work?"]
  },
  examples:["I work in Curitiba.","She likes coffee.","We don't watch TV in the morning.","Does he speak English?","The sun rises in the east."],
  signals:["every day","always","usually","often","sometimes","never","on Mondays","in the morning"],
  mistakes:["✗ He work → ✓ He work<b>s</b>","✗ She don't like → ✓ She <b>doesn't</b> like","✗ Do she work? → ✓ <b>Does</b> she work?","✗ I no like → ✓ I <b>don't</b> like"],
  practice:[
    {q:"She ___ (work) at a bank.",a:"works"},
    {q:"I ___ (not/like) coffee.",a:"don't like"},
    {q:"___ he ___ (speak) English?",a:"Does / speak"},
    {q:"They ___ (live) in Rio.",a:"live"},
    {q:"He ___ (go) to the gym on Sundays.",a:"goes"},
    {q:"We ___ (not/have) a car.",a:"don't have"}
  ],
  speaking:["What do you do every day?","What time do you wake up?","Do you like coffee?","What does your best friend do?"]
},
{
  eid:"present-continuous",
  name:"Present Continuous", short:"Present Continuous", level:"A1",
  use:"We use the Present Continuous for actions happening NOW, at the moment of speaking, or temporary / ongoing situations.",
  form:{
    aff:["am / is / are + <b>verb-ing</b>: I <b>am</b> study<b>ing</b>."],
    neg:["am / is / are + <b>not</b> + verb-ing: She <b>isn't</b> working."],
    q:["Am / Is / Are + subject + verb-ing? <b>Are</b> you listening?"]
  },
  examples:["I'm studying English now.","She is cooking dinner.","They aren't sleeping.","Are you listening to me?","Look! It's raining."],
  signals:["now","right now","at the moment","today","Look!","Listen!"],
  mistakes:["✗ I am study → ✓ I am study<b>ing</b>","✗ She studying → ✓ She <b>is</b> studying","✗ I working now → ✓ I <b>am</b> working now","run → run<b>ning</b> · make → mak<b>ing</b> (watch the spelling)"],
  practice:[
    {q:"I ___ (study) right now.",a:"am studying"},
    {q:"She ___ (cook) dinner.",a:"is cooking"},
    {q:"They ___ (not/work) today.",a:"aren't working"},
    {q:"___ you ___ (listen)?",a:"Are / listening"},
    {q:"Look! It ___ (rain).",a:"is raining"}
  ],
  speaking:["What are you doing right now?","Am I sitting or standing?","Are you learning English at the moment?"]
},
{
  eid:"present-simple-continuous",
  name:"Present Simple vs Continuous", short:"Simple vs Continuous", level:"A1+",
  use:"The big contrast: Present Simple = habit/routine/fact. Present Continuous = now/temporary. Knowing the difference is essential.",
  form:{
    aff:["<b>Simple</b> (habit): I usually work. He plays football.","<b>Continuous</b> (now): I'm working now. He is playing at the moment."],
    neg:["Simple: I don't work on Sundays.","Continuous: I'm not working now."],
    q:["Simple: Do you work every day?","Continuous: Are you working now?"]
  },
  examples:["I usually drink coffee, but right now I'm drinking tea.","She works in a shop, but today she is working from home.","We often play tennis, but we aren't playing today.","He speaks English, and right now he is speaking English!"],
  signals:["Simple: usually, every day, always, often","Continuous: now, right now, at the moment, today"],
  mistakes:["✗ I am going to the gym every day → ✓ I <b>go</b> to the gym every day","✗ Look! He plays → ✓ Look! He <b>is playing</b>"],
  practice:[
    {q:"I ___ (usually/drink) coffee.",a:"usually drink"},
    {q:"Right now she ___ (watch) TV.",a:"is watching"},
    {q:"He ___ (play) football every Sunday.",a:"plays"},
    {q:"Look! They ___ (run).",a:"are running"},
    {q:"We ___ (not/work) at the moment.",a:"aren't working"}
  ],
  speaking:["What do you usually do on weekends?","What are you doing this weekend?","Tell me one habit and one thing you're doing now."]
},
{
  eid:"past-to-be",
  name:"Verb to be — Past (was / were)", short:"Was / Were", level:"A1+",
  use:"We use was/were to talk about past states and situations: how something was, where you were, how you felt.",
  form:{
    aff:["I / He / She / It + <b>was</b>: I was tired.","You / We / They + <b>were</b>: They were happy."],
    neg:["<b>wasn't</b>: She wasn't at home.","<b>weren't</b>: We weren't ready."],
    q:["<b>Was</b> I / he / she...? Was it cold?","<b>Were</b> you / we / they...? Were you there?"]
  },
  examples:["I was tired yesterday.","They were at home.","She wasn't happy.","Were you at the party?","It was cold last night."],
  signals:["yesterday","last night","last week","in 2010","two days ago","when I was young"],
  mistakes:["✗ I were → ✓ I <b>was</b>","✗ They was → ✓ They <b>were</b>","✗ Was you? → ✓ <b>Were</b> you?"],
  practice:[
    {q:"I ___ at work yesterday.",a:"was"},
    {q:"They ___ tired.",a:"were"},
    {q:"She ___ (not) at home.",a:"wasn't"},
    {q:"___ you happy?",a:"Were"},
    {q:"It ___ cold last night.",a:"was"}
  ],
  speaking:["Where were you yesterday?","How were you last week?","Were you a happy child?"]
},
{
  eid:"past-simple",
  name:"Past Simple — Regular verbs", short:"Past Regular", level:"A1+",
  use:"We use the Past Simple for finished actions in the past. Regular verbs end in -ed.",
  form:{
    aff:["verb + <b>ed</b>: worked, played, lived. I worked yesterday."],
    neg:["<b>didn't</b> + base verb: I didn't work. (base, no -ed!)"],
    q:["<b>Did</b> + subject + base verb? Did you work?"]
  },
  examples:["I worked yesterday.","She played tennis.","We didn't watch the film.","Did you like it?","They lived in Rio."],
  signals:["yesterday","last week","...ago","in 2015","then"],
  mistakes:["✗ I didn't worked → ✓ I didn't <b>work</b> (base after didn't)","✗ Did you worked? → ✓ Did you <b>work</b>?","study → stud<b>ied</b> · stop → stop<b>ped</b>"],
  practice:[
    {q:"I ___ (work) yesterday.",a:"worked"},
    {q:"She ___ (not/like) the film.",a:"didn't like"},
    {q:"___ you ___ (play) football?",a:"Did / play"},
    {q:"They ___ (live) in Curitiba.",a:"lived"},
    {q:"He ___ (study) all night.",a:"studied"}
  ],
  speaking:["What did you do yesterday?","Where did you go last weekend?","Did you like your weekend?"]
},
{
  eid:"past-irregular",
  name:"Past Simple — Irregular verbs", short:"Past Irregular", level:"A1+",
  use:"Many common verbs do NOT follow the -ed rule. You need to memorize the irregular forms.",
  form:{
    aff:["irregular form: go → <b>went</b>, have → <b>had</b>, see → <b>saw</b>. I went home."],
    neg:["<b>didn't</b> + base: I didn't go. (back to the base!)"],
    q:["<b>Did</b> + subject + base? Did you go?"]
  },
  list:["go → went","have → had","do → did","make → made","see → saw","eat → ate","drink → drank","come → came","get → got","take → took","buy → bought","think → thought"],
  examples:["I went to the beach.","She had lunch at noon.","We saw a good movie.","Did you go out yesterday?","They didn't come to the party."],
  signals:["yesterday","last...","...ago"],
  mistakes:["✗ I goed → ✓ I <b>went</b>","✗ She eated → ✓ She <b>ate</b>","✗ Did you went? → ✓ Did you <b>go</b>?"],
  practice:[
    {q:"I ___ (go) to work.",a:"went"},
    {q:"She ___ (have) a coffee.",a:"had"},
    {q:"We ___ (see) our friends.",a:"saw"},
    {q:"___ you ___ (eat) lunch?",a:"Did / eat"},
    {q:"He ___ (not/come) to the party.",a:"didn't come"}
  ],
  speaking:["What did you eat yesterday?","Where did you go on your last holiday?","What did you buy recently?"]
},
{
  eid:"going-to",
  name:"Future — Going to", short:"Going to", level:"A2",
  use:"We use 'going to' for plans and intentions (things already decided) and for predictions with clear evidence.",
  form:{
    aff:["am / is / are + <b>going to</b> + verb: I'm going to travel."],
    neg:["am / is / are + <b>not</b> + going to + verb: We aren't going to work."],
    q:["Am / Is / Are + subject + going to + verb? Are you going to come?"]
  },
  examples:["I'm going to travel next month.","She is going to study medicine.","We aren't going to work tomorrow.","Are you going to come?","Look at the clouds — it's going to rain."],
  signals:["tomorrow","next week / month / year","tonight","soon"],
  mistakes:["✗ I going to travel → ✓ I'm going to travel (use the 'to be')","✗ I'm going to travelling → ✓ I'm going to <b>travel</b> (base)","✗ She go to study → ✓ She <b>is going to</b> study"],
  practice:[
    {q:"I ___ (going to/travel) next week.",a:"am going to travel"},
    {q:"She ___ (going to/study).",a:"is going to study"},
    {q:"They ___ (not/going to/come).",a:"aren't going to come"},
    {q:"___ you ___ (going to/help)?",a:"Are / going to help"},
    {q:"It ___ (going to/rain).",a:"is going to rain"}
  ],
  speaking:["What are you going to do this weekend?","What are your plans for next year?","Are you going to travel soon?"]
},
{
  eid:"will",
  name:"Future — Will", short:"Will", level:"A2",
  use:"We use 'will' for decisions at the moment of speaking, predictions, promises and offers to help.",
  form:{
    aff:["<b>will</b> + base verb: I'll help you. (will never changes)"],
    neg:["<b>won't</b> (will not) + verb: They won't come."],
    q:["<b>Will</b> + subject + verb? Will you be there?"]
  },
  examples:["I'll help you.","She will call you later.","They won't come.","Will you marry me?","I think it will rain tomorrow."],
  signals:["tomorrow","later","tonight","next...","I think","maybe","probably"],
  mistakes:["✗ I will to help → ✓ I will <b>help</b> (no 'to')","✗ She wills → ✓ She <b>will</b> (never changes)","✗ I will helping → ✓ I will <b>help</b> (base)"],
  practice:[
    {q:"I ___ (help) you.",a:"will help"},
    {q:"She ___ (call) you later.",a:"will call"},
    {q:"They ___ (not/come).",a:"won't come"},
    {q:"___ you ___ (be) there?",a:"Will / be"},
    {q:"I think it ___ (rain).",a:"will rain"}
  ],
  speaking:["What will you do tomorrow?","Do you think you'll travel this year?","Make a promise using 'will'."]
},
{
  eid:"present-perfect",
  name:"Present Perfect", short:"Present Perfect", level:"A2",
  use:"We use the Present Perfect for life experiences (without saying when), past actions with a result in the present, and actions that started in the past and continue. Do NOT use it with a specific time (yesterday, last week).",
  form:{
    aff:["have / has + <b>past participle</b>: I have seen. She has gone."],
    neg:["haven't / hasn't + past participle: We haven't finished."],
    q:["Have / Has + subject + past participle? Have you ever been to London?"]
  },
  examples:["I have visited Paris.","She has just arrived.","We haven't finished yet.","Have you ever eaten sushi?","He has lived here for five years."],
  signals:["ever","never","already","just","yet","since","for"],
  mistakes:["✗ I have visited Paris last year → ✓ I <b>visited</b> Paris last year (specific time = Past Simple)","✗ She has went → ✓ She has <b>gone</b> (past participle)","✗ I have ate → ✓ I have <b>eaten</b>"],
  practice:[
    {q:"I ___ (see) that film.",a:"have seen"},
    {q:"She ___ (just/arrive).",a:"has just arrived"},
    {q:"___ you ever ___ (be) to London?",a:"Have / been"},
    {q:"We ___ (not/finish) yet.",a:"haven't finished"},
    {q:"He ___ (live) here for years.",a:"has lived"}
  ],
  speaking:["Have you ever traveled abroad?","What countries have you visited?","Have you had breakfast today?"]
}
,
{
  eid:"can-could",
  name:"Can / Could", short:"Can / Could", level:"A1",
  use:"Can = present ability and requests/permission. Could = past ability and more polite requests.",
  form:{aff:["can / could + base verb: I <b>can</b> swim. She <b>could</b> read at four."],neg:["<b>can't</b> (cannot) / <b>couldn't</b>: I can't drive."],q:["<b>Can/Could</b> + subject + verb? Can you help me?"]},
  examples:["I can speak English.","She can't come today.","Could you open the window, please?","When I was young, I could run fast.","Can I use your phone?"],
  signals:["ability","permission","polite requests","could = past"],
  mistakes:["✗ I can to swim → ✓ I can swim (no 'to')","✗ She cans → ✓ She can (never changes)","✗ Do you can? → ✓ Can you?"],
  practice:[{q:"I ___ (ability) swim very well.",a:"can"},{q:"She ___ (negative) drive.",a:"can't"},{q:"___ you help me, please?",a:"Can / Could"},{q:"When I was 5, I ___ (past) already read.",a:"could"},{q:"___ I open the window?",a:"Can / Could"}],
  speaking:["What can you do well?","What can't you do?","Could you swim when you were a child?","Ask me something politely using 'could'."]
},
{
  eid:"comparatives",
  name:"Comparatives", short:"Comparatives", level:"A2",
  use:"Compare two things: say that one is bigger, better or more expensive than the other.",
  form:{aff:["Short: adj + <b>-er</b> + than: cheap<b>er</b> than, big<b>ger</b> than.","Long: <b>more</b> + adj + than: more expensive than."],neg:["<b>not as</b> + adj + <b>as</b>: not as tall as."],q:["Is A + comparativo + than B? Is it bigger than a cat?"]},
  examples:["My car is faster than yours.","This book is more interesting than that one.","She is taller than her brother.","Today is hotter than yesterday.","A plane is not as cheap as a bus."],
  signals:["than","-er (short)","more (long adj)","as...as","irregular: good→better, bad→worse"],
  mistakes:["✗ more bigger → ✓ bigger","✗ more cheaper → ✓ cheaper","✗ gooder → ✓ better","✗ taller that → ✓ taller than"],
  practice:[{q:"A car is ___ (fast) than a bike.",a:"faster"},{q:"This is ___ (expensive) than that. (long adj)",a:"more expensive"},{q:"Health is ___ (good) than money. (irregular)",a:"better"},{q:"She is ___ (tall) than me.",a:"taller"},{q:"Winter is ___ (cold) than summer.",a:"colder"}],
  speaking:["Compare your city with another city.","Who is taller, you or your best friend?","What is more important: money or time? Why?","Compare two foods you like."]
},
{
  eid:"superlatives",
  name:"Superlatives", short:"Superlatives", level:"A2",
  use:"Say that something is the top of the group: the biggest, the best, the most expensive.",
  form:{aff:["Short: <b>the</b> + adj + <b>-est</b>: the big<b>gest</b>, the cheap<b>est</b>.","Long: <b>the most</b> + adj: the most expensive."],neg:["<b>the least</b> + adj: the least expensive."],q:["What is <b>the</b> + superlativo? What's the biggest city?"]},
  examples:["Everest is the highest mountain.","This is the most expensive restaurant.","She is the best student.","It's the hottest day of the year.","He is the tallest in the family."],
  signals:["the ...-est (short)","the most (long adj)","of / in","irregular: good→best, bad→worst"],
  mistakes:["✗ the most tallest → ✓ the tallest","✗ the most biggest → ✓ the biggest","✗ the goodest → ✓ the best","✗ the more expensive → ✓ the most expensive"],
  practice:[{q:"Everest is the ___ (high) mountain.",a:"highest"},{q:"This is the ___ (expensive) hotel. (long adj)",a:"most expensive"},{q:"She is the ___ (good) singer. (irregular)",a:"best"},{q:"It's the ___ (hot) day of the year.",a:"hottest"},{q:"He is the ___ (tall) player.",a:"tallest"}],
  speaking:["Who is the funniest person in your family?","What's the best film you've ever seen?","What's the most beautiful place in your country?","What's the most difficult thing about English?"]
},
{
  eid:"there-is-are",
  name:"There is / There are", short:"There is/are", level:"A1",
  use:"Say that something exists (or not) in a place.",
  form:{aff:["<b>There is</b> (singular): There is a book.","<b>There are</b> (plural): There are three books."],neg:["<b>There isn't / There aren't</b>: There aren't any chairs."],q:["<b>Is there...? Are there...?</b> Is there a bank near here?"]},
  examples:["There is a car in the garage.","There are many people here.","There isn't any milk.","Are there any questions?","There is a problem."],
  signals:["singular → is","plural → are","a/an (singular)","some/any (plural)"],
  mistakes:["✗ There is two cars → ✓ There are two cars","✗ There are a book → ✓ There is a book","✗ Have a book on the table → ✓ There is a book"],
  practice:[{q:"___ a cat on the sofa.",a:"There is"},{q:"___ five students in the room.",a:"There are"},{q:"There ___ (not) any bread.",a:"isn't"},{q:"___ there a bank near here?",a:"Is"},{q:"There ___ many cars in the street.",a:"are"}],
  speaking:["What is there in your bedroom?","How many people are there in your family?","Is there a park near your house?","What is there to do in your city?"]
},
{
  eid:"wh-questions",
  name:"Question Words (WH-)", short:"WH- Questions", level:"A1",
  use:"Ask open questions (not just yes/no): who, what, where, when, why, how.",
  form:{aff:["WH + auxiliar + sujeito + verb: <b>Where do you</b> live?"],neg:["(mesma estrutura) Why don't you like it?"],q:["What (the thing) · Who (person) · Where (place) · When (time) · Why (reason) · How (manner) · Which (choice) · Whose (owner)"]},
  examples:["What is your name?","Where do you live?","When does the class start?","Why are you late?","How do you go to work?"],
  signals:["What / Who / Where","When / Why / How","Which / Whose","How much / How many / How old"],
  mistakes:["✗ Where you live? → ✓ Where do you live?","✗ What means this? → ✓ What does this mean?","✗ How old you are? → ✓ How old are you?"],
  practice:[{q:"___ is your name? (what)",a:"What"},{q:"___ do you live? (where)",a:"Where"},{q:"___ are you sad? (why)",a:"Why"},{q:"___ do you go to work? (how)",a:"How"},{q:"___ is that man? (who)",a:"Who"}],
  speaking:["Ask me three questions with What, Where and When.","Where do you live and why do you like it?","How do you usually spend your weekend?","Who is the most important person in your life?"]
},
{
  eid:"countable-uncountable",
  name:"Countable & Uncountable", short:"Some / Any", level:"A2",
  use:"Countable nouns (apple, book) vs uncountable (water, rice). This changes the use of some/any and much/many.",
  form:{aff:["<b>some</b> (affirmative): I have some water / some apples."],neg:["<b>any</b> (negative/question): I don't have any money. Do you have any bread?"],q:["<b>much</b> (uncountable) / <b>many</b> (countable): How much water? How many apples?"]},
  examples:["There is some milk in the glass.","I don't have any money.","How many brothers do you have?","How much time do we have?","Would you like some coffee?"],
  signals:["some (+)","any (- / ?)","many + countable","much + uncountable","a lot of (both)"],
  mistakes:["✗ How many water → ✓ How much water","✗ I have any apples → ✓ I have some apples","✗ two rices → ✓ two bowls of rice"],
  practice:[{q:"I have ___ (affirmative) apples.",a:"some"},{q:"There isn't ___ (negative) milk.",a:"any"},{q:"How ___ money do you have? (uncountable)",a:"much"},{q:"How ___ books do you read? (countable)",a:"many"},{q:"Would you like ___ tea?",a:"some"}],
  speaking:["How much coffee do you drink a day?","How many languages do you speak?","Is there any food you don't eat?","What do you always have some of at home?"]
},
{
  eid:"should-must",
  name:"Should / Must / Have to", short:"Should / Must", level:"A2",
  use:"Give advice and talk about obligation. Should = advice. Must / have to = strong obligation. Mustn't = forbidden.",
  form:{aff:["<b>should / must</b> + base verb: You should rest. You must stop.","<b>have to</b>: I have to work. He <b>has to</b> study."],neg:["<b>shouldn't</b> (advice) · <b>don't have to</b> (not necessary) · <b>mustn't</b> (forbidden)"],q:["Should I...? Do I have to...? Should I call her?"]},
  examples:["You should see a doctor.","I have to work tomorrow.","You mustn't smoke here.","She has to study for the test.","You don't have to come if you're tired."],
  signals:["should = advice","must / have to = obligation","mustn't = forbidden","don't have to = not necessary"],
  mistakes:["✗ You should to rest → ✓ You should rest","✗ I must to go → ✓ I must go","✗ He have to work → ✓ He has to work"],
  practice:[{q:"You ___ (advice) drink more water.",a:"should"},{q:"I ___ (obligation) work on Saturday.",a:"have to"},{q:"He ___ (obligation, he) study.",a:"has to"},{q:"You ___ (forbidden) park here.",a:"mustn't"},{q:"You ___ (not necessary) pay; it's free.",a:"don't have to"}],
  speaking:["What should a tourist do in your city?","What do you have to do every day?","Give me advice for learning English.","What must you never do while driving?"]
},
{
  eid:"first-conditional",
  name:"First Conditional", short:"First Conditional", level:"B1",
  use:"Talk about real/possible situations in the future and their consequences: if X happens, then Y.",
  form:{aff:["<b>If</b> + present simple, ... <b>will</b> + verb: If it rains, I will stay home."],neg:["If + present simple, ... <b>won't</b>: If you don't hurry, you won't catch the bus."],q:["What will you do <b>if</b>...? What will you do if it rains?"]},
  examples:["If I have time, I will call you.","If it rains, we will stay home.","She will pass if she studies.","If you don't eat, you will be hungry.","What will you do if he says no?"],
  signals:["if","will / won't","when","unless (= if not)","real/possible situation"],
  mistakes:["✗ If it will rain, I will stay → ✓ If it rains, I will stay","✗ If I will have time → ✓ If I have time","✗ I will help you if you will ask → ✓ ...if you ask"],
  practice:[{q:"If it ___ (rain), we will stay home.",a:"rains"},{q:"If you study, you ___ (pass).",a:"will pass"},{q:"I ___ (call) you if I have time.",a:"will call"},{q:"If you don't hurry, you ___ (not/catch) the bus.",a:"won't catch"},{q:"What will you do if he ___ (say) no?",a:"says"}],
  speaking:["What will you do if it rains this weekend?","If you have a holiday next month, where will you go?","If you win some money, what will you buy?","Finish: 'If I study English every day, ...'"]
}
];
