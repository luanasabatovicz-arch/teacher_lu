<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendriks Nederlands</title>
  <!-- Camada de nuvem: config -> supabase-js -> auth guard -> sync.
       Precisa vir ANTES de qualquer outro script: o guard decide sobre a
       sessao antes do primeiro pixel, e o engine de sync instala o
       interceptor de localStorage antes de qualquer store ler dado. -->
  <script src="platform-cloud-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="platform-auth.js"></script>
  <script src="platform-cloud.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/theme.css">
<script src="design-system/icons.js" defer></script>
<style>
  /* Hendrik — versão "kids" do DS.
     Mantém Baloo 2 para títulos e cartões (necessário para leitura infantil)
     mas usa a paleta oficial. Cores warm ficam nos states (verde=acerto,
     coral=erro). O sombreado 3D é preservado como marca visual. */

  h1, h2, h3 { font-family: 'Baloo 2', cursive; }
  body { color: var(--tl-text); }

  /* Topbar — usa o mesmo gradiente do DS (unifica com resto da plataforma) */
  .topbar {
    background: linear-gradient(120deg, var(--tl-primary), #0F5561 55%, var(--tl-secondary));
    color: var(--tl-text-inverse);
    padding: var(--tl-space-5) var(--tl-space-5);
    position: sticky;
    top: 0;
    z-index: var(--tl-z-sticky);
    box-shadow: var(--tl-shadow-md);
  }
  .topwrap {
    max-width: var(--tl-container-sm);
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hi { font-size: 24px; font-weight: 800; font-family: 'Baloo 2'; color: var(--tl-text-inverse); }
  .stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill {
    background: rgba(255, 255, 255, .18);
    border: 1.5px solid rgba(255, 255, 255, .4);
    border-radius: var(--tl-radius-pill);
    padding: 6px 14px;
    font-weight: var(--tl-fw-bold);
    font-size: var(--tl-fs-body);
    color: var(--tl-text-inverse);
  }
  .menu-btn {
    background: rgba(255, 255, 255, .14);
    border: 1.5px solid rgba(255, 255, 255, .4);
    color: var(--tl-text-inverse);
    font-weight: var(--tl-fw-bold);
    padding: 6px 14px;
    border-radius: var(--tl-radius-pill);
    cursor: pointer;
    text-decoration: none;
    font-size: var(--tl-fs-small);
  }
  .xpbar {
    max-width: var(--tl-container-sm);
    margin: 10px auto 0;
    height: 12px;
    background: rgba(255, 255, 255, .28);
    border-radius: var(--tl-radius-pill);
    overflow: hidden;
  }
  .xpfill {
    height: 100%;
    background: linear-gradient(90deg, var(--tl-warning), var(--tl-secondary));
    border-radius: var(--tl-radius-pill);
    transition: width .5s;
  }

  .wrap { max-width: var(--tl-container-sm); margin: 0 auto; padding: var(--tl-space-5) var(--tl-space-5) var(--tl-space-8); }

  /* Cards de lição — mantém o efeito 3D "chunky" para criança */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .lcard {
    background: var(--tl-surface);
    border: 3px solid var(--tl-secondary-soft);
    border-radius: var(--tl-radius-2xl);
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: all var(--tl-dur-base) var(--tl-ease);
    box-shadow: 0 6px 0 var(--tl-primary-soft);
  }
  .lcard:hover { transform: translateY(-4px); box-shadow: 0 10px 0 var(--tl-primary-soft); }
  .lcard .em { font-size: 52px; line-height: 1; }
  .lcard .nm { font-family: 'Baloo 2'; font-size: 19px; font-weight: 800; margin-top: 6px; color: var(--tl-primary); }
  .lcard .st { font-size: var(--tl-fs-body); margin-top: 4px; letter-spacing: 2px; }
  .lcard.done { border-color: var(--tl-success); box-shadow: 0 6px 0 var(--tl-success-soft); background: var(--tl-success-soft); }

  /* Tabs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
  .tab {
    white-space: nowrap;
    background: var(--tl-surface);
    border: 2px solid var(--tl-secondary-soft);
    border-radius: var(--tl-radius-pill);
    padding: 9px 16px;
    font-weight: 800;
    font-size: var(--tl-fs-small);
    cursor: pointer;
    color: var(--tl-primary);
  }
  .tab.active { background: var(--tl-primary); color: var(--tl-text-inverse); border-color: transparent; }
  .tab.ok { border-color: var(--tl-success); color: var(--tl-success-text); }

  /* Painel — override do .panel do DS (que é display:none como tab-panel) */
  .panel {
    display: block;
    background: var(--tl-surface);
    border: 3px solid var(--tl-secondary-soft);
    border-radius: var(--tl-radius-2xl);
    padding: 22px;
    box-shadow: 0 6px 0 var(--tl-primary-soft);
  }
  .big-em { font-size: 110px; text-align: center; line-height: 1; margin: 6px 0 14px; }
  .word { font-family: 'Baloo 2'; font-size: 40px; font-weight: 800; text-align: center; color: var(--tl-primary); }
  .prompt { font-family: 'Baloo 2'; font-size: 24px; text-align: center; color: var(--tl-primary); margin-bottom: 10px; }

  /* Grid de palavras */
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .wcard {
    background: var(--tl-surface-alt);
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-lg);
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .wcard:hover { transform: scale(1.05); border-color: var(--tl-secondary); }
  .wcard .e { font-size: 46px; line-height: 1; }
  .wcard .w { font-family: 'Baloo 2'; font-size: 20px; font-weight: 800; color: var(--tl-primary); margin-top: 4px; }
  .wcard.heard { background: var(--tl-success-soft); border-color: var(--tl-success); }

  /* Opções */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .opt {
    background: var(--tl-surface-alt);
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-lg);
    padding: 16px;
    font-family: 'Baloo 2';
    font-size: 24px;
    font-weight: 800;
    color: var(--tl-primary);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .opt:hover { border-color: var(--tl-secondary); transform: scale(1.03); }
  .opt.right { background: var(--tl-success-soft); border-color: var(--tl-success); animation: pop .3s; }
  .opt.wrong { background: var(--tl-danger-soft);  border-color: var(--tl-danger); }
  .opt .oe { font-size: 44px; display: block; line-height: 1.1; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* Botões — alinhados ao Design System (mesmo padding/radius/shadow das demais páginas) */
  .btn.orange, .btn.warning { background: var(--tl-warning); color: var(--tl-warning-text); border-color: var(--tl-warning); }
  .btn.green, .btn.success  { background: var(--tl-success); color: var(--tl-text-inverse); border-color: var(--tl-success); }
  .btn.purple, .btn.primary { background: var(--tl-primary); color: var(--tl-text-inverse); border-color: var(--tl-primary); }
  .btn.gray                 { background: var(--tl-surface-alt); color: var(--tl-text-secondary); border-color: var(--tl-border); }

  /* Say row */
  .say-row {
    background: var(--tl-surface-alt);
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-lg);
    padding: 14px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .say-row .e { font-size: 44px; }
  .say-row .t { font-family: 'Baloo 2'; font-size: 22px; font-weight: 800; color: var(--tl-primary); flex: 1; }
  .say-row.ok { background: var(--tl-success-soft); border-color: var(--tl-success); }

  .feedback { text-align: center; font-family: 'Baloo 2'; font-size: 28px; font-weight: 800; margin-top: 14px; min-height: 38px; }
  .prog { text-align: center; color: var(--tl-text-secondary); font-weight: 800; margin-bottom: 8px; font-size: var(--tl-fs-body); }
  .center { text-align: center; }

  /* Exercícios */
  .ex-item {
    background: var(--tl-surface-alt);
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .ex-item.right { background: var(--tl-success-soft); border-color: var(--tl-success); }
  .ex-item.wrong { background: var(--tl-danger-soft);  border-color: var(--tl-danger); }
  .ex-tag { font-size: 11px; font-weight: 800; letter-spacing: var(--tl-tracking-wider); text-transform: uppercase; color: var(--tl-primary); }
  .ex-q { font-family: 'Baloo 2'; font-size: 22px; font-weight: 800; color: var(--tl-primary); margin: 4px 0 10px; }
  .nlhint {
    background: var(--tl-info-soft);
    border: 1.5px solid transparent;
    border-radius: var(--tl-radius-pill);
    padding: 3px 12px;
    font-weight: 800;
    color: var(--tl-info-text);
    font-size: var(--tl-fs-body);
    display: inline-block;
  }
  .ex-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ex-opt {
    background: var(--tl-surface);
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 12px;
    font-family: 'Baloo 2';
    font-size: 20px;
    font-weight: 800;
    color: var(--tl-primary);
    cursor: pointer;
    transition: all var(--tl-dur-fast) var(--tl-ease);
  }
  .ex-opt:hover { border-color: var(--tl-secondary); }
  .ex-opt.em { font-size: 40px; line-height: 1.2; padding: 10px; }  /* opções só com emoji */
  .ex-opt.sel { background: var(--tl-primary); border-color: var(--tl-primary); color: var(--tl-text-inverse); }
  .ex-opt.ok  { background: var(--tl-success-soft); border-color: var(--tl-success); color: var(--tl-success-text); }
  .ex-opt.no  { background: var(--tl-danger-soft);  border-color: var(--tl-danger);  color: var(--tl-danger-text); }

  .ex-inp {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    font-family: 'Baloo 2';
    font-size: 22px;
    font-weight: 800;
    color: var(--tl-primary);
    background: var(--tl-surface);
    text-align: center;
  }
  .ex-inp:focus { outline: none; border-color: var(--tl-border-focus); }
  .ex-inp.ok { border-color: var(--tl-success); background: var(--tl-success-soft); }
  .ex-inp.no { border-color: var(--tl-danger);  background: var(--tl-danger-soft); }

  .ex-sel {
    padding: 10px;
    border: 2px solid var(--tl-border);
    border-radius: var(--tl-radius-md);
    font-family: 'Baloo 2';
    font-size: 17px;
    font-weight: 800;
    color: var(--tl-primary);
    background: var(--tl-surface);
    cursor: pointer;
  }
  .ex-sel.ok { border-color: var(--tl-success); background: var(--tl-success-soft); }
  .ex-sel.no { border-color: var(--tl-danger);  background: var(--tl-danger-soft); }

  /* Unscramble — chips da frase */
  .sc-ans {
    min-height: 56px;
    background: var(--tl-surface);
    border: 2px dashed var(--tl-border);
    border-radius: var(--tl-radius-md);
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }
  .sc-ans.ok { border-color: var(--tl-success); background: var(--tl-success-soft); border-style: solid; }
  .sc-ans.no { border-color: var(--tl-danger);  background: var(--tl-danger-soft);  border-style: solid; }
  .sc-chip {
    background: var(--tl-primary);
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-pill);
    padding: 6px 14px;
    font-family: 'Baloo 2';
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
  }
  /* Botão de áudio dentro do exercício */
  .ex-say {
    background: var(--tl-warning);
    color: var(--tl-warning-text);
    border: none;
    border-radius: var(--tl-radius-pill);
    padding: 2px 10px;
    font-size: 17px;
    cursor: pointer;
    vertical-align: middle;
  }

  .mrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  .mrow .ml { flex: 1; font-family: 'Baloo 2'; font-size: 20px; font-weight: 800; color: var(--tl-primary); }
  .tf-row { display: flex; gap: 8px; }
  .tf-row .ex-opt { flex: 1; text-align: center; }

  .score-box {
    background: linear-gradient(135deg, var(--tl-primary), var(--tl-secondary));
    color: var(--tl-text-inverse);
    border-radius: var(--tl-radius-xl);
    padding: 20px;
    text-align: center;
    margin-bottom: 14px;
  }
  .score-box .sv { font-family: 'Baloo 2'; font-size: 44px; font-weight: 800; line-height: 1; }

  .hide { display: none; }
  .cel {
    position: fixed;
    inset: 0;
    background: var(--tl-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: var(--tl-z-modal);
    padding: 20px;
  }
  .cel.show { display: flex; }
  .celbox {
    background: var(--tl-surface);
    border-radius: 28px;
    padding: 34px;
    text-align: center;
    max-width: 380px;
    box-shadow: var(--tl-shadow-xl);
    animation: pop .4s;
  }
  .celbox .big { font-size: 72px; }
  .celbox h2 { font-size: 34px; color: var(--tl-primary); margin: 6px 0; }
  .celbox p { font-size: 19px; color: var(--tl-text-secondary); font-weight: 700; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topwrap">
    <div class="hi">🇳🇱 Hendriks Nederlands</div>
    <div class="stats">
      <span class="pill" id="pLevel">Niveau 1</span>
      <span class="pill" id="pStars">⭐ 0</span>
      <span class="pill" id="pXP">0 XP</span>
      <a href="index.html" class="menu-btn"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Menu</a>
    </div>
  </div>
  <div class="xpbar"><div class="xpfill" id="xpFill" style="width:0%"></div></div>
</div>

<div class="wrap">
  <!-- HOME -->
  <div id="home">
    <h2 style="font-size:var(--tl-fs-h1);color:var(--tl-primary);margin-bottom:var(--tl-space-1)">Kies een les! 🚀</h2>
    <p style="color:#6B7280;font-weight:700;margin-bottom:16px">Klik op een plaatje en speel!</p>
    <div class="grid" id="lessonGrid"></div>
    <div class="center" style="margin-top:24px">
      <button class="btn purple big" onclick="openEx()">📝 Oefenboek</button>
    </div>
    <div class="center" style="margin-top:22px">
      <button class="btn gray" onclick="resetAll()">Alles wissen</button>
    </div>
  </div>

  <!-- EXERCISES -->
  <div id="exView" class="hide">
    <button class="btn gray" style="margin-bottom:14px" onclick="goHome()"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Terug</button>
    <h2 style="font-size:var(--tl-fs-h1);color:var(--tl-primary);margin-bottom:var(--tl-space-1)">📝 Oefenboek</h2>
    <p style="color:#6B7280;font-weight:700;margin-bottom:14px">Kies een thema en doe de oefeningen!</p>
    <div class="tabs" id="exTabs"></div>
    <div id="exScore"></div>
    <div id="exBody"></div>
    <div class="center" style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn green big" onclick="checkEx()">✓ Kijk na</button>
      <button class="btn orange" onclick="buildEx(exTheme)">🔄 Nieuwe oefeningen</button>
      <button class="btn purple" onclick="exportEx()">📄 PDF</button>
    </div>
    <div id="exPrint" class="hide"></div>
  </div>

  <!-- LESSON -->
  <div id="lesson" class="hide">
    <button class="btn gray" style="margin-bottom:14px" onclick="goHome()"><i data-lucide="arrow-left" class="tl-icon-sm"></i> Terug</button>
    <h2 id="lTitle" style="font-size:var(--tl-fs-h1);color:var(--tl-primary);margin-bottom:var(--tl-space-3)"></h2>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="cel" id="cel" onclick="closeCel()">
  <div class="celbox">
    <div class="big" id="celEmoji">🎉</div>
    <h2 id="celTitle">Goed gedaan!</h2>
    <p id="celText"></p>
    <button class="btn green big" onclick="closeCel()">Joepie!</button>
  </div>
</div>

     Se o arquivo não carregar, o conteúdo original embutido abaixo
     continua funcionando como fallback. -->

/* ================= RANDOMIZAÇÃO (shuffle bag por tema+jogo) =================
   - não repete enquanto houver item não usado na rodada;
   - ao esvaziar, embaralha de novo;
   - o último item do ciclo anterior nunca abre o ciclo seguinte;
   - apenas em memória (sessão), sem histórico permanente.            */
const BAGS={};
function bagReset(key){ delete BAGS[key]; }
function bagDraw(key,pool,n){
  pool=pool||[];
  if(!pool.length)return [];
  const target=Math.min(n,pool.length);
  let b=BAGS[key];
  if(!b||b.size!==pool.length){ b={size:pool.length,queue:[],last:null}; BAGS[key]=b; }
  const out=[]; const used={}; let guard=0;
  while(out.length<target && guard++ < pool.length*4){
    if(!b.queue.length){
      // novo ciclo: embaralha tudo (nenhum item se perde) e joga para o fim
      // os que já saíram nesta rodada, para não repetirem agora
      const q=shuffle(pool.map((_,i)=>i));
      q.sort((a,c)=>(used[a]?1:0)-(used[c]?1:0)); // sort estável: mantém o embaralhamento
      // o último item do ciclo anterior nunca abre o ciclo seguinte
      if(b.last!==null && q.length>1 && q[0]===b.last && !used[q[1]]){
        const t=q[0]; q[0]=q[1]; q[1]=t;
      }
      b.queue=q;
    }
    const idx=b.queue.shift();
    b.last=idx;
    if(used[idx])continue;      // só acontece se o pool < n pedido
    used[idx]=1; out.push(pool[idx]);
  }
  return out;
}

/* Etiquetas por formato (só rótulo visual, não é "nível") */
const EX_TAGS={cloze:'Maak de zin af',qa:'Vraag en antwoord',sent:'Welke zin is goed?',
  odd:'Wat hoort er niet bij?',guess:'Raad het woord',scramble:'Maak de zin',
  make:'Zeg of schrijf zelf',tf:'Waar of niet waar'};

/* Converte um item do banco para um formato que o renderer já entende. */
function normItem(q){
  if(q.t==='cloze'||q.t==='qa'||q.t==='sent'||q.t==='odd'){
    return {t:'mc',tag:EX_TAGS[q.t],src:q.t,
      ask:q.ask||'Welke zin is goed?',correct:q.correct,opts:shuffle(q.opts),
      audio:q.audio||q.correct};
  }
  if(q.t==='guess')    return {t:'fill',tag:EX_TAGS.guess,src:'guess',ask:q.ask,correct:q.correct};
  if(q.t==='scramble') return {t:'scramble',tag:EX_TAGS.scramble,src:'scramble',
                               ask:'Zet de woorden in de goede volgorde:',
                               bag:shuffle(q.bag),correct:q.correct,audio:q.correct};
  if(q.t==='make')     return {t:'make',tag:EX_TAGS.make,src:'make',ask:q.ask,
                               example:q.example,audio:q.example};
  if(q.t==='tf')       return {t:'tf',tag:EX_TAGS.tf,src:'tf',ask:q.ask,
                               correct:q.correct,right:'',audio:q.ask};
  return Object.assign({},q);
}

function buildEx(id){
  exTheme=id; exAns={}; exChecked=false;
  const L=LESSONS.find(x=>x.id===id);
  const W=LWords(L);
  const pick=(not,n)=>shuffle(W.filter(x=>x.w!==not)).slice(0,n);
  exList=[];

  // A) 4x emoji -> Dutch word (4 options)
  bagDraw('ex:'+id+':mc',W,4).forEach(q=>{
    exList.push({t:'mc',e:q.e,ask:'Wat is dit?',correct:q.w,opts:shuffle([q,...pick(q.w,3)]).map(x=>x.w),audio:q.w});
  });
  // B) 2x Dutch word -> emoji (4 options)
  bagDraw('ex:'+id+':mce',W,2).forEach(q=>{
    exList.push({t:'mce',word:q.w,ask:'Waar is "'+q.w+'"?',correct:q.e,opts:shuffle([q,...pick(q.w,3)]).map(x=>x.e),audio:q.w});
  });
  // C) 2x type the word
  bagDraw('ex:'+id+':fill',W,2).forEach(q=>{
    exList.push({t:'fill',e:q.e,ask:'Schrijf het woord:',correct:q.w,audio:q.w});
  });
  // D) 2x true / false sobre o vocabulário
  bagDraw('ex:'+id+':tf',W,2).forEach(q=>{
    const lie=Math.random()<0.5;
    const other=pick(q.w,1)[0];
    const shown=(lie&&other)?other.w:q.w;
    exList.push({t:'tf',e:q.e,ask:'Is dit "'+shown+'"?',correct:!(lie&&other),right:q.w,audio:q.w});
  });
  // E) 9x do banco de frases/exercícios (camadas 2 a 5)
  bagDraw('ex:'+id+':items',LItems(L),9).forEach(q=>exList.push(normItem(q)));

  // mistura tudo (o "verbinden" fica sempre no fim, como antes)
  exList=shuffle(exList);

  // F) 1x matching emoji -> Dutch word
  const mp=bagDraw('ex:'+id+':match',W,5);
  if(mp.length>=2){
    exList.push({t:'match',ask:'Verbind het plaatje met het woord:',pairs:mp.map(x=>({nlw:x.w,e:x.e})),bag:shuffle(mp.map(x=>x.w))});
  }

  renderExTabs();
  document.getElementById('exScore').innerHTML='';
  renderEx();
  window.scrollTo({top:0,behavior:'smooth'});
}

function exSay(i){ const q=exList[i]; if(q&&q.audio)speak(q.audio); }

/* ---- Unscramble ---- */
function scRender(i){
  const q=exList[i], a=exAns[i]||[];
  const ans=document.getElementById('sc-'+i), bag=document.getElementById('scb-'+i);
  if(!ans||!bag)return;
  ans.innerHTML=a.length
    ? a.map((wi,k)=>`<span class="sc-chip" onclick="scDrop(${i},${k})">${q.bag[wi]}</span>`).join('')
    : '<span style="color:var(--tl-text-secondary);font-size:18px">...</span>';
  bag.innerHTML=q.bag.map((w,wi)=>
    `<button class="ex-opt"${a.indexOf(wi)>=0?' style="opacity:.3"':''} onclick="scPick(${i},${wi})">${w}</button>`).join('');
}
function scPick(i,wi){ if(exChecked)return; if(!exAns[i])exAns[i]=[]; if(exAns[i].indexOf(wi)<0)exAns[i].push(wi); scRender(i); }
function scDrop(i,k){ if(exChecked)return; if(exAns[i])exAns[i].splice(k,1); scRender(i); }
function scReset(i){ if(exChecked)return; exAns[i]=[]; scRender(i); }
function scText(i){ const q=exList[i],a=exAns[i]||[]; return a.map(wi=>q.bag[wi]).join(' '); }
function normSent(s){ return String(s||'').toLowerCase().replace(/[.?!,]/g,'').replace(/\s+/g,' ').trim(); }

function pickEx(i,v){
  if(exChecked)return;
  exAns[i]=v;
  const q=exList[i];
  if(q.t==='mc'||q.t==='mce')q.opts.forEach((o,oi)=>document.getElementById('eo-'+i+'-'+oi).classList.remove('sel'));
  if(q.t==='tf'){document.getElementById('et-'+i+'-yes').classList.remove('sel');document.getElementById('et-'+i+'-no').classList.remove('sel');}
  const id=q.t==='tf'?('et-'+i+'-'+(v?'yes':'no')):('eo-'+i+'-'+v);
  document.getElementById(id).classList.add('sel');
}

function checkEx(){
  exChecked=true;
  let correct=0,total=0;
  exList.forEach((q,i)=>{
    if(q.t==='mc'||q.t==='mce'){
      total++;
      const sel=exAns[i];
      q.opts.forEach((o,oi)=>{
        const el=document.getElementById('eo-'+i+'-'+oi);
        el.classList.remove('sel');
        if(o===q.correct)el.classList.add('ok');
        else if(oi===sel)el.classList.add('no');
      });
      if(sel!==undefined&&q.opts[sel]===q.correct)correct++;
      else document.getElementById('ei-'+i).classList.add('wrong');
    }
    if(q.t==='fill'){
      total++;
      const el=document.getElementById('ef-'+i);
      const v=(exAns[i]||'').toLowerCase().trim();
      if(v===q.correct){el.classList.add('ok');correct++;}
      else{el.classList.add('no');document.getElementById('eh-'+i).textContent='→ '+q.correct;}
    }
    if(q.t==='tf'){
      total++;
      const sel=exAns[i];
      const yes=document.getElementById('et-'+i+'-yes'),no=document.getElementById('et-'+i+'-no');
      yes.classList.remove('sel');no.classList.remove('sel');
      (q.correct?yes:no).classList.add('ok');
      if(sel!==undefined&&sel!==q.correct)(sel?yes:no).classList.add('no');
      if(sel===q.correct)correct++;
      else document.getElementById('ei-'+i).classList.add('wrong');
    }
    if(q.t==='scramble'){
      total++;
      const el=document.getElementById('sc-'+i);
      const ok=normSent(scText(i))===normSent(q.correct);
      if(ok){correct++;document.getElementById('ei-'+i).classList.add('right');if(el)el.classList.add('ok');}
      else{
        document.getElementById('ei-'+i).classList.add('wrong');
        if(el)el.classList.add('no');
        const h=document.getElementById('sch-'+i); if(h)h.textContent='→ '+q.correct;
      }
    }
    if(q.t==='make'){
      // produção livre: a juf kijkt. Não conta voor de score.
      const h=document.getElementById('emh-'+i);
      if(h)h.innerHTML='Bijvoorbeeld: <b style="color:var(--tl-success)">'+q.example+'</b>';
    }
    if(q.t==='match'){
      q.pairs.forEach((p,pi)=>{
        total++;
        const el=document.getElementById('ms-'+i+'-'+pi);
        const mk=document.getElementById('mm-'+i+'-'+pi);
        const v=exAns[i+'-'+pi];
        if(v===p.nlw){el.classList.add('ok');mk.textContent='✓';mk.style.color='#22C55E';correct++;}
        else{el.classList.add('no');mk.textContent='✗';mk.style.color='#EF4444';}
      });
    }
  });
  const pct=total?Math.round(correct/total*100):0;
  const face=pct>=80?'🏆':pct>=50?'😃':'💪';
  document.getElementById('exScore').innerHTML=`<div class="score-box">
    <div style="font-size:40px">${face}</div>
    <div class="sv">${correct} / ${total}</div>
    <div style="font-weight:800;font-size:17px;margin-top:4px">${pct>=80?'Geweldig!':pct>=50?'Goed gedaan!':'Ga zo door, jij kan het!'}</div>
  </div>`;
  addXP(correct*3);
  window.scrollTo({top:0,behavior:'smooth'});
}

  w.document.close();

function load(){

  if(!P.lessons)P.lessons={};
  LESSONS.forEach(l=>{ if(!P.lessons[l.id])P.lessons[l.id]={heard:[],games:{}}; });
}
function save(){try{localStorage.setItem('hendrik',JSON.stringify(P));}catch(e){}}
function addXP(n){P.xp+=n;save();renderTop();}

function starsOf(id){const g=P.lessons[id].games||{};return ['match','listen','sentence','say'].filter(k=>g[k]).length;}
function totalStars(){return LESSONS.reduce((s,l)=>s+starsOf(l.id),0);}
function levelOf(){return Math.floor(P.xp/100)+1;}

/* ================= AUDIO ================= */
function speak(txt){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='nl-NL';u.rate=0.75;u.pitch=1.1;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  document.getElementById('pLevel').textContent='Niveau '+levelOf();
  document.getElementById('pStars').textContent='⭐ '+totalStars();

    const s=starsOf(l.id);
    return `<div class="lcard ${s===4?'done':''}" onclick="openLesson('${l.id}')">
      <div class="em">${l.icon}</div>
      <div class="nm">${l.name}</div>
      <div class="st">${'⭐'.repeat(s)}${'☆'.repeat(4-s)}</div>
    </div>`;
  }).join('');
  renderTop();
}
function goHome(){
  document.getElementById('home').classList.remove('hide');
  document.getElementById('lesson').classList.add('hide');
  document.getElementById('exView').classList.add('hide');
  speechSynthesis&&speechSynthesis.cancel();
  renderHome();
}

/* ================= LESSON ================= */
function openLesson(id){
  curLesson=LESSONS.find(l=>l.id===id);
  curGame='words'; qi=0; locked=false; qOrder=[];
  document.getElementById('home').classList.add('hide');
  document.getElementById('lesson').classList.remove('hide');
  document.getElementById('lTitle').textContent=curLesson.icon+' '+curLesson.name;
  renderTabs();renderGame();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderTabs(){
  const g=P.lessons[curLesson.id].games||{};
  document.getElementById('tabs').innerHTML=GAMES.map(x=>
    `<button class="tab ${x.id===curGame?'active':''} ${g[x.id]?'ok':''}" onclick="pickGame('${x.id}')">${x.name}${g[x.id]?' ✓':''}</button>`).join('');
}
/* Monta a rodada do jogo atual a partir do shuffle bag do tema. */
const ROUND={match:8,listen:8,sentence:8,say:6};
function buildRound(){
  const id=curLesson.id, n=ROUND[curGame]||8;
  if(curGame==='say'){ qOrder=bagDraw('g:'+id+':say',LSay(curLesson),n); return; }
  if(curGame==='sentence'){
    const cl=LItemsOf(curLesson,'cloze');
    qOrder = cl.length ? bagDraw('g:'+id+':sentence',cl,n)
                       : bagDraw('g:'+id+':sentence-w',LWords(curLesson),n);
    return;
  }
  qOrder=bagDraw('g:'+id+':'+curGame,LWords(curLesson),n);
}
function pickGame(id){curGame=id;qi=0;locked=false;buildRound();renderTabs();renderGame();}

function renderGame(){
  ({words:gWords,match:gMatch,listen:gListen,sentence:gSentence,say:gSay})[curGame]();
}

/* ---- 1. WORDS ---- */
function gWords(){
  const st=P.lessons[curLesson.id];
  const all=st.heard.length>=LWords(curLesson).length;
  document.getElementById('panel').innerHTML=`
    <p class="prompt">Klik op elk woord en luister! 👂</p>
    <div class="wgrid">${LWords(curLesson).map((x,i)=>`
      <div class="wcard ${st.heard.includes(x.w)?'heard':''}" id="wc-${i}" onclick="hearWord(${i})">
        <div class="e">${x.e}</div><div class="w">${x.w}</div>
      </div>`).join('')}</div>
    <div class="feedback" id="fb">${all?'Alles gehoord! ⭐ Speel nu 🎯 Verbinden!':''}</div>`;
}
function hearWord(i){
  const x=LWords(curLesson)[i];
  if(!x)return;
  speak(x.w);
  const st=P.lessons[curLesson.id];
  if(!st.heard.includes(x.w)){st.heard.push(x.w);addXP(2);save();
    document.getElementById('wc-'+i).classList.add('heard');
    if(st.heard.length>=LWords(curLesson).length){document.getElementById('fb').textContent='Alles gehoord! ⭐ Speel nu 🎯 Verbinden!';}
  }
}

/* ---- 2. MATCH (emoji -> word) ---- */
function gMatch(){
  if(!qOrder.length)buildRound();
  if(qi>=qOrder.length){return finishGame('match');}
  const q=qOrder[qi];
  const wrong=shuffle(LWords(curLesson).filter(x=>x.w!==q.w)).slice(0,3);
  const opts=shuffle([q,...wrong]);
  document.getElementById('panel').innerHTML=`
    <div class="prog">${qi+1} / ${qOrder.length}</div>
    <p class="prompt">Wat is dit? 🎯</p>
    <div class="big-em">${q.e}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" id="op-${o.w}" onclick="ansMatch('${o.w}','${q.w}')">${o.w}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
  speak(q.w);
}
function ansMatch(pick,right){
  if(locked)return;locked=true;
  const ok=pick===right;
  document.getElementById('op-'+right).classList.add('right');
  if(!ok)document.getElementById('op-'+pick).classList.add('wrong');
  document.getElementById('fb').textContent=ok?'Ja! 🎉':'Het is "'+right+'" 😊';
  if(ok)addXP(10);
  speak(right);
  setTimeout(()=>{qi++;locked=false;gMatch();},1200);
}

/* ---- 3. LISTEN (word -> emoji) ---- */
function gListen(){
  if(!qOrder.length)buildRound();
  if(qi>=qOrder.length){return finishGame('listen');}
  const q=qOrder[qi];
  const wrong=shuffle(LWords(curLesson).filter(x=>x.w!==q.w)).slice(0,3);
  const opts=shuffle([q,...wrong]);
  document.getElementById('panel').innerHTML=`
    <div class="prog">${qi+1} / ${qOrder.length}</div>
    <p class="prompt">Luister en klik op het goede plaatje! 🔊</p>
    <div class="center" style="margin-bottom:12px"><button class="btn orange big" onclick="speak('${q.w}')">🔊 Nog een keer</button></div>
    <div class="opts">${opts.map(o=>`<button class="opt" id="ol-${o.w}" onclick="ansListen('${o.w}','${q.w}')"><span class="oe">${o.e}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
  setTimeout(()=>speak(q.w),350);
}
function ansListen(pick,right){
  if(locked)return;locked=true;
  const ok=pick===right;
  document.getElementById('ol-'+right).classList.add('right');
  if(!ok)document.getElementById('ol-'+pick).classList.add('wrong');
  document.getElementById('fb').textContent=ok?'Heel goed! 🌟':'Dit is "'+right+'" 😊';
  if(ok)addXP(10);
  speak(right);
  setTimeout(()=>{qi++;locked=false;gListen();},1200);
}

/* ---- 4. SENTENCE ---- */
let curOpts=[], curCorrect='', curFull='';
function gSentence(){
  if(!qOrder.length)buildRound();
  if(qi>=qOrder.length){return finishGame('sentence');}
  const q=qOrder[qi];

  /* Frases do banco (camadas 2-5) */
  if(q&&q.t==='cloze'){
    curOpts=shuffle(q.opts); curCorrect=q.correct;
    curFull=q.audio||String(q.ask).replace('___',q.correct);
    const sent=String(q.ask).replace('___','<span style="color:var(--tl-danger)">_____</span>');
    document.getElementById('panel').innerHTML=`
      <div class="prog">${qi+1} / ${qOrder.length}</div>
      <p class="prompt">Maak de zin af! 💬</p>
      <div class="word" style="font-size:30px;margin:10px 0 16px">${sent}</div>
      <div class="opts" style="grid-template-columns:1fr 1fr 1fr">${curOpts.map((o,oi)=>`<button class="opt" id="os-${oi}" onclick="ansSent2(${oi})">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>`;
    return;
  }

  /* Fallback: molde do tema + vocabulário */
  const wrong=shuffle(LWords(curLesson).filter(x=>x.w!==q.w)).slice(0,2);
  const opts=shuffle([q,...wrong]);
  const sent=curLesson.frame.replace('___','<span style="color:var(--tl-danger)">_____</span>');
  document.getElementById('panel').innerHTML=`
    <div class="prog">${qi+1} / ${qOrder.length}</div>
    <p class="prompt">Maak de zin af! 💬</p>
    <div class="big-em">${q.e}</div>
    <div class="word" style="font-size:30px;margin-bottom:14px">${sent}</div>
    <div class="opts" style="grid-template-columns:1fr 1fr 1fr">${opts.map(o=>`<button class="opt" id="os-${o.w}" onclick="ansSent('${o.w}','${q.w}')">${o.w}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
}
function ansSent2(oi){
  if(locked)return;locked=true;
  const ok=curOpts[oi]===curCorrect;
  const ci=curOpts.indexOf(curCorrect);
  const right=document.getElementById('os-'+ci); if(right)right.classList.add('right');
  if(!ok){const el=document.getElementById('os-'+oi); if(el)el.classList.add('wrong');}
  document.getElementById('fb').textContent=ok?'Perfect! 🎈':curFull;
  if(ok)addXP(10);
  speak(curFull);
  setTimeout(()=>{qi++;locked=false;gSentence();},1800);
}
function ansSent(pick,right){
  if(locked)return;locked=true;
  const ok=pick===right;
  document.getElementById('os-'+right).classList.add('right');
  if(!ok)document.getElementById('os-'+pick).classList.add('wrong');
  const full=curLesson.frame.replace('___',right);
  document.getElementById('fb').textContent=ok?'Perfect! 🎈':full;
  if(ok)addXP(10);
  speak(full);
  setTimeout(()=>{qi++;locked=false;gSentence();},1600);
}

/* ---- 5. SAY IT ---- */
let sayDone={};
function gSay(){
  if(!qOrder.length)buildRound();
  sayDone={};
  document.getElementById('panel').innerHTML=`
    <p class="prompt">Zeg het hardop! 🗣️</p>
    <p class="center" style="color:var(--tl-text-secondary);font-weight:700;margin-bottom:12px">Klik op 🔊, luister en zeg het na. De juf klikt op ✓ als je het zegt!</p>
    ${qOrder.map((s,i)=>`
      <div class="say-row" id="sr-${i}">
        <span class="e">${curLesson.icon}</span>
        <span class="t">${s.nl}</span>
        <button class="btn orange" onclick="speakSay(${i})">🔊</button>
        <button class="btn green" onclick="saidIt(${i})">✓</button>
      </div>`).join('')}
    <div class="center" style="margin-top:14px"><button class="btn orange" onclick="pickGame('say')">🔄 Andere zinnen</button></div>
    <div class="feedback" id="fb"></div>`;
}
function speakSay(i){ const s=qOrder[i]; if(s)speak(s.nl); }

function saidIt(i){
  const s=qOrder[i]; if(!s)return;
  const st=P.lessons[curLesson.id];
  if(!st.said)st.said=[];
  if(!sayDone[i]){
    sayDone[i]=1; addXP(10);
    if(st.said.indexOf(s.nl)<0)st.said.push(s.nl);
    save();
    const row=document.getElementById('sr-'+i); if(row)row.classList.add('ok');
  }
  if(Object.keys(sayDone).length>=qOrder.length)finishGame('say');
}

/* ---- FINISH ---- */
function finishGame(g){
  const st=P.lessons[curLesson.id];
  if(!st.games)st.games={};
  const first=!st.games[g];
  st.games[g]=true;save();
  renderTabs();renderTop();
  const s=starsOf(curLesson.id);
  document.getElementById('celEmoji').textContent=s===4?'🏆':'🎉';
  document.getElementById('celTitle').textContent=s===4?'Les klaar!':'Goed gedaan!';
  document.getElementById('celText').textContent=s===4
    ? curLesson.name+' is klaar! Jij hebt 4 sterren! ⭐⭐⭐⭐'
    : 'Jij hebt een ster! '+ '⭐'.repeat(s) + '  ('+s+'/4)';
  document.getElementById('cel').classList.add('show');
  if(first)addXP(20);
  qi=0;
  if(g!=='say')document.getElementById('panel').innerHTML='<div class="center"><div class="big-em">'+curLesson.icon+'</div><p class="prompt">Super! Kies een ander spel hierboven 👆</p></div>';
}
function closeCel(){document.getElementById('cel').classList.remove('show');}

function resetAll(){
  if(!confirm("Alles wissen? Dit kan niet ongedaan worden."))return;
  P={xp:0,lessons:{}};
  LESSONS.forEach(l=>P.lessons[l.id]={heard:[],games:{},said:[]});
  save();goHome();
}

load();renderHome();
</script>
